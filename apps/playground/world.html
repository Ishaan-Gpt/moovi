<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moovi world bench</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F7FAFD; font: 13px ui-sans-serif, system-ui; color: #0E1A2B; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    .ui { position: fixed; left: 16px; bottom: 16px; display: grid; gap: 6px; background: #fffc; padding: 12px; border-radius: 12px; box-shadow: 0 0 0 1px #E3EBF3; }
    label { display: grid; grid-template-columns: 90px 220px 40px; align-items: center; gap: 8px; }
    #stats { position: fixed; right: 16px; top: 12px; font-variant-numeric: tabular-nums; color: #5B6B80; }
    .tag { position: fixed; transform: translate(-50%, -100%); font-weight: 600; font-size: 12px; background: #fff; padding: 2px 6px; border-radius: 6px; box-shadow: 0 0 0 1px #E3EBF3; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="stats"></div>
  <div class="ui" id="ui"></div>
  <script type="module" src="/src/world.ts"></script>
</body>
</html>
