/* RESEND · v15 — ref 4 (Notely, instagram.com/p/DeO1Rh7x5Qm) rebuilt shot for shot in Resend's stone: one material, tiny type,

// ── the film's data. The studio's Launch (engine src/launch/skill.ts) inlines window.FILM: the site's name, its palette

// grid. Without it the page plays the Resend film it was made as (assets under its <base href>).
const FILM = (() => { const d = { name: 'Resend', font: 'Inter', fontCss: null, ramp: null, sfx: 'snd/',

// the film's camera, cast per film from the library graph's camera moves (src/launch/skill.ts castCamera)

// ── v15 · ref 4 (Notely, instagram.com/p/DeO1Rh7x5Qm) rebuilt shot for shot in Resend's stone ──
// a 3D stack of Resend's emails lands → a desk with a laptop whose screen asks the question → tiny type blurs in on a
// soft light field → "shouldn't feel like a chore." → a dark sweep: "meet" / "Resend." → a light burst, the real dashboard
// in glass pulls into focus, then defocuses into a moving field → "Send your receipts / updates / launches" → "Everything
// tracked." → "All with" → the name resolves out of scrambled letters beside the mark.
