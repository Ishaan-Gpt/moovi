<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resend · Introducing (v14)</title>
<base href="./assets/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0B0A09;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#ddd}
#wrap{position:absolute;inset:0 0 52px 0;display:grid;place-items:center}
canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:16/9;background:#0B0A09}
#bar{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;gap:12px;align-items:center;padding:0 16px;box-sizing:border-box}

input{flex:1} video{display:none}
</style></head><body>
<div id="wrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="bar"><button id="pl">Play</button><input id="sk" type="range" min="0" max="3200" value="0"><span id="tc">0.00</span></div>
<script>
/* RESEND · v12 — a shot-for-shot rebuild of ref 3 (Commas Studios, instagram.com/p/Dd_YP9Wo8c-) in Resend's brand.
   Ref 3's structure, pacing and camera, beat for beat: stipple ribbons → "Introducing" → the brand name; on black the
   mark drops and the name types beside it; the camera pulls back and the black was a phone's screen over a real
   landscape; a card lifts out ("Send"), the camera pans down onto its numbers ("Track"), a giant word sharpens
   ("Reach"); the real dashboard over the brand's own art, a sidebar click, a grid that loads blur → sharp, push-ins;
   "Know your audience." with the real Audiences card over a night plate that turns to day; the light world
   ("Broadcast to everyone.", the editor, "Ship it from your code.", a monitor in a field); the 3D mark between the two
   halves of the line; black, the mark, the name typed, a long hold. Every UI is Resend's REAL product screen from its
   own site; every plate is a real moving clip (Mixkit); palette from Resend's CSS (stone ramp). 120 BPM, 32 s. */
const W = 1920, H = 1080, DUR = 32, B = 0.5;
const cv = document.getElementById('cv'); let X = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, sc = (t, a, b) => clamp((t - a) / (b - a));
function bez(x1, y1, x2, y2) { return k => { if (k <= 0) return 0; if (k >= 1) return 1; let u = k; for (let i = 0; i < 8; i++) { const x = 3 * (1 - u) ** 2 * u * x1 + 3 * (1 - u) * u * u * x2 + u ** 3 - k, dx = 3 * (1 - u) ** 2 * x1 + 6 * (1 - u) * u * (x2 - x1) + 3 * u * u * (1 - x2); if (Math.abs(dx) < 1e-6) break; u = clamp(u - x / dx); } return 3 * (1 - u) ** 2 * u * y1 + 3 * (1 - u) * u * u * y2 + u ** 3; }; }
const E = { out: bez(0.16, 1, 0.3, 1), io: bez(0.65, 0, 0.35, 1), soft: bez(0.4, 0, 0.2, 1), in: k => k * k * k, outBack: bez(0.34, 1.32, 0.64, 1) };
const spring = k => k >= 1 ? 1 : 1 - Math.exp(-6.5 * k) * Math.cos(9.5 * k);
const logS = (S0, k) => Math.pow(S0, 1 - clamp(k));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
// the premium speed ramp as an EASING: rest → ≈2× → ≈0.5× → ≈2× → rest (@moovi/library/camera EASES['speed-ramp'])
const RAMP = (() => { const n = 512, v = u => Math.sin(Math.PI * u) ** 2 * (0.15 + 0.85 * Math.sin(2 * Math.PI * u) ** 2), acc = [0]; for (let i = 1; i <= n; i++) acc.push(acc[i - 1] + v((i - 0.5) / n) / n); return acc.map(a => a / acc[n]); })();
const ramp = u => { if (u <= 0) return 0; if (u >= 1) return 1; const f = u * 512, i = Math.floor(f); return RAMP[i] + (RAMP[i + 1] - RAMP[i]) * (f - i); };
// Resend's palette, read from its CSS: one warm stone ramp, no hue
const ST = { 950: '#0B0A09', 900: '#12110F', 850: '#191816', 800: '#22201E', 700: '#2E2B28', 600: '#464442', 500: '#6C6A67', 400: '#8C8A86', 300: '#A3A09B', 200: '#C7C2BC', 100: '#E3DED7', 50: '#EFEBE5' };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const font = (px, w = 600, f = 'Inter', it = '') => `${it}${w} ${px}px "${f}"`;
function txt(s, x, y, o = {}) { X.save(); X.font = font(o.px || 24, o.w || 500, o.f || 'Inter', o.it || ''); X.fillStyle = o.c || ST[950]; X.textAlign = o.align || 'left'; X.globalAlpha *= o.a ?? 1; try { X.letterSpacing = (o.ls ?? 0) + 'px'; } catch (e) {} X.fillText(s, x, y); X.restore(); }
function tw(s, px, w = 500, f = 'Inter', ls = 0) { X.save(); X.font = font(px, w, f); try { X.letterSpacing = ls + 'px'; } catch (e) {} const m = X.measureText(s).width; X.restore(); return m; }
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function cover(im, x, y, w, h, fx = 0.5, fy = 0.5) { const iw = im.videoWidth || im.naturalWidth || im.width, ih = im.videoHeight || im.naturalHeight || im.height; if (!iw) return; const r = Math.max(w / iw, h / ih), dw = iw * r, dh = ih * r; X.drawImage(im, x + (w - dw) * fx, y + (h - dh) * fy, dw, dh); }

// ── assets: the brand's real screens and renders, real moving plates, the logo ──
const IM = {}, VD = {};
const imgs = { logo: 'img/logo.png', metrics: 'real/screenshot-metrics.png', analytics: 'real/screenshot-zoom-analytics.png', audience: 'real/screenshot-zoom-audience.png', bheader: 'real/broadcast-email-header.png', aiEditor: 'real/ai-email-editor-cover.jpg', templates: 'real/introducing-templates.jpg', multiplayer: 'real/multiplayer-editor.jpg', headless: 'real/headless-dashboard-initiative.jpg', cubeP: 'real/cube-f.jpg', reactP: 'real/3d-react-f.jpg', bcastP: 'real/3d-broadcast-f.jpg', ctrlP: 'real/3d-control-f.jpg', valleyP: 'plates/valley.jpg', nightP: 'plates/night.jpg', fieldP: 'plates/field.jpg', skyP: 'plates/sky.jpg', m8: 'media/m8.jpg', m1: 'media/m1.jpg', m3: 'media/m3.jpg', m5: 'media/m5.jpg', m9: 'media/m9.jpg', m11: 'media/m11.jpg' };
for (const [k, s] of Object.entries(imgs)) { const im = new Image(); im.src = s; IM[k] = im; }
const vids = { valley: 'plates/valley.mp4', night: 'plates/night.mp4', field: 'plates/field.mp4', sky: 'plates/sky.mp4', cube: 'real/cube.mp4', react: 'real/3d-react.mp4', bcast: 'real/3d-broadcast.mp4', ctrl: 'real/3d-control.mp4' };
for (const [k, s] of Object.entries(vids)) { const v = document.createElement('video'); v.src = s; v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto'; document.body.appendChild(v); VD[k] = v; }
let PLAYING = false;
// a moving plate while playing (synced to the film's clock), its poster frame for stills
function plate(name, t, t0, x, y, w, h, fx, fy) { const v = VD[name]; if (PLAYING && v && v.readyState >= 2) { const want = Math.max(0, t - t0 + 1) % (v.duration || 10); if (v.paused) { v.currentTime = want; v.play().catch(() => {}); } cover(v, x, y, w, h, fx, fy); } else cover(IM[name + 'P'] || IM[name], x, y, w, h, fx, fy); }
function pauseIdle(active) { for (const [k, v] of Object.entries(VD)) if (!active.includes(k) && !v.paused) v.pause(); }

// ── sprites (baked once; blur by downsampling, never a per-frame filter) ──
const SPR = new Map(), BL = [0, 1, 2, 3, 4, 6, 8, 10, 13, 16];
function sprite(key, w, h, pad, draw) { let c = SPR.get(key); if (c) return c; c = document.createElement('canvas'); c.width = Math.ceil(w + pad * 2); c.height = Math.ceil(h + pad * 2); c.pad = pad; c.bw = w; c.bh = h; c.blurs = {}; const keep = X; X = c.getContext('2d'); try { X.translate(pad, pad); draw(); } finally { X = keep; } SPR.set(key, c); return c; }
function blurOf(c, px) { const l = BL.reduce((m, b) => Math.abs(b - px) < Math.abs(m - px) ? b : m, 0); if (!l) return c; if (c.blurs[l]) return c.blurs[l]; const k = 1 / (1 + l * 0.42), a = document.createElement('canvas'); a.width = Math.max(2, Math.round(c.width * k)); a.height = Math.max(2, Math.round(c.height * k)); const g = a.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(c, 0, 0, a.width, a.height); const b2 = document.createElement('canvas'); b2.width = Math.max(2, Math.round(a.width * 0.7)); b2.height = Math.max(2, Math.round(a.height * 0.7)); const gb = b2.getContext('2d'); gb.imageSmoothingQuality = 'high'; gb.drawImage(a, 0, 0, b2.width, b2.height); c.blurs[l] = b2; return b2; }
function put(c, x, y, w, h, o = {}) { const sx = w / c.bw, sy = h / c.bh, img = blurOf(c, (o.blur || 0) / Math.max(0.05, sx)); X.save(); X.globalAlpha *= o.a ?? 1; X.drawImage(img.bmp || img, x - c.pad * sx, y - c.pad * sy, c.width * sx, c.height * sy); X.restore(); }
const wordSpr = (s, px, wt, f, col, ls) => sprite(`w:${s}|${px}|${wt}|${f}|${col}|${ls}`, tw(s, px, wt, f, ls) + 6, px * 1.35, 24, () => txt(s, 3, px * 1.02, { px, w: wt, f, c: col, ls }));
const shadowSpr = (w, h, r, a) => sprite(`sh:${w}x${h}x${r}x${a}`, w, h, 120, () => { X.shadowColor = `rgba(11,10,9,${a})`; X.shadowBlur = 90; X.shadowOffsetY = 40; rr(0, 0, w, h, r); X.fillStyle = ST[950]; X.fill(); });
// image as a framed window (with a baked shadow), drawn at any size
function windowImg(im, x, y, w, h, r = 22, o = {}) { put(shadowSpr(800, Math.round(800 * h / w), Math.round(r * 800 / w), o.sa ?? 0.5), x, y, w, h); X.save(); rr(x, y, w, h, r); X.clip(); X.fillStyle = ST[950]; X.fillRect(x, y, w, h); if (o.crop) { const [cx, cy, cw, ch] = o.crop, iw = im.naturalWidth, ih = im.naturalHeight; X.drawImage(im, cx * iw, cy * ih, cw * iw, ch * ih, x, y, w, h); } else cover(im, x, y, w, h); X.restore(); X.save(); rr(x + 0.5, y + 0.5, w - 1, h - 1, r); X.strokeStyle = o.edge || 'rgba(239,235,229,0.16)'; X.lineWidth = 1.5; X.stroke(); X.restore(); }
function mark(x, y, s) { const im = IM.logo; X.save(); rr(x, y, s, s, s * 0.26); X.clip(); X.fillStyle = '#fff'; X.fillRect(x, y, s, s); if (im.naturalWidth) X.drawImage(im, x - s * 0.04, y - s * 0.04, s * 1.08, s * 1.08); X.restore(); }
function cursor(x, y, press = 0) { X.save(); X.translate(x, y); X.scale(1 - press * 0.14, 1 - press * 0.14); X.beginPath(); X.moveTo(0, 0); X.lineTo(0, 40); X.lineTo(10, 30); X.lineTo(18, 47); X.lineTo(25, 44); X.lineTo(18, 28); X.lineTo(31, 28); X.closePath(); X.fillStyle = 'rgba(11,10,9,0.25)'; X.translate(2, 4); X.fill(); X.translate(-2, -4); X.fillStyle = ST[50]; X.fill(); X.strokeStyle = ST[950]; X.lineWidth = 2.2; X.stroke(); X.restore(); }
const press = (t, at) => clamp(1 - Math.abs(t - at) / 0.08);

// ── type: word-by-word lines and letter-by-letter names, from sprites ──
function line(s, x, y, px, t, t0, o = {}) { // centred, words rise 10 px out of a blur; the line re-flows as it grows
  const ws = s.split(' '), col = o.c || ST[950], gap = px * 0.27, dts = ws.map((w, i) => t0 + i * (o.step ?? 0.12));
  const shown = ws.filter((_, i) => t >= dts[i]).length; if (!shown) return;
  const sp = ws.map(w => wordSpr(w, px, o.w || 500, o.f || 'Inter', col, -px * 0.02)), widths = sp.map(c => c.bw - 6);
  const total = widths.slice(0, shown).reduce((a, b) => a + b, 0) + gap * (shown - 1), full = widths.reduce((a, b) => a + b, 0) + gap * (ws.length - 1);
  const out = o.out ? E.in(sc(t, o.out, o.out + 0.3)) : 0; let cx = (o.left ? x : x - lerp(total, full, 0.35) / 2);
  ws.forEach((w, i) => { const k = E.out(sc(t, dts[i], dts[i] + 0.45)); if (k > 0) put(sp[i], cx - 3, y - px * 1.02 + (1 - k) * 10 - out * 8, sp[i].bw, sp[i].bh, { a: clamp(k * 2) * (1 - out), blur: (1 - k) * 7 + out * 10 }); cx += widths[i] + gap; });
}
function typed(s, x, y, px, t, t0, o = {}) { const n = Math.floor(clamp((t - t0) / (o.dur ?? 0.5)) * s.length); if (n <= 0) return; const part = s.slice(0, n), c = wordSpr(part, px, o.w || 600, 'Inter', o.c || ST[50], -px * 0.02); put(c, x - 3, y - px * 1.02, c.bw, c.bh, { a: o.a ?? 1 }); }

// ── worlds ──
function world(light, t) { X.fillStyle = light ? '#FBFAF8' : ST[950]; X.fillRect(0, 0, W, H); const g = X.createRadialGradient(W / 2, H * 1.18, 0, W / 2, H * 1.18, H * 0.95); g.addColorStop(0, light ? rgba(ST[200], 0.85) : rgba(ST[600], 0.55)); g.addColorStop(0.55, light ? rgba(ST[100], 0.35) : rgba(ST[700], 0.18)); g.addColorStop(1, rgba(light ? '#FBFAF8' : ST[950], 0)); X.fillStyle = g; X.fillRect(0, 0, W, H); }

// ── S1–S2 · 0–2.1 · stipple swaths sweep in; "Introducing" resolves; the name with a dot ──
const DOTS = [...Array(4200).keys()].map(i => ({ s: i % 3, u: hash(i * 1.37), v: hash(i * 7.11), z: hash(i * 3.9) }));
function stipple(t) {
  const sweep = E.io(sc(t, 0, 0.85)), settle = E.io(sc(t, 0.7, 1.4)), out = E.in(sc(t, 1.8, 2.1)), ink = sc(t, 1.05, 1.5);
  for (const d of DOTS) { const band = [-0.55, 0, 0.55][d.s], len = 0.55 + 0.25 * d.s, x0 = lerp(-0.6, 0.12, sweep) + d.s * 0.05, u = d.u;
    const x = W * (x0 + u * len * (0.85 + 0.15 * settle)) + out * (d.z - 0.2) * 700, yy = H / 2 + band * 210 * (1 - settle * 0.35) - Math.sin(u * 3 + d.s) * 40 * (1 - settle * 0.5) + (d.v - 0.5) * 120 * (1 - Math.abs(u - 0.5)) * (1 - settle * 0.3);
    const a = (0.15 + 0.5 * (1 - Math.abs(d.v - 0.5) * 2)) * clamp((sweep * 1.4 - u) * 3) * (1 - out); if (a < 0.03) continue; X.fillStyle = ink > 0 && d.z < ink * 0.9 ? ST[950] : ST[400]; X.globalAlpha = a; const r = 1.2 + d.z * 1.6; X.fillRect(x - r, yy - r, r * 2, r * 2); }
  X.globalAlpha = 1;
  if (t < 1.1) { const k = sc(t, 0.25, 0.95), c = wordSpr('Introducing', 84, 500, 'Inter', ST[950], -1.5), w = c.bw; X.save(); X.beginPath(); X.rect(W / 2 - w / 2 - 10, 0, (w + 20) * E.soft(k), H); X.clip(); put(c, W / 2 - w / 2, H / 2 - 50, w, c.bh, { a: 1 - E.in(sc(t, 0.95, 1.1)) }); X.restore(); }
  else { const k = sc(t, 1.1, 1.55), c = wordSpr('Resend', 92, 600, 'Inter', ST[950], -2.5), w = c.bw; X.save(); X.beginPath(); X.rect(W / 2 - w / 2 - 10, 0, (w + 20) * E.soft(k), H); X.clip(); put(c, W / 2 - w / 2, H / 2 - 56, w, c.bh, { a: 1 - out }); X.restore(); const dk = spring(sc(t, 1.55, 1.85)); if (dk > 0) { X.beginPath(); X.arc(W / 2 + w / 2 + 14, H / 2 + 30, 11 * dk * (1 - out), 0, 7); X.fillStyle = ST[950]; X.fill(); } }
}
// ── S3–S4 · 2.1–5.2 · on black the mark drops, the name types; the camera pulls back: the black was the phone's screen ──
function phoneBody(cx, cy, s, screen) { const w = 440 * s, h = 900 * s; put(shadowSpr(440, 900, 74, 0.55), cx - w / 2, cy - h / 2, w, h); rr(cx - w / 2, cy - h / 2, w, h, 74 * s); X.fillStyle = ST[800]; X.fill(); X.strokeStyle = 'rgba(239,235,229,0.25)'; X.lineWidth = 3 * s; X.stroke(); X.save(); rr(cx - w / 2 + 11 * s, cy - h / 2 + 11 * s, w - 22 * s, h - 22 * s, 64 * s); X.clip(); screen(cx - w / 2 + 11 * s, cy - h / 2 + 11 * s, w - 22 * s, h - 22 * s, s); X.restore(); rr(cx - 62 * s, cy - h / 2 + 26 * s, 124 * s, 34 * s, 17 * s); X.fillStyle = ST[950]; X.fill(); }
const ROWS = [['m8', 'Welcome aboard, Sam.', 'now'], ['m1', 'Your receipt', '9:12'], ['m3', 'Your order shipped', '8:40'], ['m5', 'Weekly digest', 'Tue'], ['m11', 'Product update', 'Mon']];
function inbox(x, y, w, h, s, t, a) {
  X.fillStyle = ST[950]; X.fillRect(x, y, w, h); const g = X.createRadialGradient(x + w / 2, y + h, 0, x + w / 2, y + h, h * 0.6); g.addColorStop(0, rgba(ST[600], 0.5)); g.addColorStop(1, rgba(ST[950], 0)); X.fillStyle = g; X.fillRect(x, y, w, h);
  if (a < 0.01) return;
  X.save(); X.globalAlpha = a; txt('9:41', x + 36 * s, y + 52 * s, { px: 20 * s, w: 600, c: ST[50] }); mark(x + 30 * s, y + 86 * s, 40 * s); txt('Resend', x + 82 * s, y + 116 * s, { px: 26 * s, w: 700, c: ST[50], ls: -0.6 * s });
  rr(x + w - 150 * s, y + 90 * s, 118 * s, 36 * s, 18 * s); X.strokeStyle = ST[300]; X.lineWidth = 2 * s; X.stroke(); txt('Emails', x + w - 91 * s, y + 114 * s, { px: 16 * s, w: 600, c: ST[200], align: 'center' });
  txt('Inbox', x + 30 * s, y + 186 * s, { px: 34 * s, w: 700, c: ST[50], ls: -0.8 * s });
  ROWS.forEach(([m, b, c2], k) => { const ry = y + 214 * s + k * 146 * s; rr(x + 22 * s, ry, w - 44 * s, 132 * s, 18 * s); X.fillStyle = k ? ST[900] : ST[850]; X.fill(); X.save(); rr(x + 36 * s, ry + 16 * s, 100 * s, 100 * s, 12 * s); X.clip(); cover(IM[m], x + 36 * s, ry + 16 * s, 100 * s, 100 * s); X.restore(); txt('Acme', x + 152 * s, ry + 48 * s, { px: 20 * s, w: 700, c: ST[50] }); txt(b, x + 152 * s, ry + 80 * s, { px: 18 * s, w: 500, c: ST[200] }); txt(c2, x + w - 40 * s, ry + 48 * s, { px: 15 * s, w: 500, c: ST[400], align: 'right' }); });
  X.restore();
}
function brandPhone(t) {
  const pull = ramp(sc(t, 3.25, 5.0)), S0 = 6.4, ps = 0.98 * Math.pow(S0, 1 - pull), ps0 = 0.98 * S0, cx = lerp(W / 2, W / 2, pull), cy = lerp(H / 2 + 138 * ps0, H / 2 + 60, pull) + Math.sin(t * 0.8) * 4;
  if (pull > 0.001) plate('valley', t, 3.25, -W * 0.05, -H * 0.05, W * 1.1 * (1 + (1 - pull) * 0.25), H * 1.1 * (1 + (1 - pull) * 0.25), 0.5, 0.5);
  phoneBody(cx, cy, ps, (x, y, w, h, s) => {
    inbox(x, y, w, h, s, t, E.out(sc(pull, 0.55, 0.95)));
    const fade = 1 - E.in(sc(pull, 0.35, 0.75)); if (fade <= 0) return;
    const k = spring(sc(t, 2.15, 2.55)), lx = x + w / 2, ly = y + 300 * s, slide = E.io(sc(t, 2.5, 3.0)), mx = lerp(lx, lx - 120 * s, slide);
    X.save(); X.globalAlpha = fade; X.translate(mx, ly - (1 - Math.min(k, 1)) * 60 * s); X.scale(Math.min(k, 1.06), Math.min(k, 1.06)); mark(-24 * s, -24 * s, 48 * s); X.restore();
    X.save(); X.globalAlpha = fade; typed('Resend', mx + 36 * s, ly + 16 * s, 44 * s, t, 2.55, { dur: 0.45, w: 700, c: ST[50] }); X.restore();
  });
}
// ── S5–S7 · 5.2–8.4 · a card lifts out ("Send"); the camera pans down onto real numbers ("Track"); a giant word sharpens ("Reach") ──
function sendTrack(t) {
  world(false, t);
  const lift = E.out(sc(t, 5.15, 5.7)), pan = ramp(sc(t, 6.2, 7.25)), out = E.in(sc(t, 7.25, 7.5));
  X.save(); X.globalAlpha = 1 - out; X.translate(0, -pan * 520 - out * 300);
  line('Send', W / 2, 250, 64, t, 5.35, { w: 500, c: ST[50] });
  // the welcome email card, lifted out of the inbox (real photo inside)
  const cw = 900, ch = 470, x = W / 2 - cw / 2, y = 320 + (1 - lift) * 120, s = 1 + (t - 5.2) * 0.012;
  X.save(); X.translate(W / 2, y + ch / 2); X.scale(s, s); X.translate(-W / 2, -(y + ch / 2));
  put(shadowSpr(900, 470, 30, 0.6), x, y, cw, ch); rr(x, y, cw, ch, 30); X.fillStyle = ST[900]; X.fill(); X.strokeStyle = 'rgba(239,235,229,0.15)'; X.lineWidth = 2; X.stroke();
  mark(x + 36, y + 32, 48); txt('Acme', x + 100, y + 56, { px: 24, w: 700, c: ST[50] }); txt('Welcome aboard, Sam. Here is everything you need to get started.', x + 100, y + 86, { px: 19, w: 500, c: ST[300] });
