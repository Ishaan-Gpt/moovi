<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clone R1 (motion)</title>
<style>
  @font-face { font-family: Anton; src: url(fonts/anton-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: InterTight; src: url(fonts/inter-tight-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Serif; src: url(fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); font-style: italic; }
  :root { --bg: #0b0b0d; --ink: #f2f2f2; --dim: #8a8a90; --line: #26262b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 InterTight, system-ui, sans-serif; }
  .wrap { display: flex; gap: 16px; justify-content: center; align-items: flex-start; padding: 12px 16px; height: calc(100% - 64px); }
  .pane { height: 100%; aspect-ratio: 9 / 16; position: relative; background: #000; border-radius: 10px; overflow: hidden; }
  canvas, video { width: 100%; height: 100%; display: block; }
  .tag { position: absolute; left: 8px; top: 8px; font-size: 11px; color: var(--dim); background: #000a; padding: 2px 6px; border-radius: 4px; }
  .bar { height: 52px; display: flex; gap: 12px; align-items: center; padding: 0 16px; border-top: 1px solid var(--line); }
  button { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 8px 16px; font: 600 13px InterTight, sans-serif; cursor: pointer; }
  input[type=range] { flex: 1; }
  label { color: var(--dim); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  #t { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 100px; }
  #orig { display: none; }
  body.cmp #orig { display: block; }
  @media (max-width: 700px) { body.cmp #orig { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="pane"><canvas id="c" width="1080" height="1920"></canvas><span class="tag">clone · ishaan-motion</span></div>
  <div class="pane" id="orig"><video id="v" src="../ref.mp4" muted playsinline preload="auto"></video><span class="tag">original</span></div>
</div>
<div class="bar">
  <button id="play">Play</button>
  <input id="seek" type="range" min="0" max="88.6" step="0.01" value="0">
  <span id="t">0.00 / 88.6</span>
  <label><input id="cmp" type="checkbox"> original beside</label>
  <label><input id="sfx" type="checkbox" checked> library sfx</label>
</div>
<audio id="a" src="../voice.mp3" preload="auto"></audio>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="world.js"></script>
<script src="posters.js"></script>
<script src="edit.js"></script>
</body>
</html>
