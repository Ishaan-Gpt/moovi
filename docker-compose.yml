# Everything Moovi needs on one machine: FalkorDB (memory), the studio (web), the engine worker with the Claude Code
# bridge (makes the films; /mcp for Claude Code) and Caddy (HTTPS in front of both). AWS: docs/agents/claude-code-bridge/DEPLOY-AWS.md
#   cp .env.example .env   # set MOOVI_SECRET (and SITE_ADDRESS on a server)
#   docker compose up -d --build
#   open http://localhost:3100/studio   (or https://<SITE_ADDRESS>/studio on a server)
services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    restart: unless-stopped
    volumes: [falkordb:/var/lib/falkordb/data]
    environment:
      REDIS_ARGS: --appendonly yes

  studio:
    build:
      context: .
      # a heap cap for the website build on a small server (server-setup.sh sets it under 3.5 GB of RAM)
      args: { BUILD_NODE_OPTIONS: "${BUILD_NODE_OPTIONS:-}" }
    image: moovi:latest
    restart: unless-stopped
    depends_on: [falkordb]
    # local only: the public reaches the studio through Caddy
    ports: ["127.0.0.1:3100:3100"]
    env_file: [.env]
    environment:
      FALKORDB_URL: falkor://falkordb:6379
      MOOVI_DATA_DIR: /data
    volumes: [data:/data]

  # the engine worker (makes the films) and the Claude Code bridge in ONE process: brain steps of users linked to
  # Claude Code are routed by the bridge inside the worker, so they cannot run apart. /mcp, /connect and /api/brain/*
  # reach it through Caddy on the same address as the studio (the sign-in cookie is shared).
  worker:
    image: moovi:latest
    pull_policy: never
    restart: unless-stopped
    depends_on: [falkordb, studio]
    # local only, like the studio: the public reaches the bridge through Caddy (or your own web server, --no-caddy)
    ports: ["127.0.0.1:3200:3200"]
    command: ["pnpm", "--filter", "@moovi/mcp", "exec", "tsx", "scripts/serve.ts"]
    env_file: [.env]
    environment:
      FALKORDB_URL: falkor://falkordb:6379
      MOOVI_DATA_DIR: /data
      MOOVI_BRIDGE_HOST: 0.0.0.0
      MOOVI_BRIDGE_PORT: "3200"
      # the public address Claude Code connects to and the website it sends people back to
      # (WEBSITE_URL: set it when people open Moovi on another address that proxies /studio here, e.g. a Vercel site;
      # the Settings card then works from there, and Claude Code still connects to PUBLIC_URL/mcp directly)
      MOOVI_PUBLIC_URL: ${WEBSITE_URL:-${PUBLIC_URL:-http://localhost:3100}}
      MOOVI_BRIDGE_URL: ${PUBLIC_URL:-http://localhost:3100}/mcp
      MOOVI_ORIGINS: ${PUBLIC_URL:-http://localhost:3100},${WEBSITE_URL:-}
      # models the effects and the cleanup fetch once (face, person cutout, denoise) live on the volume too
      HOME: /data/home
    # Chromium needs more shared memory than Docker's 64 MB default
    shm_size: 1gb
    # the speech model (about 760 MB, MOOVI_DATA_DIR/models) is downloaded once onto the volume, not per container
    volumes: [data:/data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # one-shot: seeds the shared craft graph and the style packages, and creates the accounts graph (safe to rerun:
  # it never touches accounts, projects or style memory)
  seed:
    image: moovi:latest
    pull_policy: never
    restart: "no"
    depends_on: [falkordb, studio]
    command: ["pnpm", "--filter", "@moovi/engine", "exec", "tsx", "scripts/reset.ts"]
    env_file: [.env]
    environment:
      FALKORDB_URL: falkor://falkordb:6379
      MOOVI_DATA_DIR: /data
    volumes: [data:/data]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    depends_on: [studio, worker]
    environment:
      # a domain (or <ip>.sslip.io) gets a free HTTPS certificate; ":80" serves plain HTTP
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  falkordb:
  data:
  caddy:
