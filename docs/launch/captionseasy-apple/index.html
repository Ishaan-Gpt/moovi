<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CaptionsEasy Keynote Film</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c110e;--fg:#e9f0ea;--acc:#34d399}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:600 14px "Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0 0 48px 0;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc((100vh - 48px)*16/9));aspect-ratio:16/9;display:block}
#bar{position:fixed;left:0;right:0;bottom:0;height:48px;display:flex;gap:14px;align-items:center;padding:0 16px;background:var(--bg)}
#bar button{all:unset;cursor:pointer;color:#0c110e;background:var(--acc);padding:7px 16px;border-radius:99px;font-weight:800}
#bar input{flex:1;accent-color:var(--acc)}
#tm{font-variant-numeric:tabular-nums;min-width:64px;text-align:right;opacity:.7}
#go{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:#0c110ef0;cursor:pointer;z-index:5}
#go b{font:italic 400 56px "Instrument Serif",Georgia,serif;color:var(--fg)}
#go span{opacity:.6}
</style></head><body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar"><button id="pp">Pause</button><input id="sk" type="range" min="0" max="1000" value="0"><span id="tm">0.0s</span></div>
<div id="go"><b>Play with sound ▸</b><span id="ld">loading…</span></div>
<script>
// CaptionsEasy launch film, keynote cut. frame(t) draws everything; time comes from the audio clock.
const W=1920,H=1080,O=1.0;           // O: voice offset, the film opens on a breath of music
const C={por:'#EFF4EE',por2:'#DCE6DD',mist:'#C3D3C6',sage:'#7C9486',gra:'#2E3833',gra2:'#46534C',
  lac:'#101613',lac2:'#18211C',grn:'#34d399',deep:'#0D6B4C',cream:'#FFFFEB',ink:'#1a1a1a',fog:'#A9BBAE'};
const SANS='"Plus Jakarta Sans",system-ui,sans-serif',SERIF='"Instrument Serif",Georgia,serif';
const cv=document.getElementById('c'),X=cv.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t;
const ph=(t,a,d)=>cl((t-a)/d);
const eo=t=>1-Math.pow(1-cl(t),4), eo5=t=>1-Math.pow(1-cl(t),5);
const eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function bez(x1,y1,x2,y2){return t=>{t=cl(t);let u=t;for(let i=0;i<8;i++){const x=3*(1-u)**2*u*x1+3*(1-u)*u*u*x2+u**3-t,dx=3*(1-u)**2*x1+6*(1-u)*u*(x2-x1)+3*u*u*(1-x2);if(Math.abs(dx)<1e-6)break;u=cl(u-x/dx)}return 3*(1-u)**2*u*y1+3*(1-u)*u*u*y2+u**3}}
const ramp=bez(.86,0,.07,1), out=bez(.16,1,.3,1), outBack=bez(.34,1.32,.64,1), soft=bez(.45,0,.2,1);
// the premium speed ramp: 2x for the first and last sixth, 0.5x through the middle
const sramp=t=>{t=cl(t);const a=1/6,v1=2,v2=.5,area=v1*a*2+v2*(1-2*a);let s;if(t<a)s=v1*t;else if(t<1-a)s=v1*a+v2*(t-a);else s=v1*a+v2*(1-2*a)+v1*(t-1+a);return soft(cl(s/area))};
const spring=(t,k=9,z=.42)=>{t=Math.max(0,t);return 1-Math.exp(-z*k*t)*Math.cos(k*Math.sqrt(1-z*z)*t)};
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}

// ---------- sprites: text is baked once per (text,font,colour,blur), frames only drawImage
const SP=new Map();
function spr(s,font,col,blur=0,glow){
  const k=s+'|'+font+'|'+col+'|'+blur+'|'+(glow||'');let c=SP.get(k);if(c)return c;
  const m=document.createElement('canvas').getContext('2d');m.font=font;const mt=m.measureText(s);
  const pad=Math.ceil(blur*3+(glow?60:8)),asc=Math.ceil(mt.actualBoundingBoxAscent||parseInt(font.match(/(\d+)px/)[1])*.8),dsc=Math.ceil(mt.actualBoundingBoxDescent||10);
  c=document.createElement('canvas');c.width=Math.ceil(mt.width)+pad*2;c.height=asc+dsc+pad*2;
  const g=c.getContext('2d');g.font=font;g.textBaseline='alphabetic';
  if(blur)g.filter=`blur(${blur}px)`;
  if(glow){g.save();g.filter=`blur(${22+blur}px)`;g.fillStyle=glow;g.globalAlpha=.9;g.fillText(s,pad,pad+asc);g.fillText(s,pad,pad+asc);g.restore();if(blur)g.filter=`blur(${blur}px)`}
  g.fillStyle=col;g.fillText(s,pad,pad+asc);
  c.ox=pad;c.oy=pad+asc;c.w=mt.width;SP.set(k,c);return c;
}
const BL=[0,2,5,9,15];
function fnt(size,w=800,f=SANS,it){return `${it?'italic ':''}${w} ${size}px ${f}`}
function tw(s,font){const c=spr(s,font,'#000');return c.w}
// one word: p 0→1 rises, blurs in, fades in. al: 'l' | 'c' | 'r'
function word(g,s,x,y,font,col,p=1,o={}){
  if(p<=0)return;const bi=Math.min(BL.length-1,Math.round((1-eo(p))*(BL.length-1)));const c=spr(s,font,col,BL[bi],o.glow);
  const w=c.w,ax=o.al==='c'?w/2:o.al==='r'?w:0;const sc=o.sc||1;
  g.save();g.globalAlpha=g.globalAlpha*(o.a??1)*cl(p*1.6);g.translate(x,y+(1-eo(p))*(o.rise??22));if(sc!==1)g.scale(sc,sc);
  g.drawImage(c,-ax-c.ox,-c.oy);g.restore();
}
// a centred line that re-flows as words arrive; ws:[{s,t,font,col,style}], returns layout for the caller
function flow(g,ws,cx,y,t,o={}){
  const gap=o.gap??0.28,sz=o.size;const items=ws.map(w=>{const font=w.font||fnt(sz,o.w||800,o.f||SANS,o.it);const p=ph(t,w.t,o.d??.42);return {...w,font,p,wd:tw(w.s,font)}});
  const sp=tw(' ',items[0].font)*(1+gap);let tot=0;items.forEach((it,i)=>{const e=eo(it.p);tot+=it.wd*e+(i?sp*e:0)});
  let x=cx-tot/2;const out=[];
  items.forEach((it,i)=>{const e=eo(it.p);if(i)x+=sp*e;if(it.p>0){(it.draw||word)(g,it.s,x,y,it.font,it.col||o.col,it.p,{rise:o.rise,a:o.a,glow:it.glow});out.push({x,w:it.wd,it})}x+=it.wd*e});
  return out;
}

// ---------- media
const CLIPS=['vlog','cooking','dance','camera','podcast','phoneselfie','editing'];
const V={},P={};let WORDS=[],LN=[];
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
const OFF={vlog:0,cooking:1.3,dance:.6,camera:2.1,podcast:.4,phoneselfie:3,editing:1.7};
function clipT(n,t){const v=V[n];const d=(v&&v.duration)||6;return ((t+OFF[n])%(d-.08)+(d-.08))%(d-.08)}
const usedNow=new Set();
function clipSrc(n,t){usedNow.add(n);const v=V[n];if(v&&v.readyState>=2)return v;return P[n]}
// cover-crop a 16:9 clip into a box; fx: focus 0..1 across the source width
function drawClip(g,n,t,x,y,w,h,fx=.5,zoom=1){
  const s=clipSrc(n,t);if(!s)return;const sw=s.videoWidth||s.width,sh=s.videoHeight||s.height;
  const k=Math.max(w/sw,h/sh)*zoom,cw=w/k,ch=h/k;const sx=cl(sw*fx-cw/2,0,sw-cw),sy=(sh-ch)/2;
  g.drawImage(s,sx,sy,cw,ch,x,y,w,h);
}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
// a soft drop shadow, baked once and stretched
let SH;function shadow(g,x,y,w,h,a=.35,spread=1){
  if(!SH){SH=document.createElement('canvas');SH.width=360;SH.height=360;const s=SH.getContext('2d');s.filter='blur(34px)';s.fillStyle='#0c1a12';s.beginPath();s.roundRect(90,90,180,180,40);s.fill()}
  g.save();g.globalAlpha=a;const px=w*.5*spread,py=h*.5*spread;g.drawImage(SH,x-px,y-py+h*.06,w+px*2,h+py*2);g.restore();
}
// a phone slab with a clip on its screen
function phone(g,cx,cy,h,clip,t,o={}){
  const w=h*.4615,x=cx-w/2,y=cy-h/2,r=h*.13,b=h*.022;
  if(!o.noShadow)shadow(g,x,y,w,h,o.sh??.42);
  g.fillStyle=C.gra;rr(g,x,y,w,h,r);g.fill();
  g.strokeStyle='#6f8378';g.lineWidth=Math.max(1,h*.004);rr(g,x+1,y+1,w-2,h-2,r);g.stroke();
  g.save();rr(g,x+b,y+b,w-b*2,h-b*2,r-b);g.clip();
  if(clip)drawClip(g,clip,t,x+b,y+b,w-b*2,h-b*2,o.fx??.5,o.zoom??1);
  if(o.screen)o.screen(g,x+b,y+b,w-b*2,h-b*2);
  g.restore();
  g.fillStyle='#0b0f0d';rr(g,cx-w*.17,y+b+h*.018,w*.34,h*.034,h*.017);g.fill();
  return {x:x+b,y:y+b,w:w-b*2,h:h-b*2};
}
// draw fn into a small canvas and stretch it back: cheap depth-of-field
const BLC=document.createElement('canvas'),BG=BLC.getContext('2d');BLC.width=W;BLC.height=H;
function blurred(g,k,fn){
  if(k<=1.05){fn(g);return}
  const w=Math.ceil(W/k),h=Math.ceil(H/k);BG.setTransform(1,0,0,1,0,0);BG.clearRect(0,0,w+2,h+2);
  BG.setTransform(1/k,0,0,1/k,0,0);fn(BG);g.save();g.setTransform(1,0,0,1,0,0);g.imageSmoothingQuality='high';g.drawImage(BLC,0,0,w,h,0,0,W,H);g.restore();
}
// backgrounds, baked once
const BGS={};function bgLight(g){if(!BGS.l){const c=document.createElement('canvas');c.width=W;c.height=H;const b=c.getContext('2d');const gr=b.createRadialGradient(W*.5,H*.42,80,W*.5,H*.5,W*.75);gr.addColorStop(0,'#F5F9F4');gr.addColorStop(.6,C.por);gr.addColorStop(1,C.por2);b.fillStyle=gr;b.fillRect(0,0,W,H);BGS.l=c}g.drawImage(BGS.l,0,0)}
function bgDark(g,bloom=0,bx=W/2,by=H/2,br=700){g.fillStyle=C.lac;g.fillRect(0,0,W,H);
  if(!BGS.b){const c=document.createElement('canvas');c.width=512;c.height=512;const b=c.getContext('2d');const gr=b.createRadialGradient(256,256,0,256,256,256);gr.addColorStop(0,'rgba(52,211,153,.55)');gr.addColorStop(.35,'rgba(30,140,100,.22)');gr.addColorStop(1,'rgba(16,22,19,0)');b.fillStyle=gr;b.fillRect(0,0,512,512);BGS.b=c}
  if(bloom>0){g.save();g.globalAlpha=cl(bloom);g.globalCompositeOperation='screen';g.drawImage(BGS.b,bx-br,by-br,br*2,br*2);g.restore()}}
// the camera: a push that is moving on frame 1 and still moving on the last frame
function cam(g,lt,d,amt,fn,fx=W/2,fy=H/2){const k=1+amt*(.15+.85*lt/d);g.save();g.translate(fx,fy);g.scale(k,k);g.translate(-fx,-fy);fn();g.restore()}
function cursor(g,x,y,press=0){g.save();g.translate(x,y);const s=1-press*.12;g.scale(s,s);g.shadowColor='rgba(10,30,20,.35)';g.shadowBlur=10;g.shadowOffsetY=4;
  g.beginPath();g.moveTo(0,0);g.lineTo(0,40);g.lineTo(10,31);g.lineTo(17,47);g.lineTo(24,44);g.lineTo(17,28);g.lineTo(30,28);g.closePath();g.fillStyle=C.cream;g.fill();g.shadowColor='transparent';g.lineWidth=2.6;g.strokeStyle=C.ink;g.lineJoin='round';g.stroke();g.restore()}
function ripple(g,x,y,p){if(p<=0||p>=1)return;g.save();g.globalAlpha=(1-p)*.8;g.strokeStyle=C.grn;g.lineWidth=4*(1-p)+1;g.beginPath();g.arc(x,y,10+eo(p)*46,0,7);g.stroke();g.restore()}
function logo(g,cx,y,size,p=1,o={}){ // "Captions" sans + "Easy" serif italic green, as on the site
  const f1=fnt(size,o.w||600),f2=fnt(size*1.08,400,SERIF,1);const w1=tw('Captions',f1),w2=tw('Easy',f2),tot=w1+w2+size*.02;
  const x=o.al==='l'?cx:cx-tot/2;word(g,'Captions',x,y,f1,o.col||C.cream,p,{rise:o.rise,glow:o.glow1});word(g,'Easy',x+w1+size*.02,y,f2,C.grn,o.p2??p,{rise:o.rise,glow:o.glow2});return {x,w:tot};
}

// ---------- the script's timing (voice word stamps; every cut and slam reads them)
const L=k=>LN[k][0].t, E=k=>LN[k].at(-1).end, Wd=(k,i)=>LN[k][i];
let S=[];
function scenes(){const c=k=>L(k)-.3;
  S=[{f:sA,a:0,b:c(2)},{f:sB,a:c(2),b:c(4)},{f:sC,a:c(4),b:c(7)},{f:sD,a:c(7),b:c(10)},{f:sE,a:c(10),b:c(11)},{f:sF,a:c(11),b:c(12)},{f:sG,a:c(12),b:E(12)+4.6}]}
let T=48;

// ===== A: every video has something to say / the world on mute (light, one take that pulls out)
const WALL={cols:7,rows:2,h:360,gap:44,y0:70};
function wallPos(c,r){const w=WALL.h*.4615,tw_=WALL.cols*w+(WALL.cols-1)*WALL.gap;return {x:W/2-tw_/2+w/2+c*(w+WALL.gap),y:WALL.y0+WALL.h/2+r*(WALL.h+WALL.gap)}}
const WCLIP=(c,r)=>c===3&&r===0?'cooking':c===2&&r===0?'dance':c===4&&r===0?'camera':CLIPS[(c*3+r*5+1)%CLIPS.length];
function sA(g,t,lt,d){
  bgLight(g);
  const l1=L(1),pull=sramp(ph(t,l1-.35,2.6));
  const tc=wallPos(3,0),s0=640/WALL.h,s=Math.pow(s0,1-pull);
  const ax=lerp(tc.x,W/2,pull),ay=lerp(tc.y,WALL.y0+WALL.h+WALL.gap/2,pull),px=W/2,py=lerp(462,452,pull);
  const drift=1+.035*(lt/d);
  const muteT=LN[1].at(-1).t;
  const rack=lerp(4.2,1,eio(ph(t,l1-.6,1.2))); // outer phones come into focus as "the world" arrives
  const draw=(gg,which)=>{gg.save();gg.translate(px,py);gg.scale(s*drift,s*drift);gg.translate(-ax,-ay+(1-eo(ph(t,0,1.6)))*60/s);
    for(let r=0;r<WALL.rows;r++)for(let c=0;c<WALL.cols;c++){const centre=r===0&&c>=2&&c<=4;if((which==='near')!==centre)continue;
      const p=wallPos(c,r),j=rnd(c*7+r*3);const bob=Math.sin(t*.9+j*6)*4;
      const sc=phone(gg,p.x,p.y+bob,WALL.h,WCLIP(c,r),t,{fx:.5,sh:.3,screen:(q,x,y,w,h)=>{
        const m=ph(t,muteT-.05+j*.28,.45);if(m<=0)return;q.fillStyle=`rgba(239,244,238,${.32*eo(m)})`;q.fillRect(x,y,w,h);
        const k=outBack(m),bx=x+w-36,by=y+40;q.save();q.translate(bx,by);q.scale(k,k);q.fillStyle='rgba(16,22,19,.78)';q.beginPath();q.arc(0,0,22,0,7);q.fill();
        q.strokeStyle=C.cream;q.fillStyle=C.cream;q.lineWidth=2.4;q.beginPath();q.moveTo(-11,-5);q.lineTo(-5,-5);q.lineTo(2,-11);q.lineTo(2,11);q.lineTo(-5,5);q.lineTo(-11,5);q.closePath();q.fill();
        q.beginPath();q.moveTo(6,-6);q.lineTo(14,6);q.moveTo(14,-6);q.lineTo(6,6);q.stroke();q.restore()}});
    }gg.restore()};
  blurred(g,rack*(1-pull)+1*pull,gg=>draw(gg,'far'));
  draw(g,'near');
  // the words sit on a soft porcelain wash
  {const gr=g.createLinearGradient(0,820,0,940);gr.addColorStop(0,'rgba(239,244,238,0)');gr.addColorStop(1,'rgba(232,239,233,.94)');g.fillStyle=gr;g.fillRect(0,820,W,H-820)}
  const l0=LN[0].map((w,i)=>({s:w.word,t:w.t-.04,font:i===5?fnt(84,400,SERIF,1):null,col:i===5?C.deep:C.gra}));
  const out0=1-ph(t,l1-.55,.4);
  g.save();g.globalAlpha=out0;flow(g,l0,W/2,968,t,{size:76,w:600});g.restore();
  if(t>l1-.2){const l=LN[1].map((w,i,a)=>({s:w.word,t:w.t-.04,font:i===a.length-1?fnt(84,400,SERIF,1):null,col:i===a.length-1?C.deep:C.gra}));flow(g,l,W/2,968,t,{size:68,w:600})}
  // iris: the night of the next scene grows out of the centre phone's mute dot
  const ir=ph(lt,d-.5,.5);if(ir>0){const p=wallPos(3,0);const m=g.getTransform();
    const dx=(p.x+WALL.h*.4615/2-36-ax)*s*drift+px,dy=(p.y-WALL.h/2+40-ay)*s*drift+py;
    g.fillStyle=C.lac;g.beginPath();g.arc(dx,dy,Math.pow(2600,ramp(ir))*1-1+20*ir,0,7);g.fill()}
}

// ===== B: so we taught the words to move / Introducing CaptionsEasy (dark)
function sB(g,t,lt,d){
  const l3=L(3),cap=Wd(3,1).t;
  const bloom=.25+.5*eo(ph(t,Wd(2,LN[2].length-1).t,.6))+.35*eo(ph(t,cap,.5))-.3*ph(t,cap+1.3,1);
  bgDark(g,bloom,W/2,H/2+20,820);
  cam(g,lt,d,.05,()=>{
    // the line, each word wearing a different caption style from the product
    const out=1-ph(t,l3-.5,.45);
    if(out>0){g.save();g.globalAlpha=out;
      const st=['plain','plain','karaoke','plain','box','plain','serif'];
      const ws=LN[2].map((w,i)=>{const sty=st[i]||'plain';const big=sty==='serif';
        return {s:w.word.replace('.',''),t:w.t-.04,font:big?fnt(150,400,SERIF,1):fnt(100,800),col:big?C.grn:C.cream,
          draw:(q,s,x,y,font,col,p)=>styled(q,sty,s,x,y,font,col,p,t,w)}});
      flow(g,ws,W/2,H/2+40,t,{size:100,gap:.2});g.restore()}
    // the reveal
    const ip=ph(t,Wd(3,0).t-.05,.6);
    if(ip>0){const fade=1-ph(lt,d-.55,.3);g.save();g.globalAlpha=fade;word(g,'Introducing',W/2,H/2-150,fnt(52,500),C.fog,ip,{al:'c'});g.restore()}
    const lp=ph(t,cap-.08,.7);
    if(lp>0)logo(g,W/2,H/2+60,170,lp,{p2:ph(t,cap+.18,.7),rise:30});
  },W/2,H/2);
}
function styled(g,sty,s,x,y,font,col,p,t,w){
  if(sty==='box'){const k=spring(t-w.t,11,.45);const wd=tw(s,font);if(p>0){g.save();g.translate(x+wd/2,y-40);g.scale(k*1.0,k);g.rotate(-.025);g.fillStyle=C.grn;rr(g,-wd/2-22,-62,wd+44,106,20);g.fill();g.restore()}
    word(g,s,x,y,font,C.ink,p);return}
  if(sty==='karaoke'){word(g,s,x,y,font,'#5d6e64',p);const f=eio(ph(t,w.t,Math.max(.25,w.end-w.t)));if(f>0){const wd=tw(s,font);g.save();g.beginPath();g.rect(x-10,y-160,(wd+20)*f,220);g.clip();word(g,s,x,y,font,C.grn,1);g.restore()}return}
  if(sty==='serif'){const k=lerp(1.5,1,outBack(ph(t,w.t,.5)));const wd=tw(s,font);g.save();g.translate(x+wd/2,y-50);g.scale(k,k);g.translate(-x-wd/2,-y+50);word(g,s,x,y,font,col,p,{glow:'rgba(52,211,153,.55)'});g.restore();return}
  word(g,s,x,y,font,col,p);
}

// ===== C: drop in a video / Whisper listens / every word lands (the product's own studio)
function studio(g,x,y,w,h,st){ // the real Studio page, in the product's own cream and ink
  shadow(g,x,y,w,h,.38,.55);g.save();rr(g,x,y,w,h,26);g.clip();g.fillStyle=C.cream;g.fillRect(x,y,w,h);
  // browser chrome
  g.fillStyle='#F2F2DC';g.fillRect(x,y,w,58);['#e8b4a6','#e9d79a','#a9d8b8'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(x+30+i*24,y+29,7,0,7);g.fill()});
  g.fillStyle='#ffffff';rr(g,x+w/2-260,y+14,520,30,15);g.fill();

// ---------- sound: voice, a synthesized keynote bed, recorded sfx; every cue reads the same timing
let ac=null,bus,buf={},vo=null;const CUES=[];
function cues(){

  q(L(6)-.55,'woosh-short',.35);LN[6].forEach(w=>q(w.t,'fs.ui.pop-9',.16,1.2));
  q(S[3].a+.05,'woosh-tight',.3);

  q(Wd(9,0).t+.03,'kenney.click',.45);q(Wd(9,1).t-.05,'tonal.chime',.25,1.12);q(Wd(9,1).t,'woosh-short',.25,1.4);q(Wd(9,3).t,'fs.impact.soft-hit',.4);
  q(S[4].a-.42,'woosh-short',.45,.9);q(Wd(10,2).t-.3,'woosh-tight',.2,1.3);q(Wd(10,2).t+.2,'finger-snap-tight',.3);q(Wd(10,4).t,'tonal.chime',.25,.9);
  q(S[5].a-.15,'fs.impact.soft-hit',.3,1.2);q(Wd(11,0).t,'fs.impact.soft-hit',.55);
  const url='captionseasy-web-app-r5ri.bolt.host';for(let i=0;i<url.length;i+=2)q(Wd(11,1).t+i/url.length*1.0,'kenney.click',.12,1.4+rnd(i)*.4);
  q(S[6].a-.45,'woosh-tight',.3,.8);q(Wd(12,0).t,'tonal.chime',.4);q(Wd(12,0).t,'fs.impact.soft-hit',.35,.8);

const SFX=['kenney.click','ui.pop','fs.ui.pop-9','woosh-tight','woosh-short','fs.impact.soft-hit','riser-short','tonal.chime','fs.foley.water-drop','finger-snap-tight'];
const midi=n=>440*Math.pow(2,(n-69)/12);
const CH=[[50,54,57,61,64],[47,50,54,57,61],[43,47,50,54,57],[45,49,52,59,64]];  // Dmaj9, Bm9, Gmaj9, A6/9
function notes(){ // a keynote bed: a pad that breathes, a glass arpeggio, a soft pulse; sections follow the story
  const N=[],bar=2.5,e=.3125;const end=T;
  for(let b=0;b*bar<end;b+=2){const ch=CH[(b/2)%4],t0=b*bar;const last=t0+bar*2>=S[6].a;
    ch.forEach((m,k)=>N.push({t:t0,d:last?7:bar*2+.6,f:midi(m),k:'pad',g:.032}));}

    const ch=CH[Math.floor(t/5)%4],i=Math.round(t/e);const m=ch[[0,2,4,3,1,3,2,4][i%8]]+12;if(sec===1&&i%2)continue;N.push({t,d:.9,f:midi(m),k:'pluck',g:sec===1?.035:.045})}

}
function playNote(n,when){const g=ac.createGain(),o=ac.createOscillator();o.connect(g);g.connect(bus.mus);
  if(n.k==='pad'){o.type='triangle';o.frequency.value=n.f;const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=n.f*1.003;o2.connect(g);

    g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(n.g,when+1.4);g.gain.setValueAtTime(n.g,when+n.d-1.2);g.gain.linearRampToValueAtTime(0,when+n.d);o2.start(when);o2.stop(when+n.d+.05)}
  else if(n.k==='pluck'){o.type='sine';o.frequency.value=n.f;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(n.g,when+.006);g.gain.exponentialRampToValueAtTime(.0005,when+n.d)}
  else if(n.k==='kick'){o.type='sine';o.frequency.setValueAtTime(120,when);o.frequency.exponentialRampToValueAtTime(42,when+.14);g.gain.setValueAtTime(n.g,when);g.gain.exponentialRampToValueAtTime(.001,when+n.d)}
  else {o.type='sine';o.frequency.value=n.f;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(n.g,when+.08);g.gain.exponentialRampToValueAtTime(.001,when+n.d)}
  o.start(when);o.stop(when+n.d+.05)}
let NOTES=[];
function graph(){bus={};bus.out=ac.createGain();bus.out.gain.value=.95;const comp=ac.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.2;bus.out.connect(comp);comp.connect(ac.destination);
  bus.mus=ac.createGain();bus.mus.gain.value=.9;bus.mus.connect(bus.out);bus.sfx=ac.createGain();bus.sfx.gain.value=.8;bus.sfx.connect(bus.out);bus.vo=ac.createGain();bus.vo.gain.value=1;bus.vo.connect(bus.out)}
let acBase=0,tBase=0;
function sched(from){if(bus)bus.out.disconnect();graph();const now=ac.currentTime+.05;acBase=now;tBase=from;

}
// ---------- player
let playing=false,t=0,last=0,withSound=false;

function syncVideos(t){for(const n of CLIPS){const v=V[n];if(!v)continue;if(usedNow.has(n)&&playing){if(v.paused)v.play().catch(()=>{});const want=clipT(n,t);if(Math.abs(v.currentTime-want)>.35)v.currentTime=want}else if(!v.paused)v.pause()}}

window.renderAt=async t0=>{playing=false;t=t0;frame(t0);const ps=[];for(const n of usedNow){const v=V[n];if(!v)continue;ps.push(new Promise(r=>{const w=clipT(n,t0);if(Math.abs(v.currentTime-w)<.02)return r();v.onseeked=()=>r();v.currentTime=w;setTimeout(r,1500)}))}await Promise.all(ps);frame(t0);return cv.toDataURL('image/jpeg',.82)};
window.sweep=(fps=20)=>{const errs=[];let worst=0;for(let tt=0;tt<T;tt+=1/fps){const a=performance.now();try{frame(tt)}catch(e){errs.push([tt.toFixed(2),e.message])}worst=Math.max(worst,performance.now()-a)}return {errs:errs.slice(0,10),n:errs.length,worst:+worst.toFixed(1)}};
async function boot(){
