<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Moovi Decision Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a blueprint sheet. Toolbar on top, a pan/zoom drawing on the left, the node's file card on the right (stacked on phones). Black and white only. */
:root {
  --bg: #ffffff; --ink: #0a0a0a; --mute: #666666; --soft: #f2f2f2; --hair: #d4d4d4; --grid: #ececec;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0b0b; --ink: #f3f3f3; --mute: #9b9b9b; --soft: #171717; --hair: #333333; --grid: #161616; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0b0b0b; --ink: #f3f3f3; --mute: #9b9b9b; --soft: #171717; --hair: #333333; --grid: #161616; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; }
.app { height: 100%; display: flex; flex-direction: column; }
header { padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--ink); display: flex; flex-direction: column; gap: 10px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--mute); letter-spacing: 0.02em; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.lab { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); margin-right: 2px; }
button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--ink); border-radius: 0; padding: 5px 10px; cursor: pointer; font-size: 12.5px; line-height: 1.2; }
button:hover { background: var(--soft); }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, .node:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.zoom button { width: 32px; padding: 5px 0; font-family: var(--f-mono); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 390px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
.stage.drag { cursor: grabbing; }
svg#map { width: 100%; height: 100%; display: block; user-select: none; }
.hint { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; font-family: var(--f-mono); font-size: 11px; color: var(--mute); background: var(--bg); border: 1px solid var(--hair); padding: 4px 8px; pointer-events: none; }
aside { border-left: 1px solid var(--ink); overflow-y: auto; min-width: 0; padding-block: 18px 28px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
aside h2 { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.15; margin: 0; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--ink); padding: 2px 6px; }
.chip.inv { background: var(--ink); color: var(--bg); }
.chip.dash { border-style: dashed; }
.sec { display: flex; flex-direction: column; gap: 6px; }
.sec h3 { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--mute); margin: 0; border-bottom: 1px solid var(--hair); padding-bottom: 4px; }
.sec p { margin: 0; line-height: 1.55; max-width: 62ch; }
table.rules { border-collapse: collapse; width: 100%; font-size: 13px; }
table.rules td { border-top: 1px solid var(--hair); padding: 6px 4px 6px 0; vertical-align: top; line-height: 1.4; }
table.rules td:first-child { width: 52%; color: var(--mute); padding-right: 10px; }
table.rules td:last-child { font-weight: 500; }
ul.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
ul.files li { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }
.links { display: flex; flex-direction: column; gap: 4px; }
.links button { text-align: left; border-color: var(--hair); display: flex; gap: 8px; justify-content: space-between; }
.links button span:last-child { font-family: var(--f-mono); font-size: 11px; color: var(--mute); white-space: nowrap; }
ol.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 3px; line-height: 1.4; }
ol.steps button { border: 0; padding: 0; text-align: left; background: none; text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; }
.legend { display: grid; grid-template-columns: 34px 1fr; gap: 8px 10px; align-items: center; font-size: 13px; }
.legend svg { width: 34px; height: 20px; }
/* drawing */
.node { cursor: pointer; }
.node .shape { fill: var(--bg); stroke: var(--ink); stroke-width: 1.2; }
.node.decision .shape { stroke-width: 2; }
.node.graph .shape { stroke-dasharray: 6 4; stroke-width: 1.5; }
.node.out .shape { fill: var(--ink); }
.node.out text { fill: var(--bg); }
.node.ref .shape { stroke-dasharray: 1.5 3; stroke-width: 1.6; stroke-linecap: round; }
.node.stop .shape { stroke-width: 3; }
.node.jump .shape { stroke-width: 1.2; }
.node.offmain .shape { stroke-dasharray: 2 3; }
.node text { fill: var(--ink); }
.node .tt { font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.node .ts { font-family: var(--f-body); font-size: 12px; }
.node .tg { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.08em; }
.node .tr { font-family: var(--f-body); font-size: 11.5px; }
.node .trk { font-family: var(--f-mono); font-size: 11px; }
.node .rule { stroke: var(--hair); stroke-width: 1; }
.node.out .rule { stroke: var(--mute); }
.node:hover .shape { stroke-width: 2.4; }
.node.sel .shape { stroke-width: 3.2; }
.edge path { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.edge text { font-family: var(--f-mono); font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.edge.hot path { stroke-width: 2.6; }
.uses path { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 2 4; stroke-linecap: round; }
.lane-title { font-family: var(--f-display); font-weight: 600; font-size: 28px; fill: var(--ink); letter-spacing: 0.01em; }
.lane-sub { font-family: var(--f-mono); font-size: 12px; fill: var(--mute); }
.lane-rule { stroke: var(--ink); stroke-width: 1; }
.band { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; fill: var(--mute); }
.dim { opacity: 0.14; }
@media (prefers-reduced-motion: no-preference) { .node, .edge, .dim { transition: opacity 160ms ease; } }
@media (max-width: 860px) {
  .app { height: auto; }
  main { grid-template-columns: 1fr; }
  .stage { height: 64vh; }
  aside { border-left: 0; border-top: 1px solid var(--ink); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>

<div class="app">
  <header>
    <div class="titlerow">
      <h1>Moovi, from a message to a video</h1>
      <span class="meta" id="counts"></span>
    </div>
    <div class="bar">
      <div class="grp" role="group" aria-label="Try a message">
        <span class="lab">Try a message</span>
        <button id="p-words" data-path="words" aria-pressed="false">“a 30 s video about coffee”</button>
        <button id="p-link" data-path="link" aria-pressed="false">“a video for cal.com”</button>
        <button id="p-clip" data-path="clip" aria-pressed="false">clip + “edit this”</button>
        <button id="p-style" data-path="style" aria-pressed="false">Dark Vox + a link</button>
        <button id="p-copy" data-path="copy" aria-pressed="false">clip + “make one like this video”</button>
      </div>
    </div>
    <div class="bar">
      <div class="grp" role="group" aria-label="Lanes">
        <span class="lab">Lane</span>
        <button id="l-all" data-lane="all" aria-pressed="true">All</button>
        <button id="l-auto" data-lane="auto" aria-pressed="false">Auto</button>
        <button id="l-edit" data-lane="edit" aria-pressed="false">Your clip</button>
        <button id="l-style" data-lane="style" aria-pressed="false">Picked style</button>
        <button id="l-crew" data-lane="crew" aria-pressed="false">Old crew</button>
        <button id="l-refs" data-lane="refs" aria-pressed="false">References</button>
      </div>
      <div class="grp" role="group" aria-label="Show">
        <span class="lab">Light up</span>
        <button id="t-graph" data-flag="graph" aria-pressed="false">Graph reads</button>
        <button id="t-model" data-flag="model" aria-pressed="false">Model calls</button>
        <button id="t-off" data-flag="off" aria-pressed="false">Not reached</button>
      </div>
      <div class="grp zoom" role="group" aria-label="Zoom">
        <button id="z-in" title="Zoom in">+</button>
        <button id="z-out" title="Zoom out">−</button>
        <button id="z-fit" title="Fit everything" style="width:auto;padding:5px 10px;font-family:var(--f-body)">Fit</button>
      </div>
    </div>
  </header>
  <main>
    <div class="stage" id="stage">
      <svg id="map" role="img" aria-label="Moovi's decision tree from a chat message to a finished video"></svg>
      <div class="hint">drag to move · scroll or pinch to zoom · click a box</div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

  sw(`<rect x="1" y="2" width="32" height="16" rx="1" style="fill:var(--ink);stroke:var(--ink)"/>`, 'A result you get (filled)');
  sw(`<rect x="1" y="2" width="32" height="16" rx="1" style="${st};stroke-width:3"/>`, 'Stops and waits for you');
  sw(`<rect x="1" y="2" width="32" height="16" rx="1" style="${st};stroke-width:1.4;stroke-dasharray:1.5 2.5"/>`, 'Not reached from the studio, or a reference (dotted)');
  lg.appendChild(g);
  const p = sec('Start here');
  const l = h('div', 'links');
  Object.entries(PATHS).forEach(([k, v]) => { const b = h('button'); b.appendChild(h('span', '', v.t)); b.appendChild(h('span', '', 'trace')); b.onclick = () => walk(k); l.appendChild(b); });
  p.appendChild(l);
  sec('Source').appendChild(h('p', '', 'Read from the code on main at fc051c4 (chat.ts, router/, edit/, styles/, tasks/, review/). Dotted boxes are not reached from the studio: on a branch, uncommitted, or only called by scripts.'));
}

// ---------- modes ----------
function walk(k) {
  const p = PATHS[k]; if (!p) return;
  for (const m of ALL) m.g.classList.remove('sel'); drawUses(null);
  const set = new Set(p.n);
  const seq = p.n;
  setLit(seq, e => { const i = seq.indexOf(e.f); return i >= 0 && set.has(e.t) && (seq[i + 1] === e.t || seq.indexOf(e.t) > i); });
  pressed('[data-path]', document.querySelector(`[data-path="${k}"]`)); pressed('[data-flag]', null);
  panel.innerHTML = '';
  const chips = h('div', 'chips'); chips.appendChild(h('span', 'chip inv', 'Traced message')); panel.appendChild(chips);
  panel.appendChild(h('h2', '', p.t));
  sec('Why it goes this way').appendChild(h('p', '', p.why));
  const s = sec(`The route, ${seq.length} boxes`), ol = h('ol', 'steps');
  seq.forEach(id => { const li = h('li'); const b = h('button', '', byId[id].t); b.onclick = () => select(id, true); li.appendChild(b); ol.appendChild(li); });
  s.appendChild(ol);
  fit(boxOf(seq), 30);
}
document.querySelectorAll('[data-path]').forEach(b => b.onclick = () => walk(b.dataset.path));
document.querySelectorAll('[data-lane]').forEach(b => b.onclick = () => {
  const lane = b.dataset.lane; pressed('[data-lane]', b); clearModes();
  for (const m of ALL) m.g.classList.remove('sel'); drawUses(null);
  if (lane === 'all') { setLit(null); home(); fit(BOUNDS); return; }
  const ids = ALL.filter(n => n.lane === lane).map(n => n.id);
  const extra = lane === 'refs' ? [] : ['d1', 'd2', 'd3', 'd4'].filter(d => EDGES.some(e => e.f === d && ids.includes(e.t)));
  setLit([...ids, ...extra]);
  gLanes.querySelectorAll('g[data-lane]').forEach(g => g.classList.toggle('dim', g.dataset.lane !== lane));
  fit(boxOf([...ids, ...extra]), 30);
  panel.innerHTML = ''; panel.appendChild(h('h2', '', LANES[lane]));
  const blurb = {
    auto: 'The default for a plain prompt. Auto doesn’t make a film itself: it picks one of the styles (by keywords for a link, by the script for plain words), may add a kit’s colours, then hands over to that style.',
    edit: 'Your own clip, edited and playing live in seconds: words and faces, a plan of cuts and framings, library moves and sounds, captions and a clean voice.',
    style: 'One of six styles runs its own pipeline: read, write, voice, cast from its own set-ups, borrow from the library on weak beats, mix, play live.',
    crew: 'The original multi-agent path. Slow, and still where “make one like this video” goes. The only lane that checks its own render on main.',
    refs: 'Where the references and memories feed in. Click one to draw its lines to the boxes that use it.',
  }[lane];
  sec('This lane').appendChild(h('p', '', blurb));
  const s = sec('Boxes'), l = h('div', 'links'); ids.forEach(i => l.appendChild(linkBtn(i, byId[i].kind === 'decision' ? 'decision' : ''))); s.appendChild(l);
});
document.querySelectorAll('[data-flag]').forEach(b => b.onclick = () => {
  const f = b.dataset.flag, was = b.getAttribute('aria-pressed') === 'true';
  for (const m of ALL) m.g.classList.remove('sel'); drawUses(null); pressed('[data-path]', null);
  if (was) { pressed('[data-flag]', null); setLit(null); home(); return; }
  pressed('[data-flag]', b);
  const ids = ALL.filter(n => f === 'graph' ? n.graph : f === 'model' ? n.model : n.offmain).map(n => n.id);
  setLit(ids, () => false);
  panel.innerHTML = '';
  panel.appendChild(h('h2', '', { graph: 'Where the graph is read', model: 'Where a model is called', off: 'What the studio does not reach' }[f]));
  sec('Summary').appendChild(h('p', '', {
    graph: 'Dashed boxes read FalkorDB while a video is made. The library graph is read for the kit match, the edit’s casting, inserts on weak beats and every sound effect; the styles graph holds each style’s memory; feedback memory only steers the old crew.',
    model: 'The live lanes call a model once or twice: Auto’s director, the style’s brief, the speech-to-text for your clip. The old crew calls models in loops.',
    off: 'Work that exists but no user reaches from the studio: edit by words and CHECK (on main, called only by scripts), the review step for the styles (uncommitted on your disk), the Launch style, and the teardown notes.',
  }[f]));
  const s = sec(`${ids.length} boxes`), l = h('div', 'links'); ids.forEach(i => l.appendChild(linkBtn(i))); s.appendChild(l);
});

home();
requestAnimationFrame(() => fit(BOUNDS));
</script>

</html>
