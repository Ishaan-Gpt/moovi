<style>
/* Layout: a blueprint sheet. One spine down the middle, stage bands across, the owning agent in the left margin; the card for the clicked box on the right (below on phones). Black and white only. */
:root {
  --bg: #ffffff; --ink: #0a0a0a; --mute: #666666; --soft: #f2f2f2; --hair: #d4d4d4; --grid: #efefef;
  --p0: #d23b3b; --p1: #e8860c; --p2: #c9a400; --p3: #2f9a52;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0b0b; --ink: #f3f3f3; --mute: #9b9b9b; --soft: #171717; --hair: #333333; --grid: #141414; --p0: #ef5a5a; --p1: #f59a2e; --p2: #e2c23a; --p3: #4cc173; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0b0b0b; --ink: #f3f3f3; --mute: #9b9b9b; --soft: #171717; --hair: #333333; --grid: #141414; --p0: #ef5a5a; --p1: #f59a2e; --p2: #e2c23a; --p3: #4cc173; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; }
.app { height: 100%; display: flex; flex-direction: column; }
header { padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--ink); display: flex; flex-direction: column; gap: 9px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--mute); letter-spacing: 0.02em; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.lab { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); margin-right: 2px; }
button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--ink); border-radius: 0; padding: 5px 10px; cursor: pointer; font-size: 12.5px; line-height: 1.2; }
button:hover { background: var(--soft); }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, .node:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.zoom button { min-width: 32px; padding: 5px 8px; font-family: var(--f-mono); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
.stage.drag { cursor: grabbing; }
svg#map { width: 100%; height: 100%; display: block; user-select: none; }
.hint { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; font-family: var(--f-mono); font-size: 11px; color: var(--mute); background: var(--bg); border: 1px solid var(--hair); padding: 4px 8px; pointer-events: none; }
aside { border-left: 1px solid var(--ink); overflow-y: auto; min-width: 0; padding-block: 18px 28px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
aside h2 { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.15; margin: 0; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--ink); padding: 2px 6px; }
.chip.inv { background: var(--ink); color: var(--bg); }
.chip.dash { border-style: dashed; }
.sec { display: flex; flex-direction: column; gap: 6px; }
.sec h3 { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--mute); margin: 0; border-bottom: 1px solid var(--hair); padding-bottom: 4px; }
.sec p { margin: 0; line-height: 1.55; max-width: 62ch; }
table.rules { border-collapse: collapse; width: 100%; font-size: 13px; }
table.rules td { border-top: 1px solid var(--hair); padding: 6px 4px 6px 0; vertical-align: top; line-height: 1.4; }
table.rules td:first-child { width: 50%; color: var(--mute); padding-right: 10px; }
table.rules td:last-child { font-weight: 500; }
ul.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
ul.files li { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }
.links { display: flex; flex-direction: column; gap: 4px; }
.links button { text-align: left; border-color: var(--hair); display: flex; gap: 8px; justify-content: space-between; }
.links button span:last-child { font-family: var(--f-mono); font-size: 11px; color: var(--mute); white-space: nowrap; }
ol.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 3px; line-height: 1.4; }
ol.steps button { border: 0; padding: 0; text-align: left; background: none; text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; }
.legend { display: grid; grid-template-columns: 34px 1fr; gap: 8px 10px; align-items: center; font-size: 13px; }
.legend svg { width: 34px; height: 20px; }
table.cmp { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.cmp th { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); text-align: left; padding: 4px 6px 4px 0; }
table.cmp td { border-top: 1px solid var(--hair); padding: 6px 6px 6px 0; vertical-align: top; line-height: 1.4; }
table.cmp td:first-child { color: var(--mute); }
/* drawing */
.node { cursor: pointer; }
.node .shape { fill: var(--bg); stroke: var(--ink); stroke-width: 1.2; }
.node.decision .shape { stroke-width: 2; }
.node.out .shape { fill: var(--ink); }
.node.out text { fill: var(--bg); }
.node.out .badge { stroke: var(--bg); }
.node.out .badge.full { fill: var(--bg); }
.node.stop .shape { stroke-width: 3; }
.node.type .bandtop { fill: var(--ink); }
.node.root .shape { stroke-width: 2.4; }
.node text { fill: var(--ink); }
.node .tt { font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.node .ts { font-family: var(--f-body); font-size: 12px; }
.node .tg { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.08em; }
.node .tr { font-family: var(--f-body); font-size: 11.5px; }
.node .trk { font-family: var(--f-mono); font-size: 11px; }
.node .rule { stroke: var(--hair); stroke-width: 1; }
.node .badge { fill: var(--bg); stroke: var(--ink); stroke-width: 1.2; }
.node .badge.full { fill: var(--ink); }
.node .half { fill: var(--ink); }
.node.out .half { fill: var(--bg); }
.node:hover .shape { stroke-width: 2.4; }
.node.sel .shape { stroke-width: 3.4; }
.edge path { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.edge text { font-family: var(--f-mono); font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.edge.hot path { stroke-width: 2.6; }
.rel path { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 2 4; stroke-linecap: round; }
.band-num { font-family: var(--f-display); font-weight: 600; font-size: 46px; fill: var(--ink); }
.band-title { font-family: var(--f-display); font-weight: 600; font-size: 26px; fill: var(--ink); }
.band-sub { font-family: var(--f-mono); font-size: 12.5px; fill: var(--mute); letter-spacing: 0.04em; }
.band-rule { stroke: var(--ink); stroke-width: 1; }
.band-rule.soft { stroke: var(--hair); }
.dim { opacity: 0.13; }
.node .pbar { stroke: none; }
.node .ptint { stroke: none; opacity: 0.13; }
.node.lv0 .pbar, .node.lv0 .ptint { fill: var(--p0); }
.node.lv1 .pbar, .node.lv1 .ptint { fill: var(--p1); }
.node.lv2 .pbar, .node.lv2 .ptint { fill: var(--p2); }
.node.lv3 .pbar, .node.lv3 .ptint { fill: var(--p3); }
.chip.lv0 { border-color: var(--p0); color: var(--p0); } .chip.lv1 { border-color: var(--p1); color: var(--p1); } .chip.lv2 { border-color: var(--p2); color: var(--p2); } .chip.lv3 { border-color: var(--p3); color: var(--p3); }
@media (prefers-reduced-motion: no-preference) { .node, .edge, .dim { transition: opacity 160ms ease; } }
@media (max-width: 860px) {
  .app { height: auto; }
  main { grid-template-columns: 1fr; }
  .stage { height: 64vh; }
  aside { border-left: 0; border-top: 1px solid var(--ink); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>

<div class="app">

    <aside id="panel" aria-live="polite"></aside>

</div>

// ---------- highlight ----------

  for (const e of EDGES) { const hot = edgeOn ? edgeOn(e) : (!!on && on.has(e.f) && on.has(e.t)); e.g.classList.toggle('dim', !!on && !hot); e.g.classList.toggle('hot', !!on && hot); }
}
function drawRel(n) {

const pressed = (sel, btn) => document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
function clearAll() { pressed('[data-path]', null); pressed('[data-status]', null); for (const n of N) n.g.classList.remove('sel'); drawRel(null); }
function clearSel() { clearAll(); pressed('[data-agent]', document.querySelector('[data-agent="all"]')); setLit(null); home(); }

// ---------- panel ----------
const panel = document.getElementById('panel');
const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  panel.appendChild(h('h2', '', n.t));

  if (n.rules && n.rules.length) { const s = sec(n.kind === 'decision' ? 'The decision' : n.kind === 'type' ? 'The type' : 'The rules'), t = h('table', 'rules'); for (const [c, o] of n.rules) { const tr = h('tr'); tr.appendChild(h('td', '', (n.kind === 'decision' ? 'if ' : '') + c)); tr.appendChild(h('td', '', '→ ' + o)); t.appendChild(tr); } s.appendChild(t); }

  if (PROGRESS[id] && PROGRESS[id][1]) sec('Progress').appendChild(h('p', '', `${LV[lvOf(id)]}: ${PROGRESS[id][1]} (as of ${PROGRESS_AT})`));
  if (n.today) sec('From today’s code').appendChild(h('p', '', n.today));

  const outs = EDGES.filter(e => e.f === id), ins = EDGES.filter(e => e.t === id);
  if (outs.length) { const s = sec('Leads to'), l = h('div', 'links'); outs.forEach(e => l.appendChild(linkBtn(e.t, e.label || AG[byId[e.t].agent]))); s.appendChild(l); }
  if (ins.length) { const s = sec('Comes from'), l = h('div', 'links'); ins.forEach(e => l.appendChild(linkBtn(e.f, e.label || AG[byId[e.f].agent]))); s.appendChild(l); }

}
function home() {

  const c = sec('Today → proposed'), t = h('table', 'cmp');
  const tr0 = h('tr'); tr0.appendChild(h('th', '', 'Today')); tr0.appendChild(h('th', '', 'Proposed')); t.appendChild(tr0);
  [['4 lanes (Auto, edit, style, crew)', '1 pipeline; a video adds 6 prep steps'],
   ['regex picks a style, reason in a log', 'you pick one of 7 types, or Moovi says it in one line'],
   ['10 agents in code, other desks in the studio', '8 agents, the same 8 everywhere; building is code'],
   ['clones reach users as a palette', 'every part mapped into a library slice and a skill branch'],
   ['one ishaan-motion skill, unused by users’ films', 'a tree: shared laws + one branch per type, read by the Designer'],
   ['two caption systems', 'one global preset set; 1 default + 2 alternates per type'],

  c.appendChild(t);

  ag.appendChild(tb);
  ag.appendChild(h('p', '', 'An agent exists only if it makes decisions. Builder becomes code; Asset Hunter joins Researcher; Scribe becomes Writer; Voice becomes Sound.'));

  const st = 'fill:var(--bg);stroke:var(--ink)';
  sw(`<rect x="1" y="2" width="32" height="16" rx="1" style="${st};stroke-width:1.2"/>`, 'A step or a rule set');
  sw(`<polygon points="7,2 27,2 33,10 27,18 7,18 1,10" style="${st};stroke-width:2"/>`, 'A decision');
  sw(`<rect x="1" y="2" width="32" height="16" style="${st};stroke-width:1.2"/><rect x="1" y="2" width="32" height="4" style="fill:var(--ink)"/>`, 'A video type');
  sw(`<rect x="1" y="2" width="32" height="16" style="fill:var(--ink);stroke:var(--ink)"/>`, 'A result');
  sw(`<rect x="12" y="5" width="10" height="10" style="fill:var(--ink);stroke:var(--ink)"/>`, 'Exists today');
  sw(`<rect x="12" y="5" width="10" height="10" style="${st}"/><polygon points="12,15 22,5 22,15" style="fill:var(--ink)"/>`, 'Partly built');

  lg.appendChild(g);

  p.appendChild(l);
}
function walk(k) {
  const p = PATHS[k]; if (!p) return; clearAll();
  const seq = p.n, set = new Set(seq);

  pressed('[data-path]', document.querySelector(`[data-path="${k}"]`));
  panel.innerHTML = '';
  const chips = h('div', 'chips'); chips.appendChild(h('span', 'chip inv', 'Traced example')); panel.appendChild(chips);
  panel.appendChild(h('h2', '', p.t));
  sec('What happens').appendChild(h('p', '', p.why));
  const s = sec(`The route, ${seq.length} boxes`), ol = h('ol', 'steps');

document.querySelectorAll('[data-path]').forEach(b => b.onclick = () => walk(b.dataset.path));

  const s = sec(`${ids.length} boxes`), l = h('div', 'links'); ids.forEach(i => l.appendChild(linkBtn(i))); s.appendChild(l);
});
document.querySelectorAll('[data-prog]').forEach(b => b.onclick = () => {
  const l = Number(b.dataset.prog), was = b.getAttribute('aria-pressed') === 'true'; clearAll();
