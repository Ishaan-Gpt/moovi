<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H1 Dead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Antonio:wght@300&family=Inter+Tight:wght@500;800&display=block">
<style>
  :root { --bg: #0d1013; --ink: #eef3f6; --dim: #8b969d; --line: #232a30; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 "Inter Tight", system-ui, sans-serif; }
  .wrap { display: flex; gap: 12px; justify-content: center; align-items: center; padding: 12px 16px; height: calc(100% - 52px); flex-wrap: wrap; }
  .pane { position: relative; background: #000; border-radius: 8px; overflow: hidden; }
  #main { aspect-ratio: 16 / 9; width: min(100%, calc((100vh - 76px) * 16 / 9)); }
  body.cmp #main { width: min(calc(60% - 6px), calc((100vh - 76px) * 16 / 9)); }
  #orig { display: none; aspect-ratio: 4 / 3; width: min(calc(40% - 6px), calc((100vh - 76px) * 4 / 3)); }
  body.cmp #orig { display: block; }
  canvas, video { width: 100%; height: 100%; display: block; }
  .tag { position: absolute; left: 8px; top: 8px; font-size: 11px; color: var(--dim); background: #000a; padding: 2px 6px; border-radius: 4px; }
  .bar { height: 44px; display: flex; gap: 14px; align-items: center; padding: 0 16px; border-top: 1px solid var(--line); }
  button { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 7px 16px; font: 600 13px "Inter Tight", sans-serif; cursor: pointer; }
  input[type=range]#seek { flex: 1; }
  label { color: var(--dim); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  #t { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 90px; }
  @media (max-width: 760px) { body.cmp #main, body.cmp #orig { width: 100%; } .bar { flex-wrap: wrap; height: auto; padding: 8px 16px; } }
</style>
</head>
<body class="cmp">
<div class="wrap">
  <div class="pane" id="main"><canvas id="c" width="1920" height="1080"></canvas><span class="tag">H1 · 1920×1080 · drawn stand-in</span></div>
  <div class="pane" id="orig"><video id="v" src="/data/demo/refs/h1/ref.mp4" controls playsinline preload="auto"></video><span class="tag">original (first 1.45 s)</span></div>
</div>
<div class="bar">
  <button id="play">Play</button>
  <input id="seek" type="range" min="0" max="2.6" step="0.01" value="0">
  <span id="t">0.00 / 2.6</span>
  <label>speed <select id="rate"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label>
  <label><input id="sfx" type="checkbox" checked> Style 1 sfx</label>
  <label><input id="cmpb" type="checkbox" checked onchange="document.body.classList.toggle('cmp', this.checked)"> original beside</label>
</div>
<script type="module" src="h1.js"></script>
</body>
</html>
