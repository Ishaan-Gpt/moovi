<title>Moovi Hook</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:opsz,wght@6..96,400&family=Instrument+Serif:ital@0;1&family=Tinos:ital@1&family=Antonio:wght@300&family=Archivo+Black&family=Inter+Tight:wght@500;800&display=block">
<script type="importmap">{ "imports": { "three": "/node_modules/.pnpm/three@0.170.0/node_modules/three/build/three.module.js" } }</script>
<style>
  :root { --bg: #0d1013; --ink: #eef3f6; --dim: #8b969d; --line: #232a30; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 "Inter Tight", system-ui, sans-serif; }
  .wrap { display: flex; justify-content: center; align-items: center; padding: 12px 16px; height: calc(100% - 52px); }
  canvas { aspect-ratio: 16 / 9; width: min(100%, calc((100vh - 76px) * 16 / 9)); display: block; border-radius: 8px; background: #000; }
  .bar { height: 44px; display: flex; gap: 14px; align-items: center; padding: 0 16px; border-top: 1px solid var(--line); }
  button { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 7px 16px; font: 600 13px "Inter Tight", sans-serif; cursor: pointer; }
  #seek { flex: 1; } label { color: var(--dim); display: flex; gap: 6px; align-items: center; } #t { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 90px; }
</style>
</head>
<body>
<div class="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<div class="bar"><button id="play">Play</button><input id="seek" type="range" min="0" max="6.4" step="0.01" value="0"><span id="t">0.00 / 6.4</span>
<label>speed <select id="rate"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label></div>
<script type="module" src="hook.js"></script>
</body>
</html>
