<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Moovi One Pipeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a blueprint sheet. One spine down the middle, stage bands across, the owning agent in the left margin; the card for the clicked box on the right (below on phones). Black and white only. */
:root {
  --bg: #ffffff; --ink: #0a0a0a; --mute: #666666; --soft: #f2f2f2; --hair: #d4d4d4; --grid: #efefef;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0b0b; --ink: #f3f3f3; --mute: #9b9b9b; --soft: #171717; --hair: #333333; --grid: #141414; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0b0b0b; --ink: #f3f3f3; --mute: #9b9b9b; --soft: #171717; --hair: #333333; --grid: #141414; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; }
.app { height: 100%; display: flex; flex-direction: column; }
header { padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--ink); display: flex; flex-direction: column; gap: 9px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--mute); letter-spacing: 0.02em; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.lab { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); margin-right: 2px; }
button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--ink); border-radius: 0; padding: 5px 10px; cursor: pointer; font-size: 12.5px; line-height: 1.2; }
button:hover { background: var(--soft); }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, .node:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.zoom button { min-width: 32px; padding: 5px 8px; font-family: var(--f-mono); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
.stage.drag { cursor: grabbing; }
svg#map { width: 100%; height: 100%; display: block; user-select: none; }
.hint { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; font-family: var(--f-mono); font-size: 11px; color: var(--mute); background: var(--bg); border: 1px solid var(--hair); padding: 4px 8px; pointer-events: none; }
aside { border-left: 1px solid var(--ink); overflow-y: auto; min-width: 0; padding-block: 18px 28px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
aside h2 { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.15; margin: 0; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--ink); padding: 2px 6px; }
.chip.inv { background: var(--ink); color: var(--bg); }
.chip.dash { border-style: dashed; }
.sec { display: flex; flex-direction: column; gap: 6px; }
.sec h3 { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--mute); margin: 0; border-bottom: 1px solid var(--hair); padding-bottom: 4px; }
.sec p { margin: 0; line-height: 1.55; max-width: 62ch; }
table.rules { border-collapse: collapse; width: 100%; font-size: 13px; }
table.rules td { border-top: 1px solid var(--hair); padding: 6px 4px 6px 0; vertical-align: top; line-height: 1.4; }
table.rules td:first-child { width: 50%; color: var(--mute); padding-right: 10px; }
table.rules td:last-child { font-weight: 500; }
ul.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
ul.files li { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }
.links { display: flex; flex-direction: column; gap: 4px; }
.links button { text-align: left; border-color: var(--hair); display: flex; gap: 8px; justify-content: space-between; }
.links button span:last-child { font-family: var(--f-mono); font-size: 11px; color: var(--mute); white-space: nowrap; }
ol.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 3px; line-height: 1.4; }
ol.steps button { border: 0; padding: 0; text-align: left; background: none; text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; }
.legend { display: grid; grid-template-columns: 34px 1fr; gap: 8px 10px; align-items: center; font-size: 13px; }
.legend svg { width: 34px; height: 20px; }
table.cmp { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.cmp th { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); text-align: left; padding: 4px 6px 4px 0; }
table.cmp td { border-top: 1px solid var(--hair); padding: 6px 6px 6px 0; vertical-align: top; line-height: 1.4; }
table.cmp td:first-child { color: var(--mute); }
/* drawing */
.node { cursor: pointer; }
.node .shape { fill: var(--bg); stroke: var(--ink); stroke-width: 1.2; }
.node.decision .shape { stroke-width: 2; }
.node.out .shape { fill: var(--ink); }
.node.out text { fill: var(--bg); }
.node.out .badge { stroke: var(--bg); }
.node.out .badge.full { fill: var(--bg); }
.node.stop .shape { stroke-width: 3; }
.node.type .bandtop { fill: var(--ink); }
.node.root .shape { stroke-width: 2.4; }
.node text { fill: var(--ink); }
.node .tt { font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.node .ts { font-family: var(--f-body); font-size: 12px; }
.node .tg { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.08em; }
.node .tr { font-family: var(--f-body); font-size: 11.5px; }
.node .trk { font-family: var(--f-mono); font-size: 11px; }
.node .rule { stroke: var(--hair); stroke-width: 1; }
.node .badge { fill: var(--bg); stroke: var(--ink); stroke-width: 1.2; }
.node .badge.full { fill: var(--ink); }
.node .half { fill: var(--ink); }
.node.out .half { fill: var(--bg); }
.node:hover .shape { stroke-width: 2.4; }
.node.sel .shape { stroke-width: 3.4; }
.edge path { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.edge text { font-family: var(--f-mono); font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.edge.hot path { stroke-width: 2.6; }
.rel path { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 2 4; stroke-linecap: round; }
.band-num { font-family: var(--f-display); font-weight: 600; font-size: 46px; fill: var(--ink); }
.band-title { font-family: var(--f-display); font-weight: 600; font-size: 26px; fill: var(--ink); }
.band-sub { font-family: var(--f-mono); font-size: 12.5px; fill: var(--mute); letter-spacing: 0.04em; }
.band-rule { stroke: var(--ink); stroke-width: 1; }
.band-rule.soft { stroke: var(--hair); }
.dim { opacity: 0.13; }
@media (prefers-reduced-motion: no-preference) { .node, .edge, .dim { transition: opacity 160ms ease; } }
@media (max-width: 860px) {
  .app { height: auto; }
  main { grid-template-columns: 1fr; }
  .stage { height: 64vh; }
  aside { border-left: 0; border-top: 1px solid var(--ink); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>

<div class="app">
  <header>
    <div class="titlerow">
      <h1>Moovi, proposed: one pipeline, eight agents, taste that compounds</h1>
      <span class="meta" id="counts"></span>
    </div>
    <div class="bar">
      <div class="grp" role="group" aria-label="Trace an example">
        <span class="lab">Trace</span>
        <button data-path="launch" aria-pressed="false">“launch video for cal.com”</button>
        <button data-path="explain" aria-pressed="false">“explain how our API works”</button>
        <button data-path="edit" aria-pressed="false">my talking-head clip</button>
        <button data-path="ref" aria-pressed="false">I send a new reference</button>
      </div>
    </div>
    <div class="bar">
      <div class="grp" role="group" aria-label="Agents">
        <span class="lab">Agent</span>
        <button data-agent="all" aria-pressed="true">All</button>
        <button data-agent="moovi" aria-pressed="false">Moovi</button>
        <button data-agent="editor" aria-pressed="false">Editor</button>
        <button data-agent="researcher" aria-pressed="false">Researcher</button>
        <button data-agent="writer" aria-pressed="false">Writer</button>
        <button data-agent="sound" aria-pressed="false">Sound</button>
        <button data-agent="designer" aria-pressed="false">Designer</button>
        <button data-agent="lens" aria-pressed="false">Lens</button>
        <button data-agent="keeper" aria-pressed="false">Keeper</button>
      </div>
      <div class="grp" role="group" aria-label="Status">
        <span class="lab">Built?</span>
        <button data-status="exists" aria-pressed="false">Exists</button>
        <button data-status="partial" aria-pressed="false">Partly</button>
        <button data-status="new" aria-pressed="false">New</button>
      </div>
      <div class="grp zoom" role="group" aria-label="Zoom">
        <button id="z-in" title="Zoom in">+</button>
        <button id="z-out" title="Zoom out">−</button>
        <button id="z-fit" title="Fit everything">Fit</button>
      </div>
    </div>
  </header>
  <main>
    <div class="stage" id="stage">
      <svg id="map" role="img" aria-label="Proposed Moovi pipeline: one way in, a type picked, eight stages each owned by one agent, and the taste system that improves every type"></svg>
      <div class="hint">drag to move · scroll or pinch to zoom · click a box</div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

<script>
// ---------- the proposal ----------
const AG = { moovi: 'Moovi', editor: 'Editor', researcher: 'Researcher', writer: 'Writer', sound: 'Sound', designer: 'Designer', code: 'Code (no agent)', lens: 'Lens', keeper: 'Keeper', you: 'You' };
const STATUS = { exists: 'Exists', partial: 'Partly built', new: 'New' };
const S = 1550, L = 700, R = 2470;
const TX = [470, 830, 1190, 1550, 1910, 2270, 2630];
const RX = i => 300 + i * 360;

const BANDS = [
  { id: 'in', n: '0', t: 'One way in', s: 'MOOVI · EDITOR when you give a video' },
  { id: 'type', n: '1', t: 'Pick the type', s: 'MOOVI · one of seven, never a regex guess' },
  { id: 'gather', n: '2', t: 'Gather', s: 'RESEARCHER · the tools decision tree' },
  { id: 'write', n: '3', t: 'Write', s: 'WRITER · the type’s beat map' },
  { id: 'sound', n: '4', t: 'Sound', s: 'SOUND · voice, music grid, mapped sfx' },
  { id: 'design', n: '5', t: 'Design', s: 'DESIGNER · cast every beat from the type’s library' },
  { id: 'build', n: '6', t: 'Build', s: 'CODE · one clock, no agent' },
  { id: 'check', n: '7', t: 'Check', s: 'LENS · on every film, never blocks the preview' },
  { id: 'keep', n: '8', t: 'Remember', s: 'KEEPER · your reactions become rules' },
  { id: 'taste', n: 'T', t: 'The taste system', s: 'HOW EVERY TYPE GETS BETTER · your only job is references' },
  { id: 'motion', n: 'M', t: 'The ishaan-motion tree', s: 'ONE BRANCH PER TYPE · the taste as numbers and bans' },
  { id: 'lib', n: 'L', t: 'One library, every piece mapped', s: 'FALKORDB · each asset knows its types and its moment' },
];

const N = [
  // 0 · way in
  { id: 'in', band: 'in', x: S, top: 0, kind: 'start', agent: 'you', status: 'exists', w: 300, t: 'Your idea, link or video', s: 'one box; no style menu needed',
    d: 'One input. You can type an idea, paste a link, drop a video, or tap a type card. You never have to write a good prompt: the type and its skill carry the craft.',
    today: 'The studio chat box, plus a style menu and an Auto option. The menu goes; type cards replace it.', goal: 'Goal 2: anyone gets a post-worthy video without worrying about the prompt.' },
  { id: 'q0', band: 'in', x: S, after: 'in', kind: 'decision', agent: 'moovi', status: 'exists', w: 280, t: 'Did you give a video?', s: '',
    rules: [['a video file', 'the Editor prepares it first, then the same pipeline'], ['an idea or a link', 'straight to picking the type']],
    d: 'Editing is generation with your footage as the main track. So a video only adds a preparation layer in front; every stage after it is the same.',
    today: 'Today an upload goes to a separate edit lane, a picked style to another, a plain brief to Auto, and “like this video” to the old crew: four lanes.', goal: 'One pipeline, as you asked.' },
  { id: 'p1', band: 'in', x: L, row: 'q0', kind: 'step', agent: 'editor', status: 'exists', t: 'Hear and look', s: 'words, language lock, faces',
    d: 'Every word timed in the right language, and the speaker’s face found, at the same time.', today: 'edit/hear.ts and edit/look.ts on main (YuNet in Node).' },
  { id: 'p2', band: 'in', x: L, after: 'p1', kind: 'rules', agent: 'editor', status: 'partial', w: 300, t: 'Clean cut, never a bare jump', s: 'the cover rule',
    rules: [['slates, retakes, fillers, long pauses', 'cut, at Light / Balanced / Tight'], ['every cut', 'gets a cover: punch-in, transition, motion graphic or B-roll'], ['a cut inside a word', 'never']],
    d: 'Cutting is only half; what makes it premium is that no two pieces meet abruptly. The cover is picked by the Designer from the type’s library in stage 5.',
    today: 'Cuts snapped to words exist (edit/build.ts). The cover rule and the three levels are new.' },
  { id: 'p3', band: 'in', x: L, after: 'p2', kind: 'step', agent: 'editor', status: 'partial', t: 'Grade', s: 'one look per type',
    d: 'Exposure and colour balanced, then the type’s grade. Asked twice, a grade replaces itself, never stacks.', today: 'Grade presets exist in the kits and Clip Moment; not applied to every edit.' },
  { id: 'p4', band: 'in', x: L, after: 'p3', kind: 'step', agent: 'editor', status: 'exists', t: 'Clean the voice', s: 'denoise, −14 LUFS',
    d: 'The ffmpeg chain: rumble cut, RNNoise, gate, de-ess, compressor, loudness.', today: 'edit/voice.ts on main.' },
  { id: 'p5', band: 'in', x: L, after: 'p4', kind: 'step', agent: 'editor', status: 'partial', t: 'Reframe on the speaker', s: '9:16 from anything',
    d: 'Crops follow the face; a landscape clip sits whole over a blurred fill when no face is known.', today: 'Face crop and blur fill exist; speaker-aware reframe across people is new.' },
  { id: 'p6', band: 'in', x: L, after: 'p5', kind: 'step', agent: 'editor', status: 'new', t: 'Your clip = the main track', s: 'joins the pipeline',
    d: 'The cleaned clip, its words and faces go forward as the film’s main track. From here an edit is treated exactly like a generated film: typed, written (the transcript is the script), scored, designed, checked.',
    today: 'Today the edit lane ends in its own player and never meets the styles.' },

  // 1 · type
  { id: 'q1', band: 'type', x: S, after: ['q0', 'p6'], gap: 130, kind: 'decision', agent: 'moovi', status: 'new', w: 330, t: 'Which type of video?', s: 'say it in one line',
    rules: [['you tapped a type card', 'that type'], ['you gave a video', 'Edit'], ['your words name one (launch, showreel, explain, kinetic…)', 'that type'], ['still unclear', 'Moovi picks, says why in one line; asks only if two types fit equally']],
    d: 'The type is the single biggest decision, so it is made openly: Moovi states “A launch film for cal.com, 24 s, cut to music” before anything runs, and you can change it with one tap.',
    today: 'Today keyword regexes pick a style and the reason is only in the server log.', goal: 'No guessing behind your back.' },
  { id: 'ty-edit', band: 'type', x: TX[0], after: 'q1', kind: 'type', agent: 'moovi', status: 'partial', w: 320, t: 'Edit my video', s: 'look: Edit (Base → Atlas, Handmade, Minimal)', rel: ['mb-edit'],
    d: 'Your talking head, podcast clip or demo, edited in full: cuts with covers, captions, components burned in, 3–5 effects, B-roll on spoken ideas, music and sfx.',
    rules: [['style today', 'the edit lane, Base look (3 of 3 on the benchmark)'], ['looks waiting', 'Atlas, Handmade, Studio Minimal (Tab’s branches)'], ['references', 'Tab’s E1–E6 and I1–I6, R8 captions'], ['caption default', 'punch word-by-word']] },
  { id: 'ty-launch', band: 'type', x: TX[1], row: 'ty-edit', kind: 'type', agent: 'moovi', status: 'partial', w: 320, t: 'Launch', s: 'style: Launch (12 looks, 10 arcs)', rel: ['mb-launch'],
    d: 'An 18–30 s product launch, cut to music, the drop on the reveal, the product shown for real.',
    rules: [['style today', 'Launch (ishaan/launch-style, not merged), plus Style 1’s site capture'], ['references', 'l01–l12'], ['score', 'best 5.50 vs reference 7.88'], ['caption default', 'none; big set type']] },
  { id: 'ty-reel', band: 'type', x: TX[2], row: 'ty-edit', kind: 'type', agent: 'moovi', status: 'partial', w: 320, t: 'Showreel', s: 'style: Clip Moment + reel kits', rel: ['mb-reel'],
    d: 'A montage cut to the beat grid: footage, your clips, every moment used once.',
    rules: [['style today', 'Clip Moment (stock clip per line)'], ['references', 'R2 level-ladder, R5 night-glass'], ['caption default', 'gold punch (cm-gold)']] },
  { id: 'ty-brand', band: 'type', x: TX[3], row: 'ty-edit', kind: 'type', agent: 'moovi', status: 'partial', w: 320, t: 'Brand post', s: 'style: Editorial, Dark Vox for stories', rel: ['mb-brand'],
    d: 'A post about the brand that is not a launch or a reel: an idea, a story, a point of view.',
    rules: [['style today', 'Editorial (s4); Dark Vox as its story look'], ['references', 'R1 crimson-poster, R3 golden-hand (7.6), R4 red-table'], ['caption default', 'editorial mixed']] },
  { id: 'ty-saas', band: 'type', x: TX[4], row: 'ty-edit', kind: 'type', agent: 'moovi', status: 'partial', w: 320, t: 'SaaS explainer', s: 'style: Explainer (Style 1 + Clear Signal)', rel: ['mb-saas'],
    d: 'What the product does and how, in steps, with real screens.',
    rules: [['style today', 'Style 1 + Clear Signal; Anatomy as the “how it works” look'], ['references', 'Style 1 plans, Anatomy figures'], ['caption default', 'clean keyword']] },
  { id: 'ty-ui', band: 'type', x: TX[5], row: 'ty-edit', kind: 'type', agent: 'moovi', status: 'new', w: 320, t: 'UI morph', s: 'style: new, one shape through every state', rel: ['mb-ui'],
    d: 'One UI element that never cuts, morphing through the product’s states under a cursor.',
    rules: [['style today', 'none; seeds: l09, l06, 109 library UI pieces'], ['references', 'need 5 (have 2)'], ['caption default', 'none']] },
  { id: 'ty-kin', band: 'type', x: TX[6], row: 'ty-edit', kind: 'type', agent: 'moovi', status: 'new', w: 320, t: 'Kinetic type', s: 'style: new, type is the hero', rel: ['mb-kin'],
    d: 'Words as the picture, timed to the voice or the music.',
    rules: [['style today', 'none; seeds: l02, kin-type caption, the visual renderer’s kinetic captions'], ['references', 'need 5 (have 1)'], ['caption default', 'the type is the caption']] },
  { id: 'k1', band: 'type', x: S, after: 'ty-edit', gap: 80, kind: 'rules', agent: 'moovi', status: 'new', w: 420, graph: true, t: 'Load the type’s kit', s: 'everything the type needs, one read', rel: ['m0', 'l0'],
    rules: [['its skill', 'the type’s branch of ishaan-motion'], ['its library', 'every asset marked for this type'], ['its beat map', 'length, hook time, beats, end card'], ['its presets', 'captions, grade, music energy, sfx map'], ['its memory', 'what it used lately, your rules']],
    d: 'A type is a skill plus a library plus presets. Loading it is one graph read, so every later stage works from the same, small, mapped set instead of the whole library.',
    today: 'Today each style carries its own code library, the graph is read in four separate places, and kits only pass a palette.' },

  // 2 · gather
  { id: 'g0', band: 'gather', x: S, after: 'k1', gap: 130, kind: 'step', agent: 'researcher', status: 'partial', t: 'Gather what the film needs', s: 'runs beside the writing',
    d: 'The Researcher decides which tools this film needs and runs them in parallel. Nothing is fetched that the type does not use.',
    today: 'Researcher (site capture) and Asset Hunter (footage) are two agents today; they merge here.' },
  { id: 'g1', band: 'gather', x: R, row: 'g0', kind: 'rules', agent: 'researcher', status: 'partial', w: 380, t: 'Tools decision tree', s: 'use a tool only when it helps',
    rules: [['a link', 'read the site; brand kit measured from its CSS: colours, logo, fonts'], ['the type shows the product (Launch, UI morph, Explainer)', 'capture screens and a scroll video'], ['…and no link or screens', 'ask once for a link or screenshots'], ['a line names something real and the type uses footage', 'footage finder: Mixkit, Pexels, Pixabay, Commons'], ['nothing real to show, nothing to capture', 'a generated image, or a drawn set-up'], ['a place', 'a map'], ['a hero object', 'a 3D prop'], ['a number', 'a counter or chart component']],
    d: 'Every tool is mapped to the moment it earns its place, so tools are never used for show.',
    today: 'Exists: site capture (research/capture.ts), theme colour, footage finder with 6 sources, maps, render3d. New: brand measured from CSS, image generation (no tool for it in the repo today).' },

  // 3 · write

// ---------- highlight ----------
