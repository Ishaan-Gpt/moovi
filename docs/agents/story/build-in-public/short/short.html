<script>
/* short.html: "The Stillest Man Alive", the stickman short made inside the one-hour run (build-in-public long form, 2026-11-03).
   Built on the Stickman Games kit (arena, sky, cast, studio grade) and the cold-open page's camera helpers (ep1/cold/cold3.html).
   One rule, one visible danger: while the clock runs nobody moves; anyone who twitches drops through their gold circle.
   Shots, cut on words (timing.js, word index):
     A  0    the fifty in their circles, a crane down            B  5    #50 (Ordinary) looks up: "the only player..."
     C  19   the clock on the crest starts                        D  28   the rule proven: Pulse twitches, his circle drops him

     I  93   the swat, then his circle opens                      J  103  one by one the circles open (high wide)

     M  137  pull out: one man standing, forty-nine open holes
   The story clock ticks one second per second from 7.4 s on the film clock, and is only seen in C and J.
   ?t= &embed=1 &nocap=1 &shot=E */
window.__errs = []; window.addEventListener('error', e => window.__errs.push(String(e.message) + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
(async function () { try {
'use strict';
window.FILM_BAND_ND = 0;
const QS = new URLSearchParams(location.search), TM = window.SHORT, DUR = TM.dur;

const HEAD = ['reflex', 'turbo', 'clockwork', 'countdown', 'brain', 'moneybags', 'lonely', 'dash', 'freeze', 'pulse'];

const fallY = (i, t) => { const u = t - DROP[i] - OPEN_T * .55; return u <= 0 ? 0 : -.5 * 1600 * u * u; };

function stand(a, i, face, t, k) { const c = cw(i); a.fx.pose(t); a.rig.root.position.copy(c); a.rig.root.rotation.set(0, Math.atan2(face.x - c.x, face.z - c.z), 0);

{ const U = window.SG_UNIFORM, M = (c, o) => new THREE.MeshPhysicalMaterial(Object.assign({ color: lin(c), roughness: .8, envMap: A.env, envMapIntensity: .5 }, o || {}));

    [new THREE.CylinderGeometry(8, 7.2, 20, 12), mG, [-7, 36, 0]], [new THREE.CylinderGeometry(8, 7.2, 20, 12), mG, [7, 36, 0]],
    [new THREE.CylinderGeometry(14.5, 16, 34, 16), mU, [0, 62, 0]], [new THREE.CylinderGeometry(4.8, 4.4, 16, 8), mG, [-19.5, 70, 0]], [new THREE.CylinderGeometry(4.8, 4.4, 16, 8), mG, [19.5, 70, 0]],
    [new THREE.CylinderGeometry(3, 2.8, 22, 8), mK, [-20, 52, 0]], [new THREE.CylinderGeometry(3, 2.8, 22, 8), mK, [20, 52, 0]],
    [new THREE.SphereGeometry(7, 12, 8).scale(1, .7, 1.5), mS, [-6.5, 2.5, 3]], [new THREE.SphereGeometry(7, 12, 8).scale(1, .7, 1.5), mS, [6.5, 2.5, 3]],
    [new THREE.SphereGeometry(29, 22, 16), mH, [0, 106, 0]], [new THREE.SphereGeometry(7.5, 14, 10).scale(1, 1.25, .5), mE, [-9.5, 110, 26]], [new THREE.SphereGeometry(7.5, 14, 10).scale(1, 1.25, .5), mE, [9.5, 110, 26]],
    [new THREE.SphereGeometry(4.2, 12, 8).scale(1, 1.2, .4), mK, [-8.6, 110, 29.5]], [new THREE.SphereGeometry(4.2, 12, 8).scale(1, 1.2, .4), mK, [8.6, 110, 29.5]]];
  const used = new Set(Object.values(SPOT)), ids = []; for (let i = 0; i < 50; i++) if (!used.has(i)) ids.push(i);
  parts.forEach(([geo, m, o]) => { geo.translate(o[0], o[1], o[2]); const im = new THREE.InstancedMesh(geo, m, ids.length); im.castShadow = true; crowd.add(im); CROWD.push(im); });
  crowd.userData.ids = ids; }
const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), one = V(1, 1, 1);
function crowdAt(t) { const ids = crowd.userData.ids;
  ids.forEach((i, n) => { const c = cw(i), y = fallY(i, t); q4.setFromAxisAngle(V(0, 1, 0), Math.atan2(-c.x, -c.z) + Math.sin(i * 1.7) * .5);
    m4.compose(V(c.x, c.y + y, c.z), q4, y < -150 ? V(0, 0, 0) : one); CROWD.forEach(im => im.setMatrixAt(n, m4)); });
  CROWD.forEach(im => { im.instanceMatrix.needsUpdate = true; }); }

// ---------- the trophy at the centre, the fly ----------
A.vault.group.visible = false;
const TRO = window.makeTrophy ? window.makeTrophy(THREE, { env: A.env }) : null;
if (TRO) { S.add(TRO.group); TRO.group.position.set(0, 0, 0); shadowed(TRO.group); }
const fly = new THREE.Group(); fly.scale.setScalar(1.6); S.add(fly);   // a black fly on a black head: big pale wings carry it
{ const body = new THREE.Mesh(new THREE.SphereGeometry(2.6, 12, 8).scale(1, .8, 1.6), new THREE.MeshStandardMaterial({ color: lin('#1d1a12'), roughness: .9, metalness: 0 })); fly.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(1.3, 10, 8), body.material); head.position.z = 2.7; fly.add(head);

  fly.userData.w = [-1, 1].map(s => { const w = new THREE.Mesh(new THREE.CircleGeometry(2.9, 16).scale(.55, 1, 1), wm); w.position.set(s * 2.3, 1.5, -.5); w.rotation.set(-Math.PI / 2, 0, s * .4); fly.add(w); return w; }); }

// ---------- body acting ----------
function runOnSpot(rig, t, k) {   // can never stop running: legs pump, arms swing, a little bob (feet stay over the circle)
  const J = rig.joints, f = 2.6, ph = t * f * Math.PI * 2;
  ['L', 'R'].forEach((n, i) => { const s = Math.sin(ph + (i ? Math.PI : 0));
    J['leg' + n].rotation.x = lerp(J['leg' + n].rotation.x, -1.15 * Math.max(0, s) + .2, k); J['shin' + n].rotation.x = lerp(J['shin' + n].rotation.x, 1.7 * Math.max(0, s), k);

  J.hips.position.y += Math.abs(Math.sin(ph)) * 5 * k; rig.root.position.y += Math.abs(Math.sin(ph)) * 4 * k; J.torso.rotation.x = lerp(J.torso.rotation.x, .16, k); }

  const u = t - t0; if (u < 0 || u > .5) return; const J = rig.joints, k = Math.exp(-u * 9) * (u < .25 ? .5 : 1) * Math.sin(u * 60);

function swat(rig, t, t0) {       // the right hand snaps up to the nose, faster than a thought
  const J = rig.joints, k = clamp((t - t0) / .12, 0, 1), back = clamp((t - t0 - .45) / .35, 0, 1), s = k * (1 - back * .6);

  J.armR.rotation.set(lerp(-1.1, Q[0], s), lerp(-.5, Q[1], s), lerp(-.6, Q[2], s)); J.foreArmR.rotation.set(lerp(-1.5, Q[3], s), Q[4] * s, lerp(.4, Q[5], s)); J.head.rotation.x += .12 * s; }

// ---------- shots ----------
const SHOTS = [['A', 0], ['A2', WT(3)], ['B', WT(5)], ['C', WT(19)], ['D', WT(28)], ['E', WT(41)], ['F', WT(61)], ['G', WT(69)], ['G2', WT(75)], ['H', WT(89)], ['I', WT(96)], ['J', WT(106)], ['K', WT(112)], ['L', WT(126)], ['M', WT(140)]];
const shotAt = t => { let s = SHOTS[0]; for (const x of SHOTS) if (t >= x[1]) s = x; return s; };
const CLOCK0 = 6.3, clockAt = t => t < CLOCK0 ? 60 : Math.max(0, 60 - (t - CLOCK0));
function setCam(p, l, fov, roll) { cam.fov = fov; cam.near = 1; cam.far = 400000; cam.updateProjectionMatrix(); cam.position.copy(p); cam.up.set(0, 1, 0); cam.lookAt(l); if (roll) cam.rotateZ(roll); cam.updateMatrixWorld(); }
function frameOn(subj, dirToCam, d, fov, xs, ys) {
  const f = dirToCam.clone().normalize().multiplyScalar(-1), right = V().crossVectors(f, V(0, 1, 0)).normalize(), up = V().crossVectors(right, f).normalize();
  const th = Math.tan(fov * D2R / 2), tw = th * 16 / 9, p = subj.clone().addScaledVector(dirToCam.clone().normalize(), d);
  return { p, l: subj.clone().addScaledVector(right, -xs * tw * d).addScaledVector(up, -ys * th * d) };
}
const sideOf = i => { const c = cw(i), out = c.clone().setY(0).normalize(); return { c, out, side: V(-out.z, 0, out.x) }; };
function shot(t) {
  const SH = QS.get('shot'), [id, t0] = SH ? [SH, SHOTS.find(s => s[0] === SH)[1]] : shotAt(t), u = t - t0, dur = ((SHOTS[SHOTS.findIndex(s => s[0] === id) + 1] || [0, DUR])[1]) - t0;
  DROP[SPOT.turbo] = (id === 'E' || id === 'F') ? TURBO_REPLAY : TURBO_LIVE;
  for (let i = 0; i < 50; i++) { A.circle(i).light(i === 49 ? 1 : 1 - opened(i, t) * .85); A.circle(i).open(opened(i, t)); }
  A.spotlight(null, 0); A.disc.set({ lift: 0, spin: 0, tilt: 0, tiltDir: 0, bridges: 0 }); A.door(0); A.clock(clockAt(t));
  ADD.forEach(a => { a.rig.root.visible = false; if (a.fx.overlay) a.fx.overlay.visible = false; });
  crowd.visible = false; fly.visible = false; if (TRO) TRO.group.visible = true;
  let p, l, fov = 30, ap = 0, focus = null, hero = null, sk = 0;
  const everyone = (face) => { Object.keys(SPOT).forEach(h => stand(CA[h], SPOT[h], face || V(0, 0, 0), t, 0)); crowd.visible = true; crowdAt(t);
    if (CA.turbo.rig.root.visible && t < DROP[SPOT.turbo] + .6) runOnSpot(CA.turbo.rig, t, 1); };
  const closeOn = (who, side, d0, d1, xs, mood) => { const a = CA[who], i = SPOT[who], o = sideOf(i), toCam = o.side.clone().multiplyScalar(side).addScaledVector(o.out, .3).normalize();
    stand(a, i, o.c.clone().addScaledVector(toCam, 100), t, 1); if (mood) a.rig.setExpression(mood[0], mood[1]);
    const hd = headOf(a.rig), F = frameOn(hd.clone().add(V(0, -12, 0)), toCam.clone().add(V(0, -.06, 0)), lerp(d0, d1, eout(u / Math.max(.8, dur))), 30, xs, -.02);
    p = F.p; l = F.l; ap = .018; hero = a.rig; sk = 1; focus = p.distanceTo(hd); A.shadowFocus(o.c, 420); return { a, hd, toCam, o }; };
  if (id === 'A') {          // the fifty in their circles, a crane down
    everyone(); const k = eio(clamp(u / dur, 0, 1)), az = 228 * D2R, r = lerp(1900, 1450, k), y = lerp(1250, 620, k);
    p = V(Math.cos(az) * r, y, Math.sin(az) * r); l = V(0, lerp(40, 110, k), 0); fov = 40; ap = .002; focus = p.length() * .75; A.shadowFocus(V(0, 0, 0), 1400);
  } else if (id === 'A2') {  // a power on 'superpowers': Turbo running on the spot, his streaks round him
    everyone(); closeOn('turbo', 1, 300, 250, .2, ['determined', 1]); runOnSpot(CA.turbo.rig, t, 1);
  } else if (id === 'B') {   // #50 looks up at the trophy
    everyone(); const a = CA.ordinary, c = cw(49), toTro = V(0, 0, 0).sub(c).setY(0).normalize(), side = V(-toTro.z, 0, toTro.x);
    stand(a, 49, V(0, 0, 0), t, 0); a.rig.setExpression('neutral', 1); a.rig.lookAt(V(0, 260, 0), .5);

    ap = .02; hero = a.rig; sk = 1; focus = p.distanceTo(hd); A.shadowFocus(c, 500);
  } else if (id === 'C') {   // the clock on the crest of the board, the floor of players below it
    everyone(); const bz = 270 * D2R, bp = V(Math.cos(bz) * 3360, 3660, Math.sin(bz) * 3360), k = eout(u / dur);
    const dir = V(-Math.cos(bz), 0, -Math.sin(bz)); p = bp.clone().addScaledVector(dir, lerp(2600, 2150, k)).add(V(0, lerp(-420, -300, k), 0)); l = bp.clone().add(V(0, -60, 0)); fov = 26; ap = 0;
    A.shadowFocus(V(0, 0, 0), 1400);
  } else if (id === 'D') {   // the rule proven: Turbo cannot stop his feet, and his circle drops him (who he is comes next)
    everyone(); const i = SPOT.turbo, o = sideOf(i), toCam = o.side.clone().addScaledVector(o.out, .55).normalize();
    stand(CA.turbo, i, o.c.clone().addScaledVector(toCam, 100), t, 1); CA.turbo.rig.setExpression(t < DROP[i] ? 'worried' : 'surprised', 1); if (t < DROP[i] + .6) runOnSpot(CA.turbo.rig, t, 1);
    const fk = clamp((t - DROP[i]) / 1.1, 0, 1); p = o.c.clone().addScaledVector(toCam, lerp(380, 300, eout(u / dur))).add(V(0, lerp(150, 260, fk), 0)); l = o.c.clone().add(V(0, lerp(55, -40, fk), 0));
    fov = 34; ap = .01; focus = p.distanceTo(o.c); hero = CA.turbo.rig; sk = .7; A.shadowFocus(o.c, 500);
  } else if (id === 'E') {   // Turbo can't stop running
    everyone(); const R = closeOn('turbo', -1, 270, 230, -.2, ['worried', 1]); runOnSpot(CA.turbo.rig, t, 1);
  } else if (id === 'F') {   // the floor opens under his running feet: a low three-quarter on the circle
    everyone(); const i = SPOT.turbo, o = sideOf(i), toCam = o.side.clone().addScaledVector(o.out, .55).normalize();   // round the ring on his other side, raised: no neighbour in the foreground
    stand(CA.turbo, i, o.c.clone().addScaledVector(toCam, 100), t, 1); CA.turbo.rig.setExpression(t < DROP[i] ? 'determined' : 'surprised', 1); if (t < DROP[i] + .6) runOnSpot(CA.turbo.rig, t, 1);
    p = o.c.clone().addScaledVector(toCam, lerp(400, 360, eout(u / dur))).add(V(0, 175, 0)); l = o.c.clone().add(V(0, 45, 0)); fov = 34;   // above head height: no neighbour in the foreground ap = .012; focus = p.distanceTo(o.c); hero = CA.turbo.rig; sk = .7; A.shadowFocus(o.c, 500);
  } else if (id === 'G') {   // 'before anyone else had even blinked': Reflex close, a smug slow blink
    everyone(); closeOn('reflex', -1, 200, 180, -.2, ['smug', 1]); crossArms(CA.reflex.rig); CA.reflex.rig.setBlink(clamp(1 - Math.abs(t - WT(74) - .1) / .18, 0, 1));
  } else if (id === 'G2') {  // Reflex, faster than anyone alive: smug, arms crossed
