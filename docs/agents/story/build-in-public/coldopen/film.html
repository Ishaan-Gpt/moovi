<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1,000 Words Left · cold open</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#141A16;height:100%}
#cv{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:auto;position:absolute;inset:0}
#play{position:fixed;inset:0;margin:auto;width:180px;height:56px;border:0;border-radius:28px;background:#F4F1E2;color:#141A16;font:800 18px "Bricolage Grotesque",system-ui;cursor:pointer;z-index:2}
</style></head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<button id="play" hidden>Play with sound</button>
<audio id="au" src="vo/mix.mp3" preload="auto"></audio>
<script src="timing.js"></script>
<script>
// "What If You Only Had 1,000 Words Left?" cold open. 2D with depth on one canvas, a pure function of t (seek-safe).
const W = 1920, H = 1080, cv = document.getElementById('cv'), cx = cv.getContext('2d');
const WD = window.COLD.words, WT = i => WD[i].t, WE = i => WD[i].e;
const FONT = '"Bricolage Grotesque", system-ui, sans-serif';

// ---------- palette: matcha dusk (sage sky, lemon window light, aubergine shadow); neutrals tinted green ----------
const P = {
  skyTop: '#26302A', skyMid: '#566B5C', skyLow: '#B9C79A', haze: '#DCE3BE',
  ink: '#141A16', ink2: '#1D251F', wall: '#36443A', wall2: '#2B362F', floor: '#222B25',
  lemon: '#F3E7A0', glow: '#FFF3BC', warm: '#D9C27A', aub: '#2C2030', aub2: '#46304A',
  rim: '#F6EDB0', rimCool: '#C6D8B4',
  hero: '#5E3352', friend: '#3F5A4A', scarf: '#D4A23C', ivory: '#F4F1E2', coral: '#E06B52', paper: '#EFE9D2',
};
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, eout = k => 1 - Math.pow(1 - k, 3);
const back = k => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rnd(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ---------- grain (made once, deterministic) ----------
const grain = document.createElement('canvas'); grain.width = 480; grain.height = 270;
{ const g = grain.getContext('2d'), d = g.createImageData(480, 270), r = rnd(7); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 13; } g.putImageData(d, 0, 0); }

// ---------- kit: light, depth, people, the counter ----------
function grad(y0, y1, stops) { const g = cx.createLinearGradient(0, y0, 0, y1); stops.forEach(([k, c]) => g.addColorStop(k, c)); return g; }
function sky(y1 = H) { cx.fillStyle = grad(0, y1, [[0, P.skyTop], [.55, P.skyMid], [1, P.skyLow]]); cx.fillRect(-200, -200, W + 400, y1 + 200); }
function glowAt(x, y, r, c = P.glow, a = .55) { const g = cx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(255,243,188,0)'); cx.save(); cx.globalAlpha = a; cx.globalCompositeOperation = 'screen'; cx.fillStyle = g; cx.fillRect(x - r, y - r, r * 2, r * 2); cx.restore(); }
function bokeh(seed, n, t, a = .35, col = P.glow, yMax = H) { const r = rnd(seed); cx.save(); cx.globalCompositeOperation = 'screen'; for (let i = 0; i < n; i++) { const x = r() * W, y = r() * yMax, s = 18 + r() * 60, ph = r() * 6; cx.globalAlpha = a * (.5 + .5 * Math.sin(t * .6 + ph)); cx.fillStyle = col; cx.beginPath(); cx.arc(x + Math.sin(t * .2 + ph) * 12, y, s, 0, 7); cx.fill(); } cx.restore(); }
function blur(px, fn) { cx.save(); cx.filter = `blur(${px}px)`; fn(); cx.restore(); }
function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect(x, y, w, h, r); }

// A person, torso up (or with a stool when seated). o: {x, y (neck), s, jacket, scarf, look (-1..1), eyes:{open, happy, wide}, mouth:{smile, open},
// arms:{l:[ang, bend], r:[...]}, rim:{dx, dy, c}, kid, hat}
function person(o) {
  const s = o.s || 1, rim = o.rim || { dx: -1, dy: -.4, c: P.rim }, R = 7 * s;
  cx.save(); cx.translate(o.x, o.y); cx.scale(s, s);
  const k = o.kid ? .82 : 1;
  const body = (fillJ, fillI, off) => {
    cx.save(); if (off) cx.translate(off[0], off[1]);
    // arms behind torso
    for (const side of ['l', 'r']) { const a = (o.arms || {})[side]; if (!a) continue; const sx = side === 'l' ? -78 * k : 78 * k;
      const ex = sx + Math.cos(a[0]) * 95 * k, ey = 40 + Math.sin(a[0]) * 95 * k, hx = ex + Math.cos(a[0] + a[1]) * 85 * k, hy = ey + Math.sin(a[0] + a[1]) * 85 * k;
      cx.strokeStyle = fillJ || o.jacket; cx.lineWidth = 46 * k; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.beginPath(); cx.moveTo(sx, 34); cx.lineTo(ex, ey); cx.lineTo(hx, hy); cx.stroke();
      cx.fillStyle = fillI || P.ink; cx.beginPath(); cx.arc(hx, hy, 24 * k, 0, 7); cx.fill(); }
    // torso
    cx.fillStyle = fillJ || o.jacket; cx.beginPath(); cx.moveTo(-92 * k, 300); cx.bezierCurveTo(-100 * k, 120, -96 * k, 22, -60 * k, 8); cx.lineTo(60 * k, 8); cx.bezierCurveTo(96 * k, 22, 100 * k, 120, 92 * k, 300); cx.closePath(); cx.fill();
    if (o.scarf) { cx.fillStyle = fillJ || o.scarf; rr(-56 * k, -4, 112 * k, 34, 17); cx.fill(); cx.beginPath(); cx.roundRect(18 * k, 18, 30, 92, 12); cx.fill(); }
    if (o.hood !== false && !o.scarf) { cx.fillStyle = fillJ || shade(o.jacket, -.18); cx.beginPath(); cx.ellipse(0, 12, 64 * k, 22, 0, 0, 7); cx.fill(); }
    // head
    cx.fillStyle = fillI || P.ink; cx.beginPath(); cx.arc(0, -96 * k, 104 * k, 0, 7); cx.fill();
    if (o.hat && !fillI) { cx.fillStyle = o.hat; cx.beginPath(); cx.moveTo(-30, -192 * k); cx.lineTo(30, -192 * k); cx.lineTo(4, -300 * k); cx.closePath(); cx.fill(); cx.fillStyle = P.ivory; cx.beginPath(); cx.arc(4, -302 * k, 11, 0, 7); cx.fill(); }
    cx.restore();
  };
  body(rim.c, rim.c, [rim.dx * R * 1.6, rim.dy * R * 1.6]);   // the rim: the shape in light, offset toward the light
  body(null, null, null);
  face(o, k); cx.restore();
}
function face(o, k) {
  const e = o.eyes || {}, m = o.mouth || {}, lx = (o.look || 0) * 34 * k, open = e.open ?? 1, wide = e.wide || 0;
  cx.save(); cx.translate(lx, -96 * k);
  cx.fillStyle = P.ivory;
  for (const sx of [-34, 34]) { const x = sx * k, y = -18 * k;
    if (e.happy) { cx.strokeStyle = P.ivory; cx.lineWidth = 9 * k; cx.lineCap = 'round'; cx.beginPath(); cx.arc(x, y + 8 * k, 15 * k, Math.PI * 1.15, Math.PI * 1.85); cx.stroke(); continue; }
    const h = (22 + wide * 9) * k * Math.max(.08, open), w = (13 + wide * 5) * k;
    cx.beginPath(); cx.ellipse(x, y, w, h, 0, 0, 7); cx.fill();
    if (e.sad) { cx.fillStyle = P.ink; cx.beginPath(); cx.moveTo(x - 20 * k, y - 26 * k + (sx < 0 ? 12 : 0) * k); cx.lineTo(x + 20 * k, y - 26 * k + (sx < 0 ? 0 : 12) * k); cx.lineTo(x + 20 * k, y - 44 * k); cx.lineTo(x - 20 * k, y - 44 * k); cx.fill(); cx.fillStyle = P.ivory; }
  }
  const my = 44 * k, mw = 30 * k, sm = m.smile ?? .3, op = m.open || 0;
  if (op > .05) { cx.fillStyle = P.ivory; cx.beginPath(); cx.ellipse(0, my, mw * (.55 + .25 * op), 7 * k + 20 * k * op, 0, 0, 7); cx.fill(); cx.fillStyle = P.aub; cx.beginPath(); cx.ellipse(0, my + 3 * k, mw * (.4 + .2 * op), 3 * k + 14 * k * op, 0, 0, 7); cx.fill(); }
  else { cx.strokeStyle = P.ivory; cx.lineWidth = 8 * k; cx.lineCap = 'round'; cx.beginPath(); cx.moveTo(-mw, my - sm * 6 * k); cx.quadraticCurveTo(0, my + sm * 26 * k, mw, my - sm * 6 * k); cx.stroke(); }
  cx.restore();
}
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255; const m = f < 0 ? 0 : 255, a = Math.abs(f); r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a); return `rgb(${r},${g},${b})`; }
// talking: mouth open from the word times of one speaker within [a, b]
function talk(t, a, b) { let v = 0; for (const w of WD) if (w.t >= a - .01 && w.t <= b && t >= w.t && t <= w.e + .05) v = Math.max(v, Math.sin(clamp((t - w.t) / Math.max(.12, w.e - w.t + .05)) * Math.PI)); return v * .9; }
function blink(t, seed) { const p = (t + seed * 1.7) % 3.4; return p < .12 ? Math.abs(p - .06) / .06 : 1; }

// the counter: an ivory pill with tabular numerals; low counts glow coral; a tick sends a ring out
function pill(x, y, s, val, o = {}) {
  const txt = typeof val === 'number' ? val.toLocaleString('en-US') : val, low = o.low, pulse = o.pulse || 0;
  cx.save(); cx.translate(x, y); cx.scale(s * (1 + .12 * Math.sin(pulse * Math.PI)), s * (1 + .12 * Math.sin(pulse * Math.PI)));
  cx.font = `800 64px ${FONT}`; const w = Math.max(150, cx.measureText(txt).width + 70), h = 92;
  glowAt(0, 0, w * .9, low ? '#FFB49E' : P.glow, .35 + .3 * pulse);
  if (pulse > 0 && pulse < 1) { cx.strokeStyle = low ? P.coral : P.glow; cx.globalAlpha = 1 - pulse; cx.lineWidth = 6; rr(-w / 2 - 40 * pulse, -h / 2 - 40 * pulse, w + 80 * pulse, h + 80 * pulse, h); cx.stroke(); cx.globalAlpha = 1; }
  cx.fillStyle = P.ivory; rr(-w / 2, -h / 2, w, h, h / 2); cx.fill();
  cx.lineWidth = 6; cx.strokeStyle = low ? P.coral : P.warm; cx.stroke();
  cx.fillStyle = low ? '#B2432F' : P.ink; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(txt, 0, 4);
  if (o.label) { cx.font = `500 26px ${FONT}`; cx.fillStyle = P.ivory; cx.fillText(o.label, 0, h / 2 + 34); }
  cx.restore();
}

// ---------- sets ----------
// The café: a real room 3400 px wide; cam picks the part seen (shelves, the big sunset window, the counter). Bright light, so the
// black silhouettes in front of it pop (the genre's trick: dark figures on glowing ground).
function cafeInterior(t, blurPx = 0, cam = 0) {
  const ox = -700 - cam;   // room x of the screen's left edge = -ox
  cx.fillStyle = grad(0, H, [[0, '#B4C38E'], [.55, '#EDE2A6'], [1, '#8E9F70']]); cx.fillRect(-300, -300, W + 600, H + 600);
  blur(blurPx, () => {
    cx.save(); cx.translate(ox, 0);
    // wainscot and floor line
    cx.fillStyle = '#7F9166'; cx.fillRect(-400, 760, 4200, 400); cx.fillStyle = '#6E8058'; for (let x = -400; x < 3800; x += 90) cx.fillRect(x, 760, 6, 400);
    // shelves of jars, left
    for (let s = 0; s < 3; s++) { const y = 260 + s * 170; cx.fillStyle = '#4A3E34'; cx.fillRect(0, y, 640, 16); const r = rnd(40 + s);
      for (let j = 0; j < 9; j++) { const jx = 20 + j * 68, jh = 60 + r() * 50; cx.fillStyle = ['#E9D58C', '#B7C79A', '#D9A98F', '#F1EBCB'][j % 4]; rr(jx, y - jh, 48, jh, 8); cx.fill(); cx.fillStyle = '#4A3E34'; cx.fillRect(jx + 6, y - jh - 10, 36, 12); } }
    // the big window: a low sun, sky and a soft city
    cx.save(); rr(800, 110, 1500, 620, 14); cx.clip();
    cx.fillStyle = grad(110, 730, [[0, '#B3CB86'], [.5, '#F6E585'], [.85, '#FBC48F'], [1, '#F6A985']]); cx.fillRect(800, 110, 1500, 620);
    glowAt(1560, 600, 520, '#FFF6CF', .95); cx.fillStyle = '#FFF8DA'; cx.beginPath(); cx.arc(1560, 620, 70, 0, 7); cx.fill();
    cx.save(); cx.globalAlpha = .18; cx.fillStyle = '#FFF6CF'; for (let i = 0; i < 9; i++) { cx.beginPath(); cx.moveTo(1560, 620); cx.arc(1560, 620, 900, i * .7 + t * .02, i * .7 + .22 + t * .02); cx.fill(); } cx.restore();
    cx.fillStyle = '#8FA07E'; const r = rnd(12); for (let i = 0; i < 14; i++) { const h = 120 + r() * 200; cx.fillRect(800 + i * 110, 730 - h, 96, h); }
    cx.fillStyle = '#F7EDB8'; for (let i = 0; i < 50; i++) { if (r() < .5) continue; cx.globalAlpha = .7; cx.fillRect(812 + (i % 14) * 110, 640 - Math.floor(i / 14) * 46, 18, 24); } cx.globalAlpha = 1;
    cx.restore();
    cx.strokeStyle = '#3B4632'; cx.lineWidth = 24; rr(800, 110, 1500, 620, 14); cx.stroke(); cx.lineWidth = 12; for (let i = 1; i < 4; i++) { cx.beginPath(); cx.moveTo(800 + i * 375, 110); cx.lineTo(800 + i * 375, 730); cx.stroke(); }
    // hanging plants either side of the window
    for (const px of [760, 2340]) { cx.strokeStyle = '#3B4632'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(px, 0); cx.lineTo(px, 160); cx.stroke(); cx.fillStyle = '#C9876A'; rr(px - 40, 160, 80, 60, 10); cx.fill(); cx.fillStyle = '#5F8A5A'; for (let l = 0; l < 7; l++) { cx.beginPath(); cx.ellipse(px - 50 + l * 16, 240 + (l % 3) * 40, 14, 44, (l - 3) * .2, 0, 7); cx.fill(); } }
    // the counter, espresso machine, a menu board, right
    cx.fillStyle = '#3F4A36'; cx.fillRect(2450, 300, 520, 300); cx.fillStyle = '#E9E3C4'; cx.font = `800 34px ${FONT}`; cx.textAlign = 'left'; cx.globalAlpha = .8;
    ['MENU', 'flat white', 'cappuccino', 'mint tea'].forEach((s, i) => cx.fillText(s, 2490, 360 + i * 56)); cx.globalAlpha = 1;
    cx.fillStyle = '#6E5848'; cx.fillRect(2400, 640, 1000, 140); cx.fillStyle = '#B9B3A0'; rr(2600, 520, 260, 130, 12); cx.fill(); cx.fillStyle = '#8D8776'; rr(2630, 480, 200, 50, 10); cx.fill();
    // lamps
    for (const lx of [380, 1180, 1940, 2700]) { cx.strokeStyle = '#3B4632'; cx.lineWidth = 4; cx.beginPath(); cx.moveTo(lx, -10); cx.lineTo(lx, 120); cx.stroke(); cx.fillStyle = '#2F3828'; cx.beginPath(); cx.moveTo(lx - 64, 176); cx.quadraticCurveTo(lx, 84, lx + 64, 176); cx.fill(); glowAt(lx, 196, 340, '#FFF3BC', .9); cx.fillStyle = '#FFF6CF'; cx.beginPath(); cx.ellipse(lx, 178, 36, 10, 0, 0, 7); cx.fill(); }
    cx.restore();
  });
  glowAt(W * .5, H * .45, 1100, '#FFF3BC', .22);
}
function table(y, x0 = -100, x1 = W + 100, cup = null) {
  cx.fillStyle = P.aub2; cx.fillRect(x0, y, x1 - x0, 26); cx.fillStyle = P.aub; cx.fillRect(x0, y + 26, x1 - x0, H);
  cx.fillStyle = 'rgba(246,237,176,.25)'; cx.fillRect(x0, y, x1 - x0, 4);
  if (cup) { const [x, s] = cup; cx.save(); cx.translate(x, y); cx.scale(s, s); cx.fillStyle = P.ivory; cx.beginPath(); cx.ellipse(0, -2, 70, 12, 0, 0, 7); cx.fill(); rr(-44, -84, 88, 82, 14); cx.fill(); cx.strokeStyle = P.ivory; cx.lineWidth = 10; cx.beginPath(); cx.arc(50, -48, 20, -1.3, 1.3); cx.stroke(); cx.fillStyle = '#C9A77A'; cx.beginPath(); cx.ellipse(0, -84, 40, 9, 0, 0, 7); cx.fill(); cx.restore(); }
}
function steam(x, y, t, s = 1) { cx.save(); cx.strokeStyle = 'rgba(244,241,226,.35)'; cx.lineWidth = 6 * s; cx.lineCap = 'round'; for (let i = 0; i < 3; i++) { cx.beginPath(); for (let k = 0; k < 12; k++) { const yy = y - k * 12 * s, xx = x + (i - 1) * 18 * s + Math.sin(t * 2 + k * .6 + i) * 8 * s; k ? cx.lineTo(xx, yy) : cx.moveTo(xx, yy); } cx.globalAlpha = .6; cx.stroke(); } cx.restore(); }
function ringBox(x, y, s, open) { cx.save(); cx.translate(x, y); cx.scale(s, s); cx.fillStyle = P.aub2; rr(-60, -10, 120, 70, 12); cx.fill(); cx.save(); cx.translate(0, -10); cx.rotate(-1.9 * open); cx.fillStyle = shade(P.aub2, .1); rr(-60, -50, 120, 50, 12); cx.fill(); cx.restore(); if (open > .3) { glowAt(0, -14, 120, P.glow, .8 * open); cx.strokeStyle = '#E9C76A'; cx.lineWidth = 9; cx.beginPath(); cx.ellipse(0, -18, 24, 18, 0, 0, 7); cx.stroke(); cx.fillStyle = '#FFFBEA'; cx.beginPath(); cx.moveTo(0, -48); cx.lineTo(12, -36); cx.lineTo(0, -28); cx.lineTo(-12, -36); cx.fill(); } cx.restore(); }

function exterior(t, push = 0, title = false) {
  cx.fillStyle = grad(0, H, [[0, '#A9BD94'], [.5, '#EDE3A2'], [.85, '#F6CFA6'], [1, '#F2B99A']]); cx.fillRect(-200, -200, W + 400, H + 400); glowAt(1500, 760, 700, '#FFF6CF', .9); bokeh(5, 10, t, .18, P.haze, 500);
  cx.save(); cx.translate(W / 2, H / 2); cx.scale(1 + push, 1 + push); cx.translate(-W / 2, -H / 2);
  // far buildings, soft
  blur(3, () => { cx.fillStyle = '#8FA07E'; for (let i = 0; i < 8; i++) cx.fillRect(i * 260 - 40, 300 - (i * 53 % 140), 220, 600); cx.fillStyle = P.lemon; const r = rnd(4); for (let i = 0; i < 70; i++) { if (r() < .5) continue; cx.globalAlpha = .5; cx.fillRect((i % 14) * 140 + 10, 330 + Math.floor(i / 14) * 70, 22, 30); } cx.globalAlpha = 1; });
  // the café front
  cx.fillStyle = '#4E5E46'; cx.fillRect(260, 230, 1400, 760); cx.fillStyle = '#2F3828'; cx.fillRect(230, 200, 1460, 60);
  // awning, sage and ivory stripes
  for (let i = 0; i < 14; i++) { cx.fillStyle = i % 2 ? P.ivory : '#7E9A7A'; cx.beginPath(); cx.moveTo(240 + i * 103, 260); cx.lineTo(240 + (i + 1) * 103, 260); cx.lineTo(240 + (i + 1) * 103, 330); cx.quadraticCurveTo(240 + i * 103 + 51, 362, 240 + i * 103, 330); cx.fill(); }
  // the window, lit from inside
  cx.save(); rr(340, 400, 1240, 470, 8); cx.clip(); cx.fillStyle = grad(400, 870, [[0, '#E8D68A'], [1, '#B79A55']]); cx.fillRect(340, 400, 1240, 470);
  glowAt(960, 520, 700, P.glow, .6); table(735, 600, 1320); if (title) { cx.restore(); } else {
  person({ x: 820, y: 640, s: .55, jacket: P.hero, look: .6, rim: { dx: .8, dy: -.3, c: P.glow }, arms: { r: [.6, .9] } });
  person({ x: 1110, y: 640, s: .55, jacket: P.friend, scarf: P.scarf, look: -.6, rim: { dx: -.8, dy: -.3, c: P.glow }, arms: { l: [2.5, -.9] } });
  // other tables, soft
  blur(2, () => { person({ x: 470, y: 690, s: .4, jacket: '#55634F', look: .9, rim: { dx: 1, dy: 0, c: P.glow } }); person({ x: 1460, y: 690, s: .4, jacket: '#6A5560', look: -.9, rim: { dx: -1, dy: 0, c: P.glow } }); });
  cx.restore(); }
  cx.strokeStyle = P.ink2; cx.lineWidth = 18; cx.strokeRect(340, 400, 1240, 470); cx.lineWidth = 10; cx.beginPath(); cx.moveTo(960, 400); cx.lineTo(960, 870); cx.stroke();
  if (!title) pill(820, 238 + 160, .62, 41);
  // street and foreground
  cx.fillStyle = '#5E6B4E'; cx.fillRect(-100, 990, W + 200, 200);
  blur(12, () => { cx.fillStyle = P.ink; cx.beginPath(); cx.ellipse(120, 1060, 260, 200, 0, 0, 7); cx.fill(); cx.fillRect(1700, 520, 90, 700); cx.beginPath(); cx.arc(1745, 470, 150, 0, 7); cx.fill(); });
  glowAt(960, 640, 900, P.glow, .18);
  cx.restore();
}

// ---------- shots ----------
// each: [id, start time, draw(u, t)] ; u = time inside the shot
const SH = [];
const shot = (id, t0, fn) => SH.push({ id, t0, fn });
const cam = (s, x = 0, y = 0) => { cx.translate(W / 2 + x, H / 2 + y); cx.scale(s, s); cx.translate(-W / 2, -H / 2); };

shot('A', 0, (u, t) => {   // the hook: you, face on, with 41 above your head
  cafeInterior(t, 6, 260); cx.save(); cam(1.18 + u * .03, 0, 90);
  person({ x: 960, y: 660, s: 1.15, jacket: P.hero, look: 0, eyes: { open: blink(t + .4, 1), wide: .25 }, mouth: { smile: -.15 }, rim: { dx: 1, dy: -.5, c: P.rim } });
  pill(960, 240, 1.05 * back(clamp(u / .45)), 41, { pulse: clamp(u / .7) }); cx.restore();
});
shot('B', WT(2) + .9, (u, t) => {   // the ask: your friend across the table holds out an open ring box
  cafeInterior(t, 5, 1250 + u * 10); cx.save(); cam(1.04 + u * .012);
  person({ x: 560, y: 640, s: 1, jacket: P.hero, look: .7, eyes: { open: blink(t, 2), wide: .5 * clamp((t - WT(12)) / .5) }, mouth: { smile: lerp(.2, -.3, clamp((t - WT(12)) / .6)) }, rim: { dx: 1, dy: -.5, c: P.rim } });
  person({ x: 1360, y: 640, s: 1, jacket: P.friend, scarf: P.scarf, look: -.7, eyes: { open: blink(t, 5), happy: t > WT(17) }, mouth: { smile: .8 }, rim: { dx: -1, dy: -.5, c: P.rim }, arms: { l: [2.75, -.55] } });
  pill(560, 270, .85, 41);
