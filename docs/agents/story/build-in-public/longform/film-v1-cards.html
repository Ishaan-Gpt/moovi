<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viral Stickman With Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#101512;height:100%;overflow:hidden}
#cv{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:auto;position:absolute;inset:0}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:linear-gradient(transparent,rgba(16,21,18,.85));z-index:3;font:600 13px "JetBrains Mono",monospace;color:#F4F1E2;opacity:0;transition:opacity .3s}

</style></head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<button id="play" hidden>Play with sound</button>
<div id="ui"><button id="pp">Pause</button><span id="tc">0:00</span><div id="bar"><div id="fill"></div></div><span id="td"></span></div>
<audio id="au" src="vo/mix.mp3" preload="auto"></audio>
<script src="timing.js"></script>
<script>
// The long form, as a live page: a pure function of t for the drawn layers; the reference clips are seeked videos; our cold open is
// its own page in an iframe, seeked frame by frame. One canvas, 1920x1080. Export (only when Ishaan says so) uses window.frameB64(t).
const W = 1920, H = 1080, cv = document.getElementById('cv'), cx = cv.getContext('2d');
const LF = window.LF, WD = LF.words, DUR = LF.dur + .8;
const FD = '"Bricolage Grotesque", system-ui, sans-serif', FM = '"JetBrains Mono", ui-monospace, monospace';
// matcha palette, shared with the cold open (sage, lemon light, aubergine, one coral accent)
const P = { bg0: '#141A16', bg1: '#1F2A23', bg2: '#2C3A31', ink: '#141A16', ivory: '#F4F1E2', paper: '#EFE9D2', lemon: '#F3E7A0', glow: '#FFF3BC',
  sage: '#9DB38A', sage2: '#6F8A64', aub: '#46304A', aub2: '#5E3352', coral: '#E06B52', mute: '#A9B5A3', line: 'rgba(244,241,226,.14)' };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
const eout = k => 1 - Math.pow(1 - clamp(k), 3), eio = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const back = k => { k = clamp(k); const c = 1.5; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect(x, y, w, h, r); }
function grad(y0, y1, stops) { const g = cx.createLinearGradient(0, y0, 0, y1); stops.forEach(([k, c]) => g.addColorStop(k, c)); return g; }
function glowAt(x, y, r, c = P.glow, a = .5) { const g = cx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(255,243,188,0)'); cx.save(); cx.globalAlpha = a; cx.globalCompositeOperation = 'screen'; cx.fillStyle = g; cx.fillRect(x - r, y - r, r * 2, r * 2); cx.restore(); }
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- the word clock ----------
const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
function at(sec, phrase, off = 0) {
  const S = LF.secs[sec - 1], toks = phrase.split(/\s+/).map(norm), end = sec < LF.secs.length ? LF.secs[sec].i0 : WD.length;
  for (let i = S.i0; i < end; i++) { let ok = true; for (let k = 0; k < toks.length; k++) if (!WD[i + k] || norm(WD[i + k].w) !== toks[k]) { ok = false; break; } if (ok) return WD[i].t + off; }
  console.warn('phrase not found', sec, phrase); return S.t + off;
}
const SEC = n => LF.secs[n - 1];
const since = (t, t0, d = .5) => clamp((t - t0) / d);

// ---------- assets ----------
const IMG = {}, VID = {};
['v1-1', 'v1-5.5', 'v1-11', 'v1-22', 'v2-0001.00', 'v2-0005.50', 'v2-0011.00', 'v2-0022.00', 'short3d-b', 'sheet-ifverse-1', 'sheet-ifinite-howlong-1', 'sheet-miko-liecount-1', 'sheet-ifology-10x-1']
  .forEach(n => { const i = new Image(); i.src = 'img/' + n + '.jpg'; IMG[n] = i; });
const CLIPS = { 'ifv-fly': 5, 'ifv-cup': 6, 'ifv-number': 6, 'ifv-title': 6, 'ifv-how': 4, 'mz-speed': 6, 'ifi-bus': 6, 'ifi-flip': 5, 'miko-love': 5, 'ifo-3d': 5, 'fnsf-money': 5, 'ifv-iq': 6 };
for (const n in CLIPS) { const v = document.createElement('video'); v.src = 'clips/' + n + '.mp4'; v.muted = true; v.playsInline = true; v.preload = 'auto'; VID[n] = v; }
const CREDIT = { 'ifv': 'Ifverse', 'mz': 'Minute Zero', 'ifi': 'Ifinite', 'miko': 'Miko', 'ifo': 'IFOLOGY', 'fnsf': 'FunNotSoFun' };
let WANT = [];   // clips this frame needs: [name, clip time]
// a clip in a card: plays from film time t0, holds its last frame
function clip(name, x, y, w, h, t, t0, o = {}) {
  const v = VID[name], ct = Math.min(CLIPS[name] - .05, Math.max(0, (t - t0) * (o.rate || 1) + (o.from || 0)));
  WANT.push([name, ct]);
  cx.save(); rr(x, y, w, h, o.r ?? 18); cx.clip(); cx.fillStyle = '#0c0f0d'; cx.fillRect(x, y, w, h);
  if (v.readyState >= 2) { const vw = v.videoWidth || 16, vh = v.videoHeight || 9, s = Math.max(w / vw, h / vh), z = o.zoom || 1; cx.drawImage(v, x + w / 2 - vw * s * z / 2, y + h / 2 - vh * s * z / 2, vw * s * z, vh * s * z); }
  cx.restore();
  if (o.credit !== false) { const who = CREDIT[name.split('-')[0]]; cx.font = `700 ${o.cs || 22}px ${FM}`; const tw = cx.measureText(who).width; cx.fillStyle = 'rgba(16,21,18,.78)'; rr(x + 14, y + 14, tw + 28, (o.cs || 22) + 18, 10); cx.fill(); cx.fillStyle = P.ivory; cx.textBaseline = 'middle'; cx.textAlign = 'left'; cx.fillText(who, x + 28, y + 14 + ((o.cs || 22) + 18) / 2 + 1); }
  cx.strokeStyle = 'rgba(244,241,226,.18)'; cx.lineWidth = 2; rr(x, y, w, h, o.r ?? 18); cx.stroke();
}
// our cold open, live from its own page in a hidden iframe (falls back to stills)
const co = document.createElement('iframe'); co.id = 'co';
co.src = (location.protocol === 'https:' && /claude|artifact/.test(location.host + location.pathname)) ? 'coldopen/film.html?embed=1' : '../coldopen/film.html?embed=1';
document.body.appendChild(co);
function coReady() { try { return co.contentWindow && co.contentWindow.__ready === true; } catch { return false; } }
function ours(x, y, w, h, ct, o = {}) {
  cx.save(); rr(x, y, w, h, o.r ?? 18); cx.clip(); cx.fillStyle = '#0c0f0d'; cx.fillRect(x, y, w, h);
  if (coReady()) { try { co.contentWindow.seek(ct); const c = co.contentWindow.document.getElementById('cv'); const s = Math.max(w / 1920, h / 1080); cx.drawImage(c, x + w / 2 - 960 * s, y + h / 2 - 540 * s, 1920 * s, 1080 * s); } catch (e) { stillFallback(x, y, w, h, ct); } }
  else stillFallback(x, y, w, h, ct);
  cx.restore();
  if (o.credit !== false) { cx.font = `700 22px ${FM}`; const lab = o.label || 'Made with Claude'; const tw = cx.measureText(lab).width; cx.fillStyle = P.lemon; rr(x + 14, y + 14, tw + 28, 40, 10); cx.fill(); cx.fillStyle = P.ink; cx.textBaseline = 'middle'; cx.textAlign = 'left'; cx.fillText(lab, x + 28, y + 35); }
  cx.strokeStyle = 'rgba(243,231,160,.5)'; cx.lineWidth = 3; rr(x, y, w, h, o.r ?? 18); cx.stroke();
}
function stillFallback(x, y, w, h, ct) { const k = ct < 3 ? 'v2-0001.00' : ct < 8 ? 'v2-0005.50' : ct < 16 ? 'v2-0011.00' : 'v2-0022.00'; img(k, x, y, w, h); }
function img(k, x, y, w, h, o = {}) { const i = IMG[k]; if (!i || !i.complete || !i.naturalWidth) return; const s = Math.max(w / i.naturalWidth, h / i.naturalHeight) * (o.zoom || 1); cx.save(); rr(x, y, w, h, o.r ?? 18); cx.clip(); cx.drawImage(i, x + w / 2 - i.naturalWidth * s / 2 + (o.dx || 0), y + h / 2 - i.naturalHeight * s / 2 + (o.dy || 0), i.naturalWidth * s, i.naturalHeight * s); cx.restore(); }

// ---------- the studio: a dark matcha desk with a fine paper grid and a lemon lamp ----------
function studio(t, glowX = 1500) {
  cx.fillStyle = grad(0, H, [[0, P.bg1], [1, P.bg0]]); cx.fillRect(0, 0, W, H);
  cx.strokeStyle = P.line; cx.lineWidth = 1; cx.globalAlpha = .45; for (let x = 0; x < W; x += 60) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke(); } for (let y = 0; y < H; y += 60) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); } cx.globalAlpha = 1;
  glowAt(glowX + Math.sin(t * .2) * 60, 120, 900, P.glow, .16); glowAt(300, 1000, 700, '#9DB38A', .1);
}
function text(s, x, y, size, o = {}) { cx.font = `${o.w || 800} ${size}px ${o.f || FD}`; cx.fillStyle = o.c || P.ivory; cx.textAlign = o.a || 'left'; cx.textBaseline = o.b || 'alphabetic'; const a0 = cx.globalAlpha; cx.globalAlpha = a0 * (o.alpha ?? 1); if (o.max) { let s2 = s; while (cx.measureText(s2).width > o.max && size > 10) { size -= 2; cx.font = `${o.w || 800} ${size}px ${o.f || FD}`; } } cx.fillText(s, x, y); cx.globalAlpha = a0; }
function chip(s, x, y, o = {}) { cx.font = `700 ${o.size || 26}px ${FM}`; const w = cx.measureText(s).width + 36, h = (o.size || 26) + 24; const k = o.k ?? 1; cx.save(); cx.globalAlpha *= k; cx.translate(x, y + (1 - k) * 18); cx.fillStyle = o.bg || P.ivory; rr(o.a === 'c' ? -w / 2 : 0, -h / 2, w, h, h / 2); cx.fill(); cx.fillStyle = o.c || P.ink; cx.textAlign = o.a === 'c' ? 'center' : 'left'; cx.textBaseline = 'middle'; cx.fillText(s, o.a === 'c' ? 0 : 18, 2); cx.restore(); return w; }
function card(x, y, w, h, k = 1, fill = P.paper) { cx.save(); cx.globalAlpha = k; cx.shadowColor = 'rgba(0,0,0,.35)'; cx.shadowBlur = 40; cx.shadowOffsetY = 14; cx.fillStyle = fill; rr(x, y + (1 - k) * 30, w, h, 22); cx.fill(); cx.restore(); }
function count(t, t0, d, to, from = 0) { return lerp(from, to, eout((t - t0) / d)); }
function title(s, t, t0, o = {}) { const k = eout(since(t, t0, .45)); text(s, o.x ?? 120, (o.y ?? 170) + (1 - k) * 24, o.size || 64, { alpha: k, c: o.c || P.ivory, max: o.max || 1680 }); }
function kicker(s, t, t0, o = {}) { const k = eout(since(t, t0, .4)); text(s.toUpperCase(), o.x ?? 122, o.y ?? 100, 24, { f: FM, w: 700, c: P.lemon, alpha: k }); }
function cam(s, x = 0, y = 0) { cx.translate(W / 2 + x, H / 2 + y); cx.scale(s, s); cx.translate(-W / 2, -H / 2); }
function bars(x, y, w, h, rows, t, t0, o = {}) {   // horizontal bars: [label, value, colour]
  const mx = o.max || Math.max(...rows.map(r => r[1])), rh = h / rows.length;
  rows.forEach(([lab, v, c], i) => { const k = eout(since(t, t0 + i * (o.stagger ?? .35), .8)); const yy = y + i * rh;
    text(lab, x, yy + rh * .45, o.ls || 30, { w: 700, f: FM, c: P.ivory, alpha: clamp(k * 2), b: 'middle', max: o.lw || 330 });
    cx.fillStyle = 'rgba(244,241,226,.08)'; rr(x + (o.lw || 330) + 20, yy + rh * .18, w - (o.lw || 330) - 20, rh * .54, 10); cx.fill();
    cx.fillStyle = c || P.lemon; rr(x + (o.lw || 330) + 20, yy + rh * .18, Math.max(12, (w - (o.lw || 330) - 20) * v / mx * k), rh * .54, 10); cx.fill();
    text(o.fmt ? o.fmt(v * k) : fmt(v * k), x + (o.lw || 330) + 34 + Math.max(12, (w - (o.lw || 330) - 20) * v / mx * k), yy + rh * .45, o.vs || 30, { f: FM, w: 700, c: P.ivory, alpha: clamp(k * 2), b: 'middle' }); });
}
const M = v => (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M', K = v => Math.round(v / 1000) + 'K';

// ---------- sections ----------
const E = {};   // event times, filled once fonts and timing are ready
function events() {
  const e = (k, s, p, off) => E[k] = at(s, p, off);
  e('ours', 1, 'the one playing next to it'); e('claude', 1, 'i made with claude'); e('free', 1, 'every other tool'); e('byend', 1, 'by the end'); e('fell', 1, 'where mine fell apart'); e('home', 1, 'take the whole system'); e('gh', 1, 'on github');
  e('genre', 2, 'the genre is called'); e('oct7', 2, 'seventh of october'); e('views46', 2, 'watched four point six'); e('mz', 2, 'minute zero'); e('ifi', 2, 'ifinite'); e('miko', 2, 'a channel called miko'); e('quit', 2, 'quit their jobs');
  e('noticed', 2, 'then everybody noticed'); e('w2', 2, 'fifty-four in the second'); e('w3', 2, 'a hundred and forty-seven'); e('typical', 2, 'the typical new video'); e('leftovers', 2, 'share the leftovers'); e('fifteen', 2, 'and yet fifteen'); e('gap', 2, 'the gap between');
  e('asked', 3, 'so i asked claude'); e('frame', 3, 'one frame every second'); e('narr', 3, 'narration written out'); e('rulebook', 3, 'came back with a rulebook'); e('r1', 3, 'none of them tell'); e('fly', 3, 'shows you a fly'); e('cup', 3, 'a coffee cup'); e('t35', 3, 'thirty-five seconds');
  e('r2', 3, 'the second rule'); e('quarter', 3, 'a quarter of a second'); e('r3', 3, 'the third is a friend'); e('how', 3, 'how did you do that'); e('r4', 3, 'the fourth is the pace'); e('wps', 3, 'one and a half words');
  e('look', 4, 'the look was'); e('assumed', 4, "i'd assumed"); e('two2d', 4, 'the two biggest'); e('rim', 4, 'rim of sunset light'); e('real3d', 4, 'the real 3d character'); e('knew', 4, 'i knew it was true'); e('hour', 4, 'one hour'); e('m47', 4, 'forty-seven minutes'); e('five', 4, 'five out of ten'); e('legs', 4, "the legs couldn't run"); e('thistime', 4, 'so this time'); e('canvas', 4, 'single canvas');
  e('idea', 5, 'the idea is where'); e('searched', 5, 'searched every premise'); e('rewind', 5, 'rewind ten seconds'); e('eight', 5, 'at least eight times'); e('k13', 5, 'thirteen thousand views'); e('words', 5, 'a thousand words left for your whole life'); e('hadnt', 5, "hadn't been made"); e('roblox', 5, 'a roblox story'); e('trick', 5, 'the genre\'s best trick'); e('talking', 5, 'except talking'); e('cant', 5, "you can't animate");
  e('script', 6, 'the script came next'); e('second', 6, 'in the second person'); e('w41', 6, 'you have forty-one words left'); e('voices', 6, 'the voices came from'); e('lined', 6, 'lined up every word'); e('drops', 6, 'the counter drops'); e('always', 6, 'always'); e('code', 6, 'the pictures are all code'); e('px', 6, 'three and a half thousand pixels'); e('shots21', 6, 'twenty-one shots'); e('music', 6, 'with music written in code');
  e('judge', 7, 'hand it to a judge'); e('agent', 7, 'gave a fresh agent'); e('names', 7, 'with no names on them'); e('last', 7, 'mine came last'); e('brutal', 7, 'the notes were brutal'); e('nface', 7, 'with no face'); e('ask', 7, 'the wedding ask'); e('olive', 7, 'muddy olive light'); e('furn', 7, 'like furniture'); e('right', 7, 'the judge was right');
  e('fixed', 8, 'so we fixed exactly'); e('face', 8, 'your face and the number'); e('ring', 8, 'the ring box sits'); e('bright', 8, 'the room got brighter'); e('gasps', 8, 'one person who gasps'); e('j2', 8, 'a second judge'); e('k55', 8, 'scored it five and a half'); e('bar8', 8, 'my bar is eight');
  e('two', 9, 'two corrections'); e('plan1', 9, 'my first plan'); e('show', 9, 'a game show'); e('point', 9, 'the whole point was'); e('m15', 9, 'fifteen minutes'); e('frames', 9, 'only ever needed the frames'); e('minute', 9, 'in about a minute'); e('once', 9, 'exported once');
  e('used', 10, 'everything i used'); e('kit', 10, 'the 2d stickman kit'); e('jt', 10, 'the blind judge'); e('speed', 10, 'the speed checks'); e('paid', 10, 'which is a paid plan'); e('nothing', 10, 'cost nothing'); e('ep', 10, 'the full episode'); e('beat', 10, 'it has to beat'); e('button', 10, 'which button');
}

// 1 · proof: their 4.6M film beside ours
function s1(t) {
  studio(t); const u = t - SEC(1).t, k = eout(since(t, 0, .6)), k2 = eout(since(t, E.ours - .2, .6));
  const wL = lerp(1680, 860, k2), xL = lerp(120, 80, k2);
  clip(t < 6 ? 'ifv-fly' : 'ifv-cup', xL, 190, wL, wL * 9 / 16, t, t < 6 ? 0 : 6, { cs: 26 });
  const v = count(t, .3, 3.2, 4600000, 3800000); chip(`${fmt(v)} views · 4 weeks`, xL + 20, 190 + wL * 9 / 16 + 54, { k, bg: P.lemon, size: 30 });
  if (k2 > 0) { cx.save(); cx.globalAlpha = k2; ours(980, 190, 860, 484, Math.max(0, t - E.ours + 1.5), { label: 'Made with Claude · today' }); cx.restore(); chip('every other tool: free', 1000, 728, { k: eout(since(t, E.free, .5)), size: 30 }); }
  title('One got 4.6M views. One I made with Claude.', t, .2, { y: 120, size: 56 });
  const ps = [['How both were made', E.byend + .4], ['Where mine fell apart', E.fell], ['The whole system, free on GitHub', E.home]];
  ps.forEach(([s, t0], i) => chip(`${i + 1}  ${s}`, 80 + i * 590, 930, { k: eout(since(t, t0, .4)), size: 28, bg: i === 1 ? P.coral : P.ivory, c: i === 1 ? P.ivory : P.ink }));
}
// 2 · the gold rush
function s2(t) {
  studio(t, 400);
  if (t < E.noticed) {
    kicker('the genre: What If', t, E.genre); title('Four weeks old, and already a gold rush', t, E.genre + .2, { y: 160 });
    const cards = [['ifv-cup', 'Ifverse', 4600000, 55000, E.oct7], ['mz-speed', 'Minute Zero', 2200000, 19400, E.mz], ['ifi-bus', 'Ifinite', 1700000, 12400, E.ifi], ['miko-love', 'Miko', 690000, 4170, E.miko]];
    cards.forEach(([c, name, v, s, t0], i) => { const k = eout(since(t, t0 - .15, .55)); if (k <= 0) return; const x = 80 + i * 450, y = 250 + (1 - k) * 40;
      cx.save(); cx.globalAlpha = k; clip(c, x, y, 420, 236, t, t0, { cs: 20 });
      text(M(count(t, t0, 1.4, v)), x, y + 330, 76, { c: P.lemon }); text('views', x + 4, y + 372, 24, { f: FM, w: 500, c: P.mute });
      text(fmt(s) + ' subscribers', x, y + 430, 30, { f: FM, w: 700 }); const ratio = v / s;
      if (t > t0 + 1.2) chip(`${Math.round(ratio)}× its subscribers`, x, y + 490, { k: eout(since(t, t0 + 1.2, .4)), bg: i === 3 ? P.coral : P.ivory, c: i === 3 ? P.ivory : P.ink, size: 24 }); cx.restore(); });
    if (t > E.quit - .2) chip('the kind of number that makes people quit their jobs', 1840, 940, { k: eout(since(t, E.quit - .2, .4)), a: 'c', size: 26 }) ;
  } else {
    kicker('then everybody noticed', t, E.noticed); title('Supply exploded. Views per video fell.', t, E.noticed + .1, { y: 160 });
    // uploads per week
    const wk = [['week 1', 11, E.noticed + .6], ['week 2', 54, E.w2], ['week 3', 147, E.w3]];
    card(80, 230, 820, 620, eout(since(t, E.noticed + .3, .5)), 'rgba(244,241,226,.06)');
    text('Uploads a week', 120, 300, 34, { f: FM, w: 700, c: P.mute });
    wk.forEach(([lab, n, t0], i) => { const k = eout(since(t, t0, .7)), h = 440 * n / 147 * k, x = 160 + i * 240; cx.fillStyle = i === 2 ? P.coral : P.sage; rr(x, 800 - h, 170, h, 12); cx.fill(); text(String(Math.round(n * k)), x + 85, 780 - h, 54, { a: 'center', c: P.ivory, alpha: k }); text(lab, x + 85, 840, 26, { f: FM, w: 500, a: 'center', c: P.mute, alpha: k }); });
    card(980, 230, 860, 620, eout(since(t, E.typical - .2, .5)), 'rgba(244,241,226,.06)');
    text('Median views of a new video', 1020, 300, 34, { f: FM, w: 700, c: P.mute, alpha: eout(since(t, E.typical - .2, .5)) });
    const k3 = eout(since(t, E.typical, 2.2)); const v = lerp(247000, 21000, k3);
    text(K(v), 1410, 560, 170, { a: 'center', c: k3 > .9 ? P.coral : P.lemon, alpha: eout(since(t, E.typical, .4)) });

const SECS = [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10];

// ---------- the frame ----------
function render(t) {
  WANT = []; let n = 0; for (let i = 0; i < LF.secs.length; i++) if (t >= LF.secs[i].t - .3) n = i;
  cx.save(); cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalAlpha = 1; cx.filter = 'none';
  SECS[n](t); cx.restore();
  // section dip: a 6-frame soft dip at each section start
  const d = t - (LF.secs[n].t - .3); if (n > 0 && d < .2) { cx.fillStyle = `rgba(16,21,18,${(.6 * (1 - d / .2)).toFixed(3)})`; cx.fillRect(0, 0, W, H); }
  const v = cx.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * 1.05); v.addColorStop(0, 'rgba(16,21,18,0)'); v.addColorStop(1, 'rgba(16,21,18,.35)'); cx.fillStyle = v; cx.fillRect(0, 0, W, H);
}
// seek for the exporter: wait for every clip it needs, then draw
async function seekClips() { await Promise.all(WANT.map(([n, ct]) => new Promise(async res => { const v = VID[n];
  if (v.readyState < 2) await new Promise(r => { v.addEventListener('loadeddata', r, { once: true }); v.load(); setTimeout(r, 6000); });
  if (Math.abs(v.currentTime - ct) < .02 && v.readyState >= 2) return res(); const done = () => { v.removeEventListener('seeked', done); res(); }; v.addEventListener('seeked', done); v.currentTime = ct; setTimeout(res, 3000); }))); }
window.frameB64 = async t => { render(t); await seekClips(); render(t); return cv.toDataURL('image/jpeg', .92).slice(23); };
window.seek = t => render(t); window.DUR = DUR;

// ---------- live preview with sound ----------
const au = document.getElementById('au'), pp = document.getElementById('pp'), fill = document.getElementById('fill'), tc = document.getElementById('tc'), bar = document.getElementById('bar');
const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function syncClips(t) { const live = new Set(WANT.map(w => w[0])); for (const n in VID) { const v = VID[n]; const w = WANT.find(x => x[0] === n); if (w && !au.paused) { if (Math.abs(v.currentTime - w[1]) > .25) v.currentTime = w[1]; if (v.paused && w[1] < CLIPS[n] - .1) v.play().catch(() => {}); } else if (!v.paused) v.pause(); } }
function loop() { const t = au.currentTime; render(t); syncClips(t); fill.style.width = (100 * t / DUR) + '%'; tc.textContent = mmss(t); if (!au.paused && !au.ended) requestAnimationFrame(loop); else { pp.textContent = 'Play'; } }
pp.onclick = () => { if (au.paused) { au.play(); pp.textContent = 'Pause'; loop(); } else { au.pause(); pp.textContent = 'Play'; } };
bar.onclick = e => { const r = bar.getBoundingClientRect(); au.currentTime = DUR * (e.clientX - r.left) / r.width; render(au.currentTime); seekClips().then(() => render(au.currentTime)); };
document.getElementById('td').textContent = mmss(DUR);
Promise.all([document.fonts.load(`800 64px "Bricolage Grotesque"`), document.fonts.load(`700 24px "JetBrains Mono"`), document.fonts.load(`500 24px "JetBrains Mono"`)]).catch(() => {}).then(() => {
  events(); render(0); window.__ready = true;
  if (!navigator.webdriver && !/embed=1/.test(location.search)) { const b = document.getElementById('play'); b.hidden = false; b.onclick = () => { b.hidden = true; au.currentTime = 0; au.play(); pp.textContent = 'Pause'; loop(); }; }
});
