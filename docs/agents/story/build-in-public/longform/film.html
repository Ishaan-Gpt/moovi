<script>
// The long form in the reference's form (ishaan-motion 1.17.77): the real work on screen. Every window shows a real capture (YouTube,

const W = 1920, H = 1080, cv = document.getElementById('cv'), cx = cv.getContext('2d');
const LF = window.LF, WD = LF.words, DUR = LF.dur + 1, RECTS = window.RECTS, REAL = window.REAL;
const REMOTE = location.protocol === 'https:', SCR = REMOTE ? 'screens/' : '../screens/', EXT = REMOTE ? '.jpg' : '.png', COS = REMOTE ? 'coldopen/film.html?embed=1' : '../coldopen/film.html?embed=1';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
const eio = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
function at(sec, phrase, off = 0) { const si = LF.secs.findIndex(s => s.n === sec), S = LF.secs[si], toks = phrase.split(/\s+/).map(norm), end = si + 1 < LF.secs.length ? LF.secs[si + 1].i0 : LF.words.length; if (!S) return 0;
  for (let i = S.i0; i < end; i++) { let ok = true; for (let k = 0; k < toks.length; k++) if (!WD[i + k] || norm(WD[i + k].w) !== toks[k]) { ok = false; break; } if (ok) return WD[i].t + off; }
  console.warn('missing', sec, phrase); return (S ? S.t : 0) + off; }
function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect(x, y, w, h, r); }
const R = (page, text) => (RECTS[page] || {})[text] || [400, 400, 1600, 600];

// ---------- assets ----------
const IMG = {}, img = (k, src) => { if (IMG[k]) return IMG[k]; const i = new Image(); i.src = src; IMG[k] = i; return i; };
['yt-ifverse-watch', 'yt-ifverse-videos', 'yt-mz-watch', 'yt-ifinite-watch', 'yt-miko-watch', 'yt-ifology-watch', 'yt-fnsf-watch', 'yt-search', 'yt-s-rewind', 'yt-s-words',
 'gh-coldopen', 'gh-judges', 'gh-film', 'gh-grab', 'gh-brief', 'fish-ethan', 'claude-pricing'].forEach(k => img(k, SCR + k + EXT));
['gh-study', 'gh-plan1', 'gh-short-timings', 'gh-co-script', 'gh-co-timings', 'yt-search', 'yt-s-rewind', 'yt-s-words', 'gh-skill'].forEach(k => img(k + '-full', SCR + k + '-full' + EXT));
['v1-1', 'v1-5.5', 'v1-11', 'v2-0001.00', 'v2-0005.50', 'v2-0011.00'].forEach(k => img(k, 'img/' + k + '.jpg')); img('sheet', 'real/sheet-ifverse.jpg');
const CLIPS = ['ifv-fly', 'ifv-cup', 'ifv-number', 'ifv-title', 'ifv-how', 'mz-speed', 'ifi-bus', 'ifi-flip', 'miko-love', 'ifo-3d', 'fnsf-money', 'ifv-iq', 'short3d'], VID = {};
CLIPS.forEach(n => { const v = document.createElement('video'); v.src = 'clips/' + n + '.mp4'; v.muted = true; v.preload = 'auto'; v.playsInline = true; VID[n] = v; });
const co = document.createElement('iframe'); co.id = 'co'; co.src = COS; document.body.appendChild(co);
const CO_URL = 'localhost:4371/coldopen/film.html';
const coReady = () => { try { return co.contentWindow.__ready === true; } catch { return false; } };
let WANT = [];

// ---------- the desktop and the window ----------
function wallpaper() { const g = cx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2C3A31'); g.addColorStop(.5, '#6F8A64'); g.addColorStop(1, '#C9C27E'); cx.fillStyle = g; cx.fillRect(-3000, -3000, W + 6000, H + 6000);
  const r = cx.createRadialGradient(1500, 200, 0, 1500, 200, 1300); r.addColorStop(0, 'rgba(255,243,188,.35)'); r.addColorStop(1, 'rgba(255,243,188,0)'); cx.fillStyle = r; cx.fillRect(-3000, -3000, W + 6000, H + 6000); }
const CW = 2400, CH = 1500;   // window content in capture px (1600 x 1000 css at 1.5)
// a window at desktop (x, y, w); content drawn in capture px by fn, scrolled by sy
function windowAt(x, y, w, title, dark, sy, fn, ch = CH) {
  const k = w / CW, h = ch * k;
  cx.save(); cx.shadowColor = 'rgba(0,0,0,.45)'; cx.shadowBlur = 60; cx.shadowOffsetY = 24; cx.fillStyle = dark ? '#1b1d21' : '#eceef1'; rr(x, y, w, h + 46, 14); cx.fill(); cx.restore();
  cx.fillStyle = dark ? '#1b1d21' : '#e3e6ea'; rr(x, y, w, 46, [14, 14, 0, 0]); cx.fill();
  ['#e5675d', '#e9b84c', '#6cc565'].forEach((c, j) => { cx.fillStyle = c; cx.beginPath(); cx.arc(x + 24 + j * 22, y + 23, 7, 0, 7); cx.fill(); });
  cx.fillStyle = dark ? '#2a2d33' : '#fff'; rr(x + 110, y + 9, w - 220, 28, 14); cx.fill();
  cx.font = '500 15px Inter, system-ui'; cx.fillStyle = dark ? '#c9ced6' : '#3c4048'; cx.textBaseline = 'middle'; cx.textAlign = 'left'; cx.fillText(title, x + 130, y + 24);
  cx.save(); rr(x, y + 46, w, h, [0, 0, 14, 14]); cx.clip(); cx.translate(x, y + 46); cx.scale(k, k); cx.translate(0, -sy); fn(); cx.restore();
  return { x, y: y + 46, k, sy };
}
const P2D = (w, px, py) => [w.x + px * w.k, w.y + (py - w.sy) * w.k];

// content painters (capture px)
function pageImg(key, sy) { const i = IMG[key]; if (i && i.complete && i.naturalWidth) cx.drawImage(i, 0, 0); }
function playerClip(name, ct, r) { const v = VID[name], dur = v.duration || 5; ct = ((ct % (dur - .1)) + (dur - .1)) % (dur - .1); WANT.push([name, ct]); cx.save(); cx.beginPath(); cx.rect(r[0], r[1], r[2] - r[0], r[3] - r[1]); cx.clip(); cx.fillStyle = '#000'; cx.fillRect(r[0], r[1], r[2] - r[0], r[3] - r[1]);
  if (v.readyState >= 2) { const s = Math.max((r[2] - r[0]) / v.videoWidth, (r[3] - r[1]) / v.videoHeight); cx.drawImage(v, (r[0] + r[2]) / 2 - v.videoWidth * s / 2, (r[1] + r[3]) / 2 - v.videoHeight * s / 2, v.videoWidth * s, v.videoHeight * s); } cx.restore(); }
const TL = 66, TX = 90, TY = 130;   // text window line layout (capture px)
function textFile(lines, hl) { cx.fillStyle = '#16181c'; cx.fillRect(0, 0, CW, Math.max(CH, TY + lines.length * TL + 200)); cx.font = '500 40px "JetBrains Mono", monospace'; cx.textBaseline = 'middle'; cx.textAlign = 'left';
  lines.forEach((l, i) => { const y = TY + i * TL; cx.fillStyle = '#5c6370'; cx.fillText(String(i + 1).padStart(3), 10, y); cx.fillStyle = hl.includes(i) ? '#F3E7A0' : (l.startsWith('#') || l.startsWith('PS>') ? '#9DB38A' : '#d7dae0'); cx.fillText(l.length > 92 ? l.slice(0, 92) + '…' : l, TX + 90, y); }); }
const lineRect = (i, j = i) => [TX + 70, TY + i * TL - 34, 2300, TY + j * TL + 34];
function imageFit(key) { const i = IMG[key]; cx.fillStyle = '#0d0f0d'; cx.fillRect(0, 0, CW, CH); if (!i || !i.naturalWidth) return; const s = Math.min(CW / i.naturalWidth, CH / i.naturalHeight); cx.drawImage(i, (CW - i.naturalWidth * s) / 2, (CH - i.naturalHeight * s) / 2, i.naturalWidth * s, i.naturalHeight * s); }
function coFrame(ct) { cx.fillStyle = '#000'; cx.fillRect(0, 0, CW, CH); if (coReady()) { co.contentWindow.seek(Math.max(0, ct)); cx.drawImage(co.contentWindow.document.getElementById('cv'), 0, 75, CW, 1350); } }
function videoFull(name, ct) { playerClip(name, ct, [0, 75, CW, 1425]); }

// highlight + cursor
function mark(w, r, k) { if (k <= 0) return; const [x, y] = P2D(w, r[0], r[1]), [x2, y2] = P2D(w, r[2], r[3]), p = 8;
  cx.save(); cx.globalAlpha = k; cx.strokeStyle = '#F3E7A0'; cx.lineWidth = 5; rr(x - p, y - p, x2 - x + 2 * p, y2 - y + 2 * p, 10); cx.stroke(); cx.fillStyle = 'rgba(243,231,160,.16)'; cx.fill(); cx.restore();
  const q = eio(k); cursor(lerp(x2 + 160, Math.min(x2, x + 220) - 6, q), lerp(y2 + 120, y2 - 4, q)); }
function cursor(x, y) { cx.save(); cx.translate(x, y); cx.fillStyle = '#fff'; cx.strokeStyle = '#111'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(0, 30); cx.lineTo(8, 23); cx.lineTo(14, 36); cx.lineTo(19, 34); cx.lineTo(13, 21); cx.lineTo(23, 21); cx.closePath(); cx.fill(); cx.stroke(); cx.restore(); }

// ---------- a shot ----------
// { t0, kind: 'page'|'text'|'img'|'co'|'video'|'pair'|'side', key, title, dark, full, clip: [name, t0, from], lines, keys: [[t, rect, share]], marks: [[t, rect]], hl: [[t, [lines]]], co: [from, rate] }
const MAIN = { x: 160, y: 70, w: 1600 };
function contentH(s) { if (s.kind === 'page' && s.full) { const i = IMG[s.key + '-full']; return i && i.naturalHeight || CH; } if (s.kind === 'text') return TY + s.lines.length * TL + 200; return CH; }
const syFor = (s, r) => { const hmax = contentH(s) - CH; return hmax <= 0 ? 0 : clamp((r[1] + r[3]) / 2 - CH * .42, 0, hmax); };
function interp(keys, t) { let a = keys[0]; for (const k of keys) if (t >= k[0]) a = k; const i = keys.indexOf(a), b = keys[i + 1] || a; const q = b === a ? 0 : eio((t - a[0]) / Math.max(.2, Math.min(.9, b[0] - a[0])));
  if (b === a || t < b[0] - Math.min(.9, b[0] - a[0])) return [a[1], a[2]];   // hold, then glide in the last 0.9 s before the next key
  const q2 = eio((t - (b[0] - Math.min(.9, b[0] - a[0]))) / Math.min(.9, b[0] - a[0])); return [a[1].map((v, j) => lerp(v, b[1][j], q2)), lerp(a[2], b[2], q2)]; }
function drawShot(s, t) {
  const keys = s.keys || [[s.t0, [0, 0, CW, CH], 1]]; let [rect, share] = interp(keys, t);
  if (s.kind === 'pair') return drawPair(s, t, rect, share);
  if (s.kind === 'side') return drawSide(s, t);
  if (s.kind === 'cofull') return drawCoFull(s, t);

    if (s.kind === 'page') { pageImg(s.full ? s.key + '-full' : s.key); if (s.clip) playerClip(s.clip[0], (t - s.clip[1]) + (s.clip[2] || 0), R(s.key, '#movie_player')); }
    else if (s.kind === 'text') { let hl = []; for (const [t1, ls] of s.hl || []) if (t >= t1) hl = ls; textFile(s.lines, hl); }
    else if (s.kind === 'img') imageFit(s.key);
    else if (s.kind === 'co') coFrame(s.co[0] + (t - s.t0) * (s.co[1] ?? 1));
    else if (s.kind === 'video') videoFull(s.clip[0], t - s.t0 + (s.clip[2] || 0));
  };

  const w0 = { x: MAIN.x, y: MAIN.y + 46, k: MAIN.w / CW, sy }; const [x1, y1] = P2D(w0, rect[0], rect[1]), [x2, y2] = P2D(w0, rect[2], rect[3]);
  let lastK = keys[0][0]; for (const k of keys) if (t >= k[0]) lastK = k[0]; for (const [t1] of s.marks || []) if (t >= t1 && t1 > lastK) lastK = t1; const dr = Math.min(7, t - lastK);
  const z = Math.min(3.2, W * share / Math.max(40, x2 - x1)) * (1 + .014 * dr); cx.save(); cx.translate(W / 2, H / 2); cx.scale(z, z); cx.translate(-(x1 + x2) / 2 - dr * 5, -(y1 + y2) / 2 + dr * 2);
  wallpaper(); const w = windowAt(MAIN.x, MAIN.y, MAIN.w, title, s.dark, sy, paint);
  let m = null, mt = 0; for (const [t1, r] of s.marks || []) if (t >= t1) { m = r; mt = t1; } if (m) mark(w, m, clamp((t - mt) / .4));
  cx.restore();
}
function drawPair(s, t) {   // before | after, two image windows
  cx.save(); const z = lerp(1, 1.04, clamp((t - s.t0) / 4)); cx.translate(W / 2, H / 2); cx.scale(z, z); cx.translate(-W / 2, -H / 2); wallpaper();
  windowAt(60, 220, 880, 'before · coldopen v1 · frame ' + s.label, true, 0, () => imageFit(s.a));
  windowAt(980, 220, 880, 'after · coldopen v2 · frame ' + s.label, true, 0, () => imageFit(s.b));
  cx.font = '600 30px Inter'; cx.fillStyle = '#F4F1E2'; cx.textAlign = 'center'; cx.fillText('before', 500, 190); cx.fillText('after', 1420, 190); cx.restore(); }
function drawCoFull(s, t) {   // our film full frame, a slow push
  cx.save(); const z = lerp(1, 1.05, clamp((t - s.t0) / 12)); cx.translate(W / 2, H / 2); cx.scale(z, z); cx.translate(-W / 2, -H / 2);
  cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H); if (coReady()) { co.contentWindow.seek(Math.max(0, s.from + t - s.t0)); cx.drawImage(co.contentWindow.document.getElementById('cv'), 0, 0, W, H); } cx.restore(); }
function drawSide(s, t) {   // a reference film beside ours; with the blind judge's numbers when the beat is about them
  cx.save(); const z = lerp(1, 1.05, clamp((t - s.t0) / 8)); cx.translate(W / 2, H / 2); cx.scale(z, z); cx.translate(-W / 2, -H / 2); wallpaper();
  windowAt(40, 190, 920, 'youtube.com/watch?v=MroF1XmHOZw, Ifverse, 4.6M views', false, 0, () => playerClip(s.clip, t - s.t0, [0, 75, CW, 1425]));
  windowAt(980, 190, 900, CO_URL + ', made with Claude', true, 0, () => coFrame(s.from + t - s.t0));
  const lab = s.scores ? ['blind judge 2: 4.83', 'blind judge 2: 5.5'] : s.mineLost ? ['blind judge 1: 5.8', 'blind judge 1: 4.3'] : null;
  if (lab) { const k = clamp((t - s.t0 - .4) / .4); cx.globalAlpha = k; cx.font = '600 34px Inter'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    [[500, lab[0], '#F4F1E2'], [1430, lab[1], s.scores ? '#F3E7A0' : '#E06B52']].forEach(([x, s2, c]) => { const w = cx.measureText(s2).width + 44; cx.fillStyle = 'rgba(20,26,22,.85)'; rr(x - w / 2, 120, w, 54, 27); cx.fill(); cx.fillStyle = c; cx.fillText(s2, x, 148); }); cx.globalAlpha = 1; }
  cx.restore(); }

// ---------- the cut, keyed to the voice ----------
let SHOTS = [];
function build() {
  const A = at, P = (k, x) => R(k, x), ALL = [0, 0, CW, CH];
  const WATCH = k => ({ player: P(k, '#movie_player'), views: P(k, Object.keys(RECTS[k] || {}).find(x => /views/.test(x)) || '#movie_player') });
  const page = (t0, key, title, o = {}) => ({ t0, kind: 'page', key, title, dark: key.startsWith('gh-'), ...o });
  const text = (t0, name, title, o = {}) => ({ t0, kind: 'text', lines: REAL[name], title, dark: true, ...o });
  const iv = WATCH('yt-ifverse-watch'), mz = WATCH('yt-mz-watch'), ifi = WATCH('yt-ifinite-watch'), mk = WATCH('yt-miko-watch'), ifo = WATCH('yt-ifology-watch'), fn = WATCH('yt-fnsf-watch');

  const S = [], co = (t0, from, title, keys, rate = 1) => S.push({ t0, kind: 'co', co: [from, rate], title: title || CO, dark: true, keys: keys || [[t0, ALL, 1]] });
  // 0 · the hook: our film with its own sound; the payoff: ours beside theirs, with the scores
  S.push({ t0: LF.cos[0].t, kind: 'cofull', from: LF.cos[0].from });
  S.push({ t0: LF.cos[1].t, kind: 'side', clip: 'ifv-cup', from: LF.cos[1].from, scores: true, coSound: true });
  // 1 · proof and the stake
  const p0 = LF.secs.find(s => s.n === 1).t, m46 = A(1, 'four point six million'), on = A(1, 'and this one'), bj = A(1, 'a blind judge said'), be = A(1, 'but by the end'), wh = A(1, 'and the whole system');
  S.push(page(p0, 'yt-ifverse-watch', yt + 'MroF1XmHOZw', { clip: ['ifv-cup', p0], keys: [[p0, iv.player, .95], [m46 - .2, iv.views, .3]], marks: [[m46 + .2, iv.views]] }));
  S.push({ t0: on, kind: 'side', clip: 'ifv-cup', from: .3 });
  S.push({ t0: bj, kind: 'side', clip: 'ifv-fly', from: 2.5, mineLost: true });
  S.push({ t0: be, kind: 'side', clip: 'ifv-cup', from: 4.6 });
  S.push(page(wh, 'gh-skill', 'github.com/Ishaan-Gpt/ishaan-stickmen', { full: true, keys: [[wh, [0, 0, CW, CH], 1], [wh + 1.2, P('gh-skill', 'git clone https://github.com/Ishaan-Gpt/ishaan-stickmen'), .55]], marks: [[wh + 1.4, P('gh-skill', 'git clone https://github.com/Ishaan-Gpt/ishaan-stickmen')]] }));
  // 11 · the first failure, inside minute one
  const f0 = LF.secs.find(s => s.n === 11).t, gh1 = A(11, 'i gave claude one hour'), m47 = A(11, 'forty-seven minutes'), f5 = A(11, 'two blind judges'), lg = A(11, "the legs couldn't run"), st = A(11, 'so i went back');
  S.push({ t0: f0, kind: 'video', clip: ['short3d', f0], title: 'short/out/stillest-man-alive.mp4, my first try, in 3D', dark: true, keys: [[f0, ALL, 1]] });
  S.push(page(m47 - .2, 'gh-short-timings', gh + 'short/TIMINGS.md', { full: true, keys: [[m47 - .2, P('gh-short-timings', '47 min wall'), .45]], marks: [[m47 + .1, P('gh-short-timings', '47 min wall')]] }));
  S.push({ t0: f5, kind: 'video', clip: ['short3d', f5, 2], title: 'blind judges: 5.17, then 5.0', dark: true, keys: [[f5, ALL, 1], [lg, [700, 300, 1700, 1100], .95]] });
  S.push(page(st, 'yt-search', 'youtube.com/results?search_query=what+if+stickman', { full: true, keys: [[st, [420, 160, 2340, 1300], .95]] }));
  // 2 · the gold rush, short
  const g0 = A(2, 'the genre is called'), o7 = A(2, 'seventh of october'), w46 = A(2, 'watched four point six');
  S.push(page(g0, 'yt-search', 'youtube.com/results?search_query=what+if+stickman', { full: true, keys: [[g0, [420, 1500, 2340, 2700], .95]] }));
  S.push(page(A(2, 'ifverse posted'), 'yt-ifverse-watch', yt + 'MroF1XmHOZw', { clip: ['ifv-cup', A(2, 'ifverse posted')], keys: [[A(2, 'ifverse posted'), iv.player, .95], [o7, [24, 1080, 1692, 1300], .7], [w46 - .2, iv.views, .32]], marks: [[w46, iv.views]] }));
  const tw = A(2, 'within three weeks'), mzt = A(2, 'minute zero got'), mk0 = A(2, 'and miko got'), k2 = A(2, 'only seven thousand');
  S.push(page(tw, 'yt-search', 'youtube.com/results?search_query=what+if+stickman', { full: true, keys: [[tw, [420, 2600, 2340, 3800], .95]] }));
  S.push(page(mzt, 'yt-mz-watch', yt + 'gpLC_ELulyg', { clip: ['mz-speed', mzt], keys: [[mzt, mz.player, .9], [mzt + 1.2, mz.views, .3]], marks: [[mzt + 1.4, mz.views]] }));
  S.push(page(mk0, 'yt-miko-watch', yt + 'MGZdDZyQUGg', { clip: ['miko-love', mk0], keys: [[mk0, mk.player, .9], [A(2, 'almost seven hundred thousand'), mk.views, .3], [k2, P('yt-miko-watch', '7.1K subscribers'), .3]], marks: [[A(2, 'almost seven hundred thousand') + .2, mk.views], [k2 + .2, P('yt-miko-watch', '7.1K subscribers')]] }));
