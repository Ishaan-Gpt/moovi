  for (let i = S.i0; i < end; i++) { let ok = true; for (let k = 0; k < toks.length; k++) if (!WD[i + k] || norm(WD[i + k].w) !== toks[k]) { ok = false; break; } if (ok) return WD[i].t + off; }

// ---------- assets, all preloaded behind the gate ----------
const IMG = {}, VID = {}, loads = [];
const img = (k, src) => { const i = new Image(); i.src = src; IMG[k] = i; loads.push(Promise.race([i.decode().catch(() => {}), new Promise(r => { i.addEventListener('load', r, { once: true }); setTimeout(r, 20000); })])); };

// ---------- the desk and the windows ----------

  const r = cx.createRadialGradient(1500, 160, 0, 1500, 160, 1300); r.addColorStop(0, 'rgba(255,243,188,.32)'); r.addColorStop(1, 'rgba(255,243,188,0)'); cx.fillStyle = r; cx.fillRect(-200, -200, W + 400, H + 400); }

  cx.fillStyle = o.bg || 'rgba(20,26,22,.86)'; rr(o.center ? x - w / 2 : x, y, w, h, h / 2); cx.fill(); cx.fillStyle = o.c || C.ivory; cx.textAlign = o.center ? 'center' : 'left'; cx.textBaseline = 'middle'; cx.fillText(s, o.center ? x : x + 22, y + h / 2 + 1); cx.restore(); }

// ---------- shot painters (each is a pure function of t) ----------
const P = {
  full(s, t) {   // footage, full frame, a slow push; a stat chip low
    const v = VID[s.clip], d = v.duration || 5, ct = Math.min(d - .05, (t - s.t0) * (s.rate || 1) + (s.from || 0)); WANT.push([s.clip, ct]);

    cx.save(); cx.filter = 'blur(14px) brightness(.45)'; if (v.readyState >= 2) cx.drawImage(v, -40, -40, W + 80, H + 80); cx.restore();

    const t0 = s.steps[0][2]; if (t < t0 - .2) return; y = 210;
    cx.save(); cx.globalAlpha = clamp((t - t0 + .2) / .3); cx.fillStyle = 'rgba(20,26,22,.82)'; rr(860, 150, 920, 640, 26); cx.fill(); cx.restore();
    s.steps.forEach(([n, txt, t1, tag], i) => { const k = clamp((t - t1) / .35); if (k <= 0) return; const yy = 230 + i * 116; cx.save(); cx.globalAlpha = k;
      cx.fillStyle = C.lemon; cx.font = '800 52px Inter'; cx.textBaseline = 'middle'; cx.textAlign = 'left'; cx.fillText(n, 910, yy);
      cx.fillStyle = C.ivory; cx.font = '700 34px Inter'; cx.fillText(txt, 980, yy - (tag ? 14 : 0)); if (tag) { cx.fillStyle = C.lemon; cx.font = '600 24px Inter'; cx.fillText(tag.toUpperCase(), 980, yy + 26); } cx.restore(); });
  },
  graph(s, t) {   // the blind judges' scores, round by round
    const v = VID['e-save'], ct = 2; WANT.push(['e-save', ct]); cx.save(); cx.filter = 'blur(16px) brightness(.4)'; if (v.readyState >= 2) cx.drawImage(v, -40, -40, W + 80, H + 80); cx.restore();
    cx.fillStyle = C.ivory; cx.font = '800 46px Inter'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('Blind judge scores, round by round', W / 2, 150);
    const n = s.scores.length, bw = 170, gap = 60, x0 = W / 2 - (n * bw + (n - 1) * gap) / 2, base = 880, unit = 58;
    cx.strokeStyle = C.coral; cx.setLineDash([12, 10]); cx.lineWidth = 4; cx.beginPath(); cx.moveTo(x0 - 30, base - 8 * unit); cx.lineTo(x0 + n * (bw + gap), base - 8 * unit); cx.stroke(); cx.setLineDash([]);
    cx.fillStyle = C.coral; cx.font = '700 26px Inter'; cx.textAlign = 'left'; cx.fillText('the bar: 8', x0 + n * (bw + gap) - 150, base - 8 * unit - 26);
    s.scores.forEach(([lab, sc], i) => { const k = eio((t - s.t0 - .25 - i * .55) / .6); if (k <= 0) return; const x = x0 + i * (bw + gap), h = sc * unit * k, last = i === n - 1;
      cx.fillStyle = last ? C.lemon : 'rgba(244,241,226,.85)'; rr(x, base - h, bw, h, 12); cx.fill();
      cx.fillStyle = C.ivory; cx.font = '800 48px Inter'; cx.textAlign = 'center'; cx.fillText(String(Math.round(sc * k * 10) / 10), x + bw / 2, base - h - 40);
      cx.font = '600 24px Inter'; cx.fillStyle = C.mute; cx.fillText(lab, x + bw / 2, base + 36); });
  },
  prompt(s, t) {   // the exact prompt, typed out big in a Claude Code window
    const b = frame(WX, WY, WW, WH, 'Claude Code', true); const lines = REAL[s.p].join('\n').trim();
    inside(b, () => { const font = '500 34px "JetBrains Mono", monospace', L = wrap(lines, b.w - 150, font), total = lines.length, n = Math.floor(clamp((t - s.t0 - .3) / Math.max(1.5, Math.min(4, (s.dur || 6) * .55))) * total);
      cx.font = font; cx.textBaseline = 'top'; cx.textAlign = 'left'; let used = 0, y = b.y + 60; cx.fillStyle = C.sage; cx.fillText('❯', b.x + 50, y);
      for (const l of L) { const take = Math.max(0, Math.min(l.length, n - used)); cx.fillStyle = C.ivory; cx.fillText(l.slice(0, take), b.x + 100, y); used += l.length + 1; if (take < l.length) { if ((t * 2 % 1) < .6) { cx.fillStyle = C.lemon; cx.fillRect(b.x + 100 + cx.measureText(l.slice(0, take)).width + 2, y + 2, 16, 38); } break; } y += 52; }
      cx.font = '600 22px Inter'; cx.fillStyle = C.mute; cx.fillText('PROMPTS.md · step ' + s.step + ' · in the free skill', b.x + 50, b.y + b.h - 56); });
  },
  text(s, t) {   // a real file or output, crisp, with the spoken lines lit

    inside(b, () => { const size = s.size || 30, lh = size * 1.55, lines = REAL[s.file]; const fit = Math.floor((b.h - 80) / lh), first = hl.length ? Math.max(0, Math.min(hl[0] - 3, lines.length - fit)) : 0;
      cx.font = `500 ${size}px "JetBrains Mono", monospace`; cx.textBaseline = 'middle'; cx.textAlign = 'left';
      lines.forEach((l, i) => { const y = b.y + 50 + (i - first) * lh; if (y < b.y || y > b.y + b.h) return; const on = hl.includes(i);
        if (on) { cx.fillStyle = 'rgba(243,231,160,.13)'; cx.fillRect(b.x + 20, y - lh / 2, b.w - 40, lh); }
        cx.fillStyle = on ? C.lemon : (/^#|^PS>|^\(|^channel/.test(l) ? C.sage : '#d7dae0'); let tx = l.replace(/\*\*/g, ''); const maxW = b.w - 100; if (cx.measureText(tx).width > maxW) { while (tx.length > 4 && cx.measureText(tx + '…').width > maxW) tx = tx.slice(0, -1); tx += '…'; } cx.fillText(tx, b.x + 50, y); }); });
  },
  clip(s, t) {   // a reference clip, big, with its channel and its real numbers
    const x = 240, y = 120, w = 1440, h = 810; const v = VID[s.clip], d = v.duration || 5, ct = (((t - s.t0) * (s.rate || 1) + (s.from || 0)) % (d - .1) + (d - .1)) % (d - .1); WANT.push([s.clip, ct]);
    cx.save(); cx.shadowColor = 'rgba(0,0,0,.5)'; cx.shadowBlur = 60; cx.fillStyle = '#000'; rr(x, y, w, h, 18); cx.fill(); cx.restore();

  },
  page(s, t) {   // a real captured page, fitted, a gentle push to the spoken detail
    const i = IMG[s.key]; const b = frame(WX, WY, WW, WH, s.title, s.dark);
    inside(b, () => { if (!i || !i.naturalWidth) return; const sc = b.w / i.naturalWidth, f = s.focus, k = f ? eio((t - s.t0 - .5) / 1.2) : 0, z = 1 + (f ? (s.zoom || 1.4) - 1 : 0) * k;
      const fx = f ? (f[0] + f[2]) / 2 * sc : b.w / 2, fy = f ? (f[1] + f[3]) / 2 * sc : b.h / 2, ox = lerp(b.w / 2, fx, k), oy = lerp(b.h / 2, fy, k);
      cx.translate(b.x + b.w / 2, b.y + b.h / 2); cx.scale(z, z); cx.translate(-ox, -oy); cx.drawImage(i, 0, 0, i.naturalWidth * sc, i.naturalHeight * sc);
      if (s.mark) { const m = s.mark; mark(m[0] * sc, m[1] * sc, (m[2] - m[0]) * sc, (m[3] - m[1]) * sc, clamp((t - s.t0 - 1.4) / .4)); } });

  },

};
function stepLabel(t) { let st = null; for (const x of STEPS) if (t >= x[0] - .05) st = x; if (!st || !st[1]) return; const k = clamp((t - st[0]) / .4);

// ---------- the cut ----------
let SHOTS = [], STEPS = [];
function build() {
  const A = at, S = [], add = (t0, kind, o = {}) => S.push({ t0, kind, ...o });

  const full = (t0, clip, o = {}) => add(t0, 'full', { clip, ...o });
  // the hook: Countdown's count and Giant's fall, with its own sound
  full(LF.cos[0].t, 'e-hook', { noPush: true });

  full(A(30, 'fifty stickmen'), 'e-arena');
  full(A(30, 'one shrinking gold circle'), 'e-rule', { from: 1 });
  full(A(30, 'a billion dollars'), 'e-rule', { from: 10.5 });
  add(A(30, 'claude made every frame'), 'text', { file: 'cast-code', title: 'kit/cast.js · every player is code', size: 30, hl: [[A(30, 'claude made every frame') + .4, [1, 2, 3, 4]]] });
  full(A(30, 'no ai video generator'), 'e-cards', { from: 33, stat: 'no AI video generator · every frame is code' });
  add(A(30, 'the stickman channels'), 'clip', { clip: 'ifv-cup', who: 'Ifverse', stat: '4.6M views · 59K subscribers' });

  // 31 · the promise and the map
  add(A(31, 'in the next few minutes'), 'map', { items: [['the five steps', A(31, 'the five steps')], ['v1 scored 2 / 10', A(31, 'the first version')], ['how it climbed to 9', A(31, 'how it climbed')], ['the whole workflow, free', A(31, 'the whole workflow')]], steps: [['1', 'Steal the why from the biggest videos', A(31, 'step one')], ['2', 'Build your cast in code', A(31, 'step two')], ['3', 'Tell the story the MrBeast way', A(31, 'step three')], ['4', 'The blind judge', A(31, 'step four'), 'the part every tutorial skips'], ['5', 'Sound and one export', A(31, 'step five')]] });
