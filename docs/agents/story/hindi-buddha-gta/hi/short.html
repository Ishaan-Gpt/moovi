<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA 6 Mein Buddha</title>
<!-- "GTA 6 Mein Buddha" (Hindi Short, 9:16). One page, every shot word-keyed (cues.js + timing.js), three.js r128 (vendored).
     short.html?t=12.3 seeks; ?cap=en shows the English caption track on the same picture (HUD words follow); ?nocap=1 hides captions;
     ?dub=en is the English dub (English voice, the shots re-timed to it, English captions and HUD); ?clean=1 hides the whole overlay; ?embed=1 for capture/export (no UI, no autoplay); ?res=720 (default) is the 3D render width.
     window.sceneRange, window.seek(t) (pure, synchronous), window.__ready, window.frameB64(t) (composited JPEG), window.frameTo(t) (composited canvas). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#100c1c;--ink:#efe8f6;--mute:#9a90b0;--panel:#1c1630;--line:#3a3058}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.4 'Baloo 2',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;overflow-x:hidden}
#ph{position:relative;width:min(540px,calc(100vw - 32px),calc((100vh - 120px) * .5625));aspect-ratio:9/16;overflow:hidden;background:#07060e;border-radius:10px}
#ph canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.embed body{padding:0;gap:0;display:block}
.embed #ph{width:540px;height:960px;border-radius:0}
#bar{display:flex;gap:10px;align-items:center;width:min(540px,calc(100vw - 32px))}
#bar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font:700 14px 'Baloo 2';cursor:pointer}
#bar input{flex:1}
#tm{font:600 13px 'Baloo 2';color:var(--mute);min-width:92px;text-align:right}
.embed #bar{display:none}
</style>
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>
</head>
<body>
<div id="ph"><canvas id="cv" width="720" height="1280"></canvas><canvas id="ov" width="1080" height="1920"></canvas></div>
<div id="bar"><button id="pp">Play</button><input id="sc" type="range" min="0" max="70" step="0.01" value="0"><span id="tm">0.00</span><button id="lg" title="caption track">HI</button></div>
<audio id="au" preload="auto"></audio>
<script src="vendor/three.r128.min.js"></script>
<script src="palette.js"></script>
<script src="timing.js"></script>
<script>if (new URLSearchParams(location.search).get('dub') === 'en') document.write('<script src="timing-en.js"><\/script>');   // the English dub: the same shots on the English voice's clock</script>
<script src="script.js"></script>
<script src="cues.js"></script>
<script src="post.js"></script>
<script src="../../hindi-gandhi/cast/family.js"></script>
<script src="buddha.js"></script>
<script src="../../hindi-gandhi/cast/herorig.js"></script>
<script src="../../hindi-gandhi/cast/acting2.js"></script>
<script src="cast.js"></script>
<script src="sets.js"></script>
<script src="shots.js"></script>
<script src="captions.js"></script>
<script src="overlay.js"></script>
<script>
'use strict';
(function () {
  const Q = new URLSearchParams(location.search), EMBED = Q.has('embed'), TAIL = 1.0;
  function boot() {
  const t00 = performance.now();
  const stage = makeStage(THREE, document.getElementById('cv'));
  const X = { cam: new THREE.PerspectiveCamera(30, 1080 / 1920, 4, 60000), stage };
  Object.assign(X, BSETS(THREE, stage.R, stage.lin, BCAST(THREE, stage.lin))); window.__X = X;
  const SH = window.SHOTS.slice();
  const starts = SH.map(s => s.at());
  for (let i = 1; i < starts.length; i++) if (starts[i] <= starts[i - 1]) console.warn('shot order', SH[i].id, starts[i - 1], starts[i]);
  const DUR = filmDuration() + TAIL; window.DUR = DUR;
  window.sceneRange = [0, DUR]; window.__shots = SH.map((s, i) => ({ id: s.id, at: +starts[i].toFixed(3) }));
  const ov = document.getElementById('ov'), og = ov.getContext('2d');
  const hv = new THREE.Vector3();
  function faceRects(cam, set) { const out = [];
    [set.hero, set.owner].concat(set.gang).forEach((rig) => { if (!rig || !rig.root.visible) return;
      const hp = rig.headG.getWorldPosition(hv).clone(), r = 19;
      const c = hp.clone().project(cam); if (c.z > 1 || c.z < -1 || Math.abs(c.x) > 1.1 || Math.abs(c.y) > 1.1) return;
      const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0).multiplyScalar(r), up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1).multiplyScalar(r * 1.08);
      const a = hp.clone().add(right).add(up).project(cam), b = hp.clone().sub(right).sub(up).project(cam);
      const xs = [a.x, b.x].map(x => (x * 0.5 + 0.5) * 1080), ys = [a.y, b.y].map(y => (0.5 - y * 0.5) * 1920);
      const rc = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys), who: rig.id };
      if (rig.id === 'BU') rc.y0 -= (rc.y1 - rc.y0) * 0.42;   // his curls and the ushnisha stand above the face: plates keep clear of them too
      if (rc.x1 - rc.x0 < 46) return;   // a far face (under about 46 px wide) is not a face a card can cover
      if (rc.x1 > 0 && rc.x0 < 1080 && rc.y1 > 0 && rc.y0 < 1920) out.push(rc); });
    return out; }
  function renderShot(i, t, out) {
    const s = SH[i], set = X[s.set]; const lt = t - starts[i];
    const look = s.run(t, lt, X) || {};
    set.scene.updateMatrixWorld(true); X.cam.updateMatrixWorld(true);
    stage.shot(set.scene, X.cam, look, out, t);
    return { faces: faceRects(X.cam, set), look, id: s.id };
  }
  function idxAt(t) { let i = 0; for (let k = 0; k < starts.length; k++) if (t >= starts[k]) i = k; return i; }
  window.seek = function (t) {
    t = Math.max(0, Math.min(DUR, +t || 0));
    const i = idxAt(t), s = SH[i], lt = t - starts[i], dur = s.trDur || 0;
    let k = 1, type = 'cut', infoA = null;
    if (i > 0 && s.tr && s.tr !== 'cut' && lt < dur) { k = lt / dur; type = s.tr; infoA = renderShot(i - 1, t, stage.outA); }
    const info = renderShot(i, t, stage.outB);
    stage.present(k, type, 0.5, 0.5);
    og.clearRect(0, 0, 1080, 1920);
    const faces = k < 0.5 && infoA ? infoA.faces : info.faces;
    const odraw = !Q.has('clean') ? BOVERLAY.draw(og, t, faces) : null;
    window.__info = { t: +t.toFixed(3), shot: s.id, tr: k < 1 ? type : null, faces, overlay: odraw };
    return window.__info;
  };
  // composited frame (WebGL + overlay) for export and stills
  const cvE = document.getElementById('cv'), comp = document.createElement('canvas'); comp.width = cvE.width; comp.height = cvE.height; const cg = comp.getContext('2d', { willReadFrequently: false }); cg.imageSmoothingQuality = 'high';
  window.frameTo = function (t) { window.seek(t); cg.drawImage(cvE, 0, 0); cg.drawImage(ov, 0, 0, comp.width, comp.height); return comp; };
  window.frameB64 = function (t, q) { return window.frameTo(t).toDataURL('image/jpeg', q || 0.92).slice(23); };
  window.seek(+Q.get('t') || 0); window.__bootMs = Math.round(performance.now() - t00); window.__ready = true;
  if (EMBED) return;
  const au = document.getElementById('au'), pp = document.getElementById('pp'), sc = document.getElementById('sc'), tm = document.getElementById('tm'), lg = document.getElementById('lg');
  lg.textContent = window.CAP_LANG === 'en' ? 'EN' : 'HI'; lg.onclick = () => { const q = new URLSearchParams(location.search); if (window.CAP_LANG === 'en') q.delete('cap'); else q.set('cap', 'en'); q.set('t', sc.value); location.search = q.toString(); }; if (Q.get('dub') === 'en') lg.style.display = 'none';
  let hasAudio = false; const srcs = Q.get('dub') === 'en' ? ['audio/mix-en.wav', 'audio/mix-en.mp3'] : ['audio/mix.wav', 'audio/mix.mp3', 'audio/voice.mp3']; let si = 0; au.src = srcs[0]; au.addEventListener('canplay', () => { hasAudio = true; }); au.addEventListener('error', () => { hasAudio = false; if (++si < srcs.length) au.src = srcs[si]; });
  sc.max = DUR; sc.value = +Q.get('t') || 0; let playing = false, t0 = 0, base = +Q.get('t') || 0;
  function tick() { if (!playing) return; const t = hasAudio ? au.currentTime : base + (performance.now() - t0) / 1000; if (t >= DUR) { playing = false; pp.textContent = 'Play'; return; }
    window.seek(t); sc.value = t; tm.textContent = t.toFixed(2) + ' s'; requestAnimationFrame(tick); }
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; if (playing) { base = +sc.value; t0 = performance.now(); if (hasAudio) { au.currentTime = base; au.play().catch(() => {}); } tick(); } else { au.pause(); } };
  sc.oninput = () => { const t = +sc.value; base = t; t0 = performance.now(); if (hasAudio) au.currentTime = t; if (!playing) window.seek(t); tm.textContent = t.toFixed(2) + ' s'; };
  }
  const fonts = ['800 80px "Baloo 2"', '600 80px "Baloo 2"', '700 80px "Rajdhani"', '600 80px "Rajdhani"'];
  const go = () => { try { boot(); } catch (e) { console.error(e); window.__bootError = String(e.stack || e); throw e; } };
  (document.fonts && document.fonts.load ? Promise.race([Promise.all(fonts.map(f => document.fonts.load(f).catch(() => {}))), new Promise(r => setTimeout(r, 6000))]) : Promise.resolve()).then(go, go);
})();
</script>
</body>
</html>
